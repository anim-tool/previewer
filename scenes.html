                buildFor(skeletonName) {
                    this.clearFor(skeletonName);
                    const sk = state.skeletons[skeletonName];
                    if (!sk || !sk.skeleton || !sk.addSlotObject) return;
                    const slots = sk.skeleton.slots || [];
                    const items = [];
                    for (let i = 0; i < slots.length; i++) {
                        const slot = slots[i];
                        const name = slot.data && slot.data.name;
                        if (!name || name.indexOf(this.PREFIX) < 0) continue;
                        const text = new PIXI.Text({
                            text: name,
                            style: {
                                fontFamily: 'Arial',
                                fontSize: this.getFontSize(),
                                fill: 0xffffff,
                                stroke: { color: 0x000000, width: 3, join: 'round' },
                                align: 'center'
                            }
                        });
                        text.anchor.set(0.5, 0.5);
                        text.renderable = state.showPlaceholders;
                        text.collectRenderables = slotCollectRenderables;
                        sk.addSlotObject(name, text);
                        items.push({ slot: slot, text: text });
                    }
                    this.entries[skeletonName] = { spine: sk, items: items };
                    sk.afterUpdateWorldTransforms = () => {
                        this.applyColor(skeletonName);
                    };
                    this.applyColor(skeletonName);
                },

                clearFor(skeletonName) {
                    const entry = this.entries[skeletonName];
                    if (entry) {
                        const sk = entry.spine;
                        if (sk && !sk.destroyed && sk.skeleton) {
                            sk.afterUpdateWorldTransforms = () => {};
                        }
                        for (let i = 0; i < entry.items.length; i++) {
                            const it = entry.items[i];
                            if (sk && !sk.destroyed && sk.removeSlotObject) {
                                try { sk.removeSlotObject(it.slot); } catch (e) {}
                            }
                            if (it.text && !it.text.destroyed) it.text.destroy({ children: true });
                        }
                    }
                    delete this.entries[skeletonName];
                },

                resetAll() {
                    Object.keys(this.entries).forEach(name => this.clearFor(name));
                },

                setVisible(visible) {
                    Object.keys(this.entries).forEach(skeletonName => {
                        const entry = this.entries[skeletonName];
                        for (let i = 0; i < entry.items.length; i++) {
                            const it = entry.items[i];
                            if (it.text && !it.text.destroyed) it.text.renderable = visible;
                        }
                    });
                },

                applyColor(skeletonName) {
                    const entry = this.entries[skeletonName];
                    if (!entry) return;
                    if (!state.showPlaceholders) return;
                    for (let i = 0; i < entry.items.length; i++) {
                        const it = entry.items[i];
                        const c = it.slot.color;
                        if (!c || !it.text || it.text.destroyed) continue;
                        const r = Math.round(c.r * 255);
                        const g = Math.round(c.g * 255);
                        const b = Math.round(c.b * 255);
                        it.text.tint = (r << 16) | (g << 8) | b;
                    }
                },

                detectZeroAlpha(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    if (!sk || !sk.skeleton || !sk.skeleton.data) return [];
                    const data = sk.skeleton.data;
                    const slotsData = data.slots || [];
                    const placeholderSlots = {};
                    for (let i = 0; i < slotsData.length; i++) {
                        const name = slotsData[i].name;
                        if (name && name.indexOf(this.PREFIX) >= 0) {
                            placeholderSlots[i] = name;
                        }
                    }
                    if (Object.keys(placeholderSlots).length === 0) return [];

                    const PROP_ALPHA = '9';
                    const animations = data.animations || [];
                    const warnings = [];
                    for (let a = 0; a < animations.length; a++) {
                        const anim = animations[a];
                        const timelines = anim.timelines || [];
                        for (let t = 0; t < timelines.length; t++) {
                            const timeline = timelines[t];
                            const propIds = timeline.getPropertyIds ? timeline.getPropertyIds() : timeline.propertyIds;
                            if (!propIds) continue;
                            let slotIndex = -1;
                            for (let p = 0; p < propIds.length; p++) {
                                const pid = String(propIds[p]);
                                const sep = pid.indexOf('|');
                                if (sep < 0) continue;
                                if (pid.substring(0, sep) !== PROP_ALPHA) continue;
                                const idx = parseInt(pid.substring(sep + 1), 10);
                                if (placeholderSlots[idx] !== undefined) { slotIndex = idx; break; }
                            }
                            if (slotIndex < 0) continue;
                            const entries = timeline.getFrameEntries();
                            const frameCount = timeline.getFrameCount();
                            const alphaOffset = entries === 2 ? 1 : 4;
                            const times = [];
                            for (let f = 0; f < frameCount; f++) {
                                const base = f * entries;
                                if (timeline.frames[base + alphaOffset] === 0) {
                                    times.push(Math.round(timeline.frames[base] * 30));
                                }
                            }
                            if (times.length > 0) {
                                warnings.push('[' + skeletonName + '] "' + placeholderSlots[slotIndex] + '" in "' + anim.name + '": 0 alpha at frames: ' + times.join(', '));
                            }
                        }
                    }
                    return warnings;
                },

                listPlaceholders() {
                    const result = [];
                    Object.keys(state.skeletons).forEach(skeletonName => {
                        const sk = state.skeletons[skeletonName];
                        if (!sk || !sk.skeleton || !sk.skeleton.data) return;
                        const slotsData = sk.skeleton.data.slots || [];
                        for (let i = 0; i < slotsData.length; i++) {
                            const name = slotsData[i].name;
                            if (name && name.indexOf(this.PREFIX) >= 0) {
                                result.push(skeletonName + '|' + name);
                            }
                        }
                    });
                    return result;
                }
            };

            const playlistManager = {
                parse(text) {
                    return text
                        .split('\n')
                        .map(line => line.trim())
                        .filter(line => line.length > 0 && line.includes('|'))
                        .map(line => {
                            const [skeletonName, animationName] = line.split('|').map(s => s.trim());
                            return { skeletonName, animationName };
                        });
                },

                playAnimation(skeletonName, animationName, loop) {
                    if (!state.loadedSkeletons.has(skeletonName)) return;

                    const resolution = getEffectiveResolution(skeletonName, animationName);
                    skeletonManager.switchTo(skeletonName, resolution);

                    const trackEntry = state.currentSkeleton.state.setAnimation(0, animationName, loop);
                    return trackEntry;
                },

                async playAtIndex(index) {
                    if (index >= state.playlist.length) {
                        if (!state.player.loop) {
                            state.player.playing = false;
                            playerManager.updatePlayPauseButton();
                            return;
                        }
                        index = 0;
                    }

                    if (state.playlist.length === 0) return;

                    const item = state.playlist[index];
                    if (!state.loadedSkeletons.has(item.skeletonName)) return;

                    state.currentIndex = index;
                    playerManager.resetPhase();
                    uiControls.updateHighlighting();

                    const gen = state.scenarioGeneration;
                    const trackEntry = this.playAnimation(item.skeletonName, item.animationName, false);

                    uiControls.updateInfoOverlay();

                    if (trackEntry) {
                        if (state.player.pauseBefore) {
                            playerManager.startPauseBefore();
                        }

                        trackEntry.listener = {
                            complete: () => {
                                if (state.scenarioGeneration === gen && state.activeMode === 'scenario') {
                                    if (state.player.pauseAfter) {
                                        playerManager.startPauseAfter(() => {
                                            this.playAtIndex(index + 1);
                                        });
                                    } else {
                                        this.playAtIndex(index + 1);
                                    }
                                }
                            }
                        };
                    }

                    playerManager.applyPlaybackState();
                },

                playSingleAnimation(skeletonName, animationName) {
                    state.scenarioGeneration++;
                    state.activeMode = 'animation';
                    state.activeAnimation = { skeletonName, animationName };
                    playerManager.resetPhase();

                    const useNativeLoop = state.player.loop && !state.player.pauseBefore && !state.player.pauseAfter;
                    const trackEntry = this.playAnimation(skeletonName, animationName, useNativeLoop);
                    uiControls.updateHighlighting();
                    uiControls.updateInfoOverlay();

                    if (trackEntry) {
                        if (state.player.pauseBefore) {
                            playerManager.startPauseBefore();
                        }

                        if (!useNativeLoop) {
                            this.attachAnimationListener(skeletonName, animationName, trackEntry);
                        }
                    }

                    playerManager.applyPlaybackState();
                },

                attachAnimationListener(skeletonName, animationName, trackEntry) {
                    if (!trackEntry) return;
                    trackEntry.listener = {
                        complete: () => {
                            if (state.activeMode !== 'animation' || !state.activeAnimation ||
                                state.activeAnimation.skeletonName !== skeletonName ||
                                state.activeAnimation.animationName !== animationName) {
                                return;
                            }

                            const handleEnd = () => {
                                if (!state.player.loop) return;
                                const t = state.currentSkeleton.state.setAnimation(0, animationName, false);
                                if (t) {
                                    this.attachAnimationListener(skeletonName, animationName, t);
                                    if (state.player.pauseBefore) {
                                        playerManager.startPauseBefore();
                                    }
                                }
                            };

                            if (state.player.pauseAfter) {
                                playerManager.startPauseAfter(handleEnd);
                            } else {
                                handleEnd();
                            }
                        }
                    };
                },

                reconfigureAnimationPlayback() {
                    if (state.activeMode !== 'animation' || !state.activeAnimation || !state.currentSkeleton) return;
                    const skeletonName = state.activeAnimation.skeletonName;
                    const animationName = state.activeAnimation.animationName;
                    const track = state.currentSkeleton.state.getCurrent(0);
                    if (!track || !track.animation) return;

                    const nativeLoop = state.player.loop && !state.player.pauseBefore && !state.player.pauseAfter;
                    track.loop = nativeLoop;
                    if (nativeLoop) {
                        track.listener = null;
                    } else {
                        this.attachAnimationListener(skeletonName, animationName, track);
                    }
                },

                validatePlaylist(playlist) {
                    const errors = [];
                    const seen = new Set();
                    playlist.forEach((item, idx) => {
                        const key = item.skeletonName + '|' + item.animationName;
                        if (seen.has(key)) return;
                        seen.add(key);
                        if (!state.loadedSkeletons.has(item.skeletonName)) {
                            errors.push('Line ' + (idx + 1) + ': skeleton "' + item.skeletonName + '" not loaded');
                        } else {
                            const anims = state.availableAnimations
                                .filter(a => a.skeletonName === item.skeletonName)
                                .map(a => a.animationName);
                            if (!anims.includes(item.animationName)) {
                                errors.push('Line ' + (idx + 1) + ': animation "' + item.animationName + '" not found in "' + item.skeletonName + '"');
                            }
                        }
                    });
                    return errors;
                },

                async onTextChange(text) {
                    state._lastScenarioText = text;
                    state.scenarioGeneration++;
                    if (state.currentSkeleton) {
                        state.currentSkeleton.state.clearTracks();
                    }

                    state.playlist = this.parse(text);
                    const errors = this.validatePlaylist(state.playlist);
                    state.playlistErrors = errors;
                    state.hasPlaylistError = errors.length > 0;
                    showChecksIfAny();

                    if (state.playlist.length > 0) {
                        playerManager.updatePlayPauseButton();
                        if (state.activeMode === 'scenario') {
                            await this.playAtIndex(0);
                        }
                    } else {
                        state.player.playing = false;
                        playerManager.updatePlayPauseButton();
                    }
                    playerManager.updateScenarioTimelineVisibility();
                },

                activateScenario() {
                    if (state.activeMode !== 'scenario') {
                        skeletonManager.resetInstances();
                    }
                    state.scenarioGeneration++;
                    state.activeMode = 'scenario';
                    state.activeAnimation = null;
                    playerManager.updateScenarioTimelineVisibility();
                    if (state.playlist.length > 0) {
                        playerManager.updatePlayPauseButton();
                        const idx = Math.min(Math.max(state.currentIndex, 0), state.playlist.length - 1);
                        this.playAtIndex(idx);
                    }
                    uiControls.updateHighlighting();
                },

                enterIdleAnimationMode() {
                    state.scenarioGeneration++;
                    state.activeMode = 'animation';
                    state.activeAnimation = null;
                    playerManager.resetPhase();

                    if (state.currentSkeleton) {
                        state.currentSkeleton.state.clearTracks();
                        if (state.currentSkeleton.parent) {
                            state.currentSkeleton.parent.removeChild(state.currentSkeleton);
                        }
                    }

                    uiControls.updateInfoOverlay();
                    uiControls.updateHighlighting();
                }
            };

            const playerManager = {
                PAUSE_DURATION: 1.0,

                getAnimationDuration(skeletonName, animationName) {
                    const sk = state.skeletons[skeletonName];
                    const data = sk && sk.skeleton ? sk.skeleton.data : null;
                    if (data && data.animations) {
                        for (let i = 0; i < data.animations.length; i++) {
                            if (data.animations[i].name === animationName) {
                                return data.animations[i].duration;
                            }
                        }
                    }
                    const cached = state.animationDurations[skeletonName];
                    if (cached && cached[animationName] !== undefined) {
                        return cached[animationName];
                    }
                    return 0;
                },

                getScenarioTotalDuration() {
                    let total = 0;
                    for (let i = 0; i < state.playlist.length; i++) {
                        total += this.getItemEffectiveDuration(state.playlist[i]);
                    }
                    return total;
                },

                getItemEffectiveDuration(item) {
                    let dur = this.getAnimationDuration(item.skeletonName, item.animationName);
                    if (state.player.pauseBefore) dur += this.PAUSE_DURATION;
                    if (state.player.pauseAfter) dur += this.PAUSE_DURATION;
                    return dur;
                },

                applyPlaybackState() {
                    if (state.activeMode === 'museum' || !state.currentSkeleton) return;
                    const shouldRun = state.player.playing && state.player.phase === 'none';
                    state.currentSkeleton.state.timeScale = shouldRun ? 1 : 0;
                },

                play() {
                    state.player.playing = true;
                    this.updatePlayPauseButton();
                    if (state.currentSkeleton && state.player.phase === 'none') {
                        state.currentSkeleton.state.timeScale = 1;
                    }
                    state.player.lastTickTime = performance.now();
                },

                pause() {
                    state.player.playing = false;
                    this.updatePlayPauseButton();
                    if (state.currentSkeleton) {
                        state.currentSkeleton.state.timeScale = 0;
                    }
                    this.resetPhase();
                },

                togglePlay() {
                    if (state.player.playing) {
                        const wasPauseAfter = state.player.phase === 'pauseAfter';
                        const anim = state.activeAnimation;
                        this.pause();
                        if (wasPauseAfter && state.activeMode === 'animation' && anim) {
                            playlistManager.playSingleAnimation(anim.skeletonName, anim.animationName);
                            this.resetPhase();
                            if (state.currentSkeleton) {
                                state.currentSkeleton.state.timeScale = 0;
                            }
                        }
                    } else {
                        this.play();
                    }
                },

                toggleLoop() {
                    state.player.loop = !state.player.loop;
                    this.updateLoopButton();
                    playlistManager.reconfigureAnimationPlayback();
                },

                togglePauseBefore() {
                    state.player.pauseBefore = !state.player.pauseBefore;
                    this.updatePauseBeforeButton();
                    this.updateScenarioTimelineVisibility();
                    playlistManager.reconfigureAnimationPlayback();
                },

                togglePauseAfter() {
                    state.player.pauseAfter = !state.player.pauseAfter;
                    this.updatePauseAfterButton();
                    this.updateScenarioTimelineVisibility();
                    playlistManager.reconfigureAnimationPlayback();
                },

                updatePlayPauseButton() {
                    const btn = document.getElementById('playPauseBtn');
                    if (state.player.playing) {
                        btn.title = 'Pause';
                        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';
                    } else {
                        btn.title = 'Play';
                        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>';
                    }
                },

                updateLoopButton() {
                    const btn = document.getElementById('loopBtn');
                    if (state.player.loop) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                },

                updatePauseBeforeButton() {
                    const btn = document.getElementById('pauseBeforeBtn');
                    if (state.player.pauseBefore) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                },

                updatePauseAfterButton() {
                    const btn = document.getElementById('pauseAfterBtn');
                    if (state.player.pauseAfter) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                },

                updatePausePhaseHighlight() {
                    const beforeBtn = document.getElementById('pauseBeforeBtn');
                    const afterBtn = document.getElementById('pauseAfterBtn');
                    if (beforeBtn) beforeBtn.classList.toggle('pause-active', state.player.phase === 'pauseBefore');
                    if (afterBtn) afterBtn.classList.toggle('pause-active', state.player.phase === 'pauseAfter');
                },

                updateScenarioTimelineVisibility() {
                    const timeline = document.getElementById('scenarioTimeline');
                    const wasVisible = timeline.classList.contains('visible');
                    const shouldBeVisible = state.activeMode === 'scenario';
                    if (wasVisible !== shouldBeVisible) {
                        if (shouldBeVisible) {
                            timeline.classList.add('visible');
                        } else {
                            timeline.classList.remove('visible');
                        }
                        this.resizeCanvas();
                    }
                },

                resizeCanvas() {
                    if (state.app) {
                        const container = document.querySelector('.canvas-container');
                        if (container && state.app.screen.width > 0 && state.app.screen.height > 0) {
                            state.app.renderer.resize(container.clientWidth, container.clientHeight);
                            
                            if (state.activeMode === 'museum') {
                                museumManager.drawWorkspace();
                                museumManager.updateAllSkeletonPositions();
                            } else if (state.activeMode === 'scene') {
                                sceneManager.drawWorkspace();
                                sceneManager.updateAllInstancePositions();
                            } else {
                                const relX = state.cameraX / state.app.screen.width;
                                const relY = state.cameraY / state.app.screen.height;
                                skeletonManager.updatePosition(
                                    state.app.screen.width * relX,
                                    state.app.screen.height * relY
                                );
                                graphicsManager.drawAxes();
                            }
                        }
                    }
                },

                startSeeking(type) {
                    state.player._wasPlayingBeforeSeek = state.player.playing;
                    state.player.seeking = true;
                    state.player.seekType = type;
                    this.pause();
                },

                endSeeking() {
                    state.player.seeking = false;
                    state.player.seekType = null;
                    if (state.player._wasPlayingBeforeSeek) {
                        this.play();
                    }
                },

                seekPosition(ratio) {
                    if (!state.currentSkeleton) return;
                    const track = state.currentSkeleton.state.getCurrent(0);
                    if (!track || !track.animation) return;
                    const duration = track.animation.duration;
                    if (duration <= 0) return;
                    this.resetPhase();
                    track.trackTime = ratio * duration;
                },

                seekScenario(ratio) {
                    const totalDuration = this.getScenarioTotalDuration();
                    if (totalDuration <= 0) return;
                    const targetTime = ratio * totalDuration;

                    let elapsed = 0;
                    for (let i = 0; i < state.playlist.length; i++) {
                        const item = state.playlist[i];
                        const itemDur = this.getAnimationDuration(item.skeletonName, item.animationName);
                        const pb = state.player.pauseBefore ? this.PAUSE_DURATION : 0;
                        const pa = state.player.pauseAfter ? this.PAUSE_DURATION : 0;
                        const effective = pb + itemDur + pa;

                        if (i === state.playlist.length - 1 || elapsed + effective > targetTime) {
                            const itemOffset = targetTime - elapsed;

                            state.scenarioGeneration++;
                            state.currentIndex = i;
                            this.resetPhase();
                            uiControls.updateHighlighting();

                            const resolution = getEffectiveResolution(item.skeletonName, item.animationName);
                            skeletonManager.switchTo(item.skeletonName, resolution);
                            const gen = state.scenarioGeneration;
                            const track = state.currentSkeleton.state.setAnimation(0, item.animationName, false);

                            uiControls.updateInfoOverlay();

                            if (track) {
                                if (itemDur <= 0) {
                                    track.trackTime = 0;
                                } else if (itemOffset < pb) {
                                    track.trackTime = 0;
                                } else if (itemOffset < pb + itemDur) {
                                    track.trackTime = itemOffset - pb;
                                } else {
                                    track.trackTime = itemDur;
                                }

                                if (track.animation && track.animation.duration > 0) {
                                    document.getElementById('positionSlider').value = Math.min((track.trackTime / track.animation.duration) * 1000, 1000);
                                }

                                track.listener = {
                                    complete: () => {
                                        if (state.scenarioGeneration === gen && state.activeMode === 'scenario') {
                                            if (state.player.pauseAfter) {
                                                playerManager.startPauseAfter(() => {
                                                    playlistManager.playAtIndex(i + 1);
                                                });
                                            } else {
                                                playlistManager.playAtIndex(i + 1);
                                            }
                                        }
                                    }
                                };
                            }

                            this.applyPlaybackState();
                            return;
                        }
                        elapsed += effective;
                    }
                },

                resetPhase() {
                    state.player.phase = 'none';
                    state.player.phaseElapsed = 0;
                    state.player.pendingAction = null;
                    state.player.stallIndex = -1;
                    state.player.stallSince = 0;
                    this.updatePausePhaseHighlight();
                },

                startPauseBefore() {
                    state.player.phase = 'pauseBefore';
                    state.player.phaseElapsed = 0;
                    if (state.currentSkeleton) {
                        const track = state.currentSkeleton.state.getCurrent(0);
                        if (track) track.trackTime = 0;
                        state.currentSkeleton.state.timeScale = 0;
                    }
                    this.updatePausePhaseHighlight();
                },

                startPauseAfter(callback) {
                    state.player.phase = 'pauseAfter';
                    state.player.phaseElapsed = 0;
                    state.player.pendingAction = callback;
                    if (state.currentSkeleton) {
                        state.currentSkeleton.state.timeScale = 0;
                    }
                    this.updatePausePhaseHighlight();
                },

                onTick() {
                    const now = performance.now();
                    const delta = (now - state.player.lastTickTime) / 1000;
                    state.player.lastTickTime = now;

                    if (state.activeMode === 'scene') {
                        sceneManager.tick(delta);
                        return;
                    }

                    if (state.activeMode === 'museum') {
                        museumManager.updateSelectedPositionSlider();
                        return;
                    }

                    if (!state.currentSkeleton) return;

                    if (state.player.phase === 'pauseBefore') {
                        if (state.player.playing) {
                            state.player.phaseElapsed += delta;
                        }
                        if (state.player.phaseElapsed >= this.PAUSE_DURATION) {
                            state.player.phase = 'none';
                            if (state.player.playing) {
                                state.currentSkeleton.state.timeScale = 1;
                            }
                            this.updatePausePhaseHighlight();
                        }
                        document.getElementById('positionSlider').value = 0;
                        if (state.activeMode === 'scenario') this.updateScenarioSliderPosition();
                        return;
                    }

                    if (state.player.phase === 'pauseAfter') {
                        if (state.player.playing) {
                            state.player.phaseElapsed += delta;
                        }
                        if (state.player.phaseElapsed >= this.PAUSE_DURATION) {
                            state.player.phase = 'none';
                            const action = state.player.pendingAction;
                            state.player.pendingAction = null;
                            if (action) {
                                action();
                            }
                            this.applyPlaybackState();
                            this.updatePausePhaseHighlight();
                            if (action) return;
                        }
                        const track = state.currentSkeleton.state.getCurrent(0);
                        if (track && track.animation && track.animation.duration > 0) {
                            document.getElementById('positionSlider').value = 1000;
                        }
                        if (state.activeMode === 'scenario') this.updateScenarioSliderPosition();
                        return;
                    }

                    if (state.player.seeking) return;

                    const track = state.currentSkeleton.state.getCurrent(0);
                    if (!track || !track.animation) return;

                    const duration = track.animation.duration;
                    if (duration > 0) {
                        let ratio;
                        if (track.loop) {
                            ratio = (track.trackTime % duration) / duration;
                        } else {
                            ratio = Math.min(track.trackTime / duration, 1);
                        }
                        document.getElementById('positionSlider').value = ratio * 1000;
                    } else {
                        document.getElementById('positionSlider').value = 0;
                    }

                    if (state.activeMode === 'scenario' && state.playlist.length > 0) {
                        this.updateScenarioSliderPosition();
                    }

                    if (state.activeMode === 'scenario' && state.playlist.length > 0 &&
                        state.player.playing && !state.player.seeking &&
                        !track.loop && duration > 0) {
                        if (track.trackTime >= duration) {
                            if (state.player.stallIndex !== state.currentIndex) {
                                state.player.stallIndex = state.currentIndex;
                                state.player.stallSince = now;
                            } else if (now - state.player.stallSince > 1500) {
                                const item = state.playlist[state.currentIndex];
                                const animName = item ? item.animationName : '';
                                const skName = item ? item.skeletonName : '';
                                showError('Animation "' + animName + '" of "' + skName + '" did not complete; auto-advancing.');
                                state.player.stallIndex = -1;
                                state.player.stallSince = 0;
                                playlistManager.playAtIndex(state.currentIndex + 1);
                                return;
                            }
                        } else {
                            state.player.stallIndex = -1;
                            state.player.stallSince = 0;
                        }
                    }
                },

                updateScenarioSliderPosition() {
                    let elapsed = 0;

                    for (let i = 0; i < state.currentIndex; i++) {
                        elapsed += this.getItemEffectiveDuration(state.playlist[i]);
                    }

                    const currentItem = state.playlist[state.currentIndex];
                    if (!currentItem) return;

                    const itemDur = this.getAnimationDuration(currentItem.skeletonName, currentItem.animationName);
                    const pb = state.player.pauseBefore ? this.PAUSE_DURATION : 0;

                    if (state.player.phase === 'pauseBefore') {
                        elapsed += Math.min(state.player.phaseElapsed, this.PAUSE_DURATION);
                    } else if (state.player.phase === 'pauseAfter') {
                        elapsed += pb + itemDur + Math.min(state.player.phaseElapsed, this.PAUSE_DURATION);
                    } else {
                        elapsed += pb;
                        const track = state.currentSkeleton ? state.currentSkeleton.state.getCurrent(0) : null;
                        if (track && track.animation && track.animation.duration > 0) {
                            elapsed += Math.min(track.trackTime, track.animation.duration);
                        }
                    }

                    const totalDuration = this.getScenarioTotalDuration();
                    if (totalDuration > 0) {
                        document.getElementById('scenarioSlider').value = Math.min((elapsed / totalDuration) * 1000, 1000);
                    }
                },

                findTextureForAtlas(atlasFileName, textureFiles) {
                    const baseName = atlasFileName.replace('.atlas', '');
                    return textureFiles.find(f => {
                        const name = f.name.replace(/\.(webp|png|jpg)$/, '');
                        return name === baseName;
                    });
                },

                async loadAtlasTexture(skeletonName, resolution, atlasFile, textureFile) {
                    const atlasText = await atlasFile.text();
                    const textureBlobUrl = URL.createObjectURL(textureFile);
                    state.blobUrls.push(textureBlobUrl);
                    const img = new Image();
                    img.src = textureBlobUrl;
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                    });
                    const pixiTexture = PIXI.Texture.from(img);
                    state.pixiTextures.push(pixiTexture);

                    const spineAtlas = new spine.TextureAtlas(atlasText);
                    for (const page of spineAtlas.pages) {
                        page.setTexture(spine.SpineTexture.from(pixiTexture.source));
                    }

                    const cacheKey = skeletonName + 'A@' + resolution;
                    PIXI.Cache.remove(cacheKey);
                    PIXI.Cache.set(cacheKey, spineAtlas);
                },

                collectSpineErrors(fn) {
                    const errors = [];
                    const origError = console.error;
                    const origWarn = console.warn;
                    console.error = (...args) => {
                        errors.push(args.map(a => typeof a === 'string' ? a : a instanceof Error ? a.message : String(a)).join(' '));
                        origError.apply(console, args);
                    };
                    console.warn = (...args) => {
                        errors.push(args.map(a => typeof a === 'string' ? a : a instanceof Error ? a.message : String(a)).join(' '));
                        origWarn.apply(console, args);
                    };
                    try {
                        const result = fn();
                        console.error = origError;
                        console.warn = origWarn;
                        return { result, errors };
                    } catch (e) {
                        console.error = origError;
                        console.warn = origWarn;
                        errors.push(e.message);
                        return { result: null, errors };
                    }
                },

                cleanupPrevious() {

                        state.currentSkeleton.state.clearTracks();
                        state.app.stage.removeChild(state.currentSkeleton);

                    placeholderManager.resetAll();

                    Object.keys(state.skeletons).forEach(key => {

                    });
                    state.blobUrls = [];

                    Object.keys(state.availableResolutions).forEach(skeletonName => {
                        const resKeys = Object.keys(state.availableResolutions[skeletonName]);
                        resKeys.forEach(res => {
                            PIXI.Cache.remove(skeletonName + 'A@' + res);
                        });
                    });

                    Object.keys(state.skeletonResolution).forEach(skeletonName => {
                        PIXI.Cache.remove(skeletonName + 'D');
                    });

                    Object.keys(state.skeletonResolution).forEach(skeletonName => {
                        const resKeys = state.availableResolutions[skeletonName]
                            ? Object.keys(state.availableResolutions[skeletonName])
                            : [];
                        resKeys.forEach(res => {
                            const cacheKey = skeletonName + 'D-' + skeletonName + 'A@' + res + '-1';
                            PIXI.Cache.remove(cacheKey);
                        });
                    });

                        state.skeletons = {};
                        state.skeletonResolution = {};
                        state.availableResolutions = {};
                        state.loadedSkeletons.clear();
                        state.availableAnimations = [];
                        state.animationDurations = {};
                        state.availableSkins = {};
                        state.currentSkeleton = null;
                        state.currentSkeletonName = '';
                        state.currentScale = 1.0;
                        state.cameraX = state.app.screen.width / 2;
                        state.cameraY = state.app.screen.height / 2;
                        state.currentIndex = 0;
                        state.isPlaying = false;
                        state.activeAnimation = null;
                        state._lastScenarioText = '';

                    state.playback.scenario = { playing: true, loop: true, pauseBefore: false, pauseAfter: false };
                    state.playback.animation = { playing: true, loop: true, pauseBefore: false, pauseAfter: false };
                    state.player.phase = 'none';
                    state.player.phaseElapsed = 0;
                    state.player.pendingAction = null;

                    playerManager.updateLoopButton();

                    if (state.axesGraphics) {

                    skeletonManager.updateScale(1.0, true);
                    skeletonManager.updatePosition(state.cameraX, state.cameraY);
                    graphicsManager.drawAxes();
                    hideError();
                    state.hasLoadError = false;
                    state.loadErrors = [];
                    state.hasPlaylistError = false;
                    state.playlistErrors = [];
                    state.zeroAlphaWarnings = [];
                    document.getElementById('skinSection').classList.remove('visible');
                },

                async handleFiles(fileList) {
                    const files = Array.from(fileList);
                    const skelFiles = files.filter(f => f.name.endsWith('.skel')).sort((a, b) => a.name.localeCompare(b.name));
                    const atlasFiles = files.filter(f => f.name.endsWith('.atlas'));
                    const textureFiles = files.filter(f => /\.(webp|png|jpg)$/.test(f.name));

                    if (skelFiles.length === 0) {
                        alert('Skeleton file (.skel) not found');
                        return;
                    }

                    this.showLoading();

                    try {
                        this.cleanupPrevious();
                        state.scenarioGeneration++;

                        let scenarioText = '';

                        for (const skelFile of skelFiles) {
                            const skeletonName = skelFile.name.replace('.skel', '');

                            const skelData = new Uint8Array(await skelFile.arrayBuffer());
                            PIXI.Cache.set(skeletonName + 'D', skelData);

                            const resolutions = {};

                            const atlas2x = atlasFiles.find(f => f.name === skeletonName + '@2x.atlas');
                            if (atlas2x) {
                                const tex2x = this.findTextureForAtlas(atlas2x.name, textureFiles);
                                if (tex2x) {
                                    await this.loadAtlasTexture(skeletonName, '2x', atlas2x, tex2x);
                                    resolutions['2x'] = true;
                                }
                            }

                            const atlas1x = atlasFiles.find(f => f.name === skeletonName + '@1x.atlas');
                            if (atlas1x) {
                                const tex1x = this.findTextureForAtlas(atlas1x.name, textureFiles);
                                if (tex1x) {
                                    await this.loadAtlasTexture(skeletonName, '1x', atlas1x, tex1x);
                                    resolutions['1x'] = true;
                                }
                            }

                            if (!resolutions['2x'] && !resolutions['1x']) {
                                const atlasDefault = atlasFiles.find(f => f.name === skeletonName + '.atlas');
                                if (atlasDefault) {
                                    const texDefault = this.findTextureForAtlas(atlasDefault.name, textureFiles);
                                    if (texDefault) {
                                        await this.loadAtlasTexture(skeletonName, '2x', atlasDefault, texDefault);
                                        resolutions['2x'] = true;
                                    }
                                }
                            }

                            if (Object.keys(resolutions).length === 0) {
                                console.warn('No atlas/texture found for ' + skeletonName);
                                continue;
                            }

                            state.availableResolutions[skeletonName] = resolutions;
                            state.loadedSkeletons.add(skeletonName);

                            const initialRes = state.sdMode ? (resolutions['1x'] ? '1x' : Object.keys(resolutions)[0]) : (resolutions['2x'] ? '2x' : Object.keys(resolutions)[0]);

                            if (!state.skeletons[skeletonName]) {
                                const { result, errors } = this.collectSpineErrors(() => {
                                    return skeletonManager.createSkeleton(skeletonName, initialRes);
                                });
                                if (result) {
                                    state.skeletons[skeletonName] = result;
                                    state.skeletonResolution[skeletonName] = initialRes;
                                    placeholderManager.buildFor(skeletonName);
                                }
                                if (errors.length > 0) {
                                    state.loadErrors.push('[' + skeletonName + '] ' + errors.join('\n'));
                                    state.hasLoadError = true;
                                }
                            }

                            const skeletonObj = state.skeletons[skeletonName];
                            if (!skeletonObj) continue;

                            let animationList = [];
                            try {
                                const skeletonData = skeletonObj.skeleton?.data || skeletonObj.state?.data?.skeletonData;
                                animationList = skeletonData?.animations || [];
                            } catch (e) {
                                console.error('Failed to read animations:', e);
                            }

                            const durations = {};
                            animationList.forEach(a => {
                                const animName = a.name;
                                state.availableAnimations.push({ skeletonName, animationName: animName });
                                durations[animName] = a.duration;
                            });
                            state.animationDurations[skeletonName] = durations;

                            const zeroWarnings = placeholderManager.detectZeroAlpha(skeletonName);
                            if (zeroWarnings.length > 0) {
                                state.zeroAlphaWarnings = state.zeroAlphaWarnings.concat(zeroWarnings);
                            }

                            const skins = skinManager.readSkins(skeletonName);
                            state.availableSkins[skeletonName] = skins;

                            const newLines = animationList.map(a => skeletonName + '|' + a.name);
                            if (scenarioText.trim()) {
                                scenarioText += '\n' + newLines.join('\n');
                            } else {
                                scenarioText = newLines.join('\n');
                            }
                        }

                        uiControls.renderAnimationsList();
                        await playlistManager.onTextChange(scenarioText);
                        sceneManager.onSkeletonsChanged();
                    } catch (error) {
                        console.error('Upload error:', error);
                        state.loadErrors.push('Upload error: ' + error.message);
                        state.hasLoadError = true;
                    } finally {
                        this.hideLoading();
                    }
                },

                async traverseEntry(entry) {
                    if (entry.isFile) {
                        return new Promise((resolve) => {
                            entry.file((file) => {
                                if (/\.(skel|atlas|webp|png|jpg)$/.test(file.name)) {
                                    resolve([file]);
                                } else {
                                    resolve([]);
                                }
                            }, () => resolve([]));
                        });
                    } else if (entry.isDirectory) {
                        const reader = entry.createReader();
                        const entries = await new Promise((resolve) => {
                            const results = [];
                            const readBatch = () => {
                                reader.readEntries((batch) => {
                                    if (batch.length === 0) {
                                        resolve(results);
                                    } else {
                                        results.push(...batch);
                                        readBatch();
                                    }
                                }, () => resolve(results));
                            };
                            readBatch();
                        });
                        const nested = await Promise.all(entries.map(e => this.traverseEntry(e)));
                        return nested.flat();
                    }
                    return [];
                },

                async collectFilesFromDataTransfer(dataTransfer) {
                    const items = dataTransfer.items;
                    if (items && items.length > 0 && items[0].webkitGetAsEntry) {
                        const entries = [];
                        for (let i = 0; i < items.length; i++) {
                            const entry = items[i].webkitGetAsEntry();
                            if (entry) entries.push(entry);
                        }
                        const nested = await Promise.all(entries.map(e => this.traverseEntry(e)));
                        return nested.flat();
                    }
                    return Array.from(dataTransfer.files).filter(f => /\.(skel|atlas|webp|png|jpg)$/.test(f.name));
                },

                initDragDrop() {
                    const dropZone = document.getElementById('dropZone');
                    let dragCounter = 0;

                    document.addEventListener('dragenter', (e) => {
                        e.preventDefault();
                        if (e.dataTransfer.types.includes('Files')) {
                            dragCounter++;
                            dropZone.classList.add('active');
                        }
                    });

                    document.addEventListener('dragleave', (e) => {
                        e.preventDefault();
                        dragCounter--;
                        if (dragCounter <= 0) {
                            dragCounter = 0;
                            dropZone.classList.remove('active');
                        }
                    });

                    document.addEventListener('dragover', (e) => {
                        e.preventDefault();
                    });

                    document.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        dragCounter = 0;
                        dropZone.classList.remove('active');
                        const files = await this.collectFilesFromDataTransfer(e.dataTransfer);
                        if (files.length > 0) {
                            this.handleFiles(files);
                        }
                    });
                },

                initUploadButton() {
                    const uploadButton = document.getElementById('uploadButton');
                    const fileInput = document.getElementById('fileInput');

                initResize() {
                    const resizeHandle = document.getElementById('resize-handle');
                    const leftPanel = document.querySelector('.left-panel');

                    resizeHandle.addEventListener('mousedown', (e) => {
                        state.isResizing = true;
                        state.resizeStartX = e.clientX;
                        state.leftPanelStartWidth = leftPanel.offsetWidth;
                        document.body.style.cursor = 'col-resize';
                        document.body.style.userSelect = 'none';

                    });

                    document.addEventListener('mousemove', (e) => {
                        if (!state.isResizing) return;
                        const deltaX = e.clientX - state.resizeStartX;
                        const newWidth = state.leftPanelStartWidth + deltaX;
                        if (newWidth > 0) {
                            leftPanel.style.width = newWidth + 'px';
                            this.handlePanelResize(newWidth);
                            if (state.activeMode !== 'museum') {
                                graphicsManager.drawAxes();

                        if (state.isResizing) {
                            state.isResizing = false;
                            document.body.style.cursor = '';
                            document.body.style.userSelect = '';
                            this.setStoredPanelWidth(leftPanel.offsetWidth);

                handlePanelResize(panelWidth) {
                    if (state.app) {
                        const container = document.querySelector('.canvas-container');
                        if (!container) return;
                        state.app.renderer.resize(container.clientWidth, container.clientHeight);
                        
                        if (state.activeMode === 'museum') {
                            museumManager.drawWorkspace();
                            museumManager.updateAllSkeletonPositions();
                        } else if (state.activeMode === 'scene') {
                            sceneManager.drawWorkspace();
                            sceneManager.updateAllInstancePositions();
                        } else {
                            const oldWidth = state.app.screen.width;
                            const oldHeight = state.app.screen.height;
                            if (oldWidth === 0 || oldHeight === 0) return;
                            let relativeX = state.cameraX / oldWidth;
                            let relativeY = state.cameraY / oldHeight;
                            skeletonManager.updatePosition(
                                state.app.screen.width * relativeX,
                                state.app.screen.height * relativeY
                            );
                            graphicsManager.drawAxes();
                        }
                    }

                    canvas.addEventListener('mousedown', (e) => {
                        if (state.activeMode === 'museum' || state.activeMode === 'scene') return;
                        if (!state.currentSkeleton) return;
                        state.isDragging = true;
                        state.dragStartX = e.clientX;
                        state.dragStartY = e.clientY;
                        state.skeletonStartX = state.cameraX;
                        state.skeletonStartY = state.cameraY;
                        canvas.style.cursor = 'grabbing';
                    });
                    document.addEventListener('mousemove', (e) => {
                        if (!state.isDragging || !state.currentSkeleton) return;
                        const deltaX = e.clientX - state.dragStartX;
                        const deltaY = e.clientY - state.dragStartY;
                        skeletonManager.updatePosition(
                            state.skeletonStartX + deltaX,
                            state.skeletonStartY + deltaY
                        );
                        graphicsManager.drawAxes();

                    document.addEventListener('mouseup', () => {

                            state.isDragging = false;
                            canvas.style.cursor = '';

                initScaleControl() {
                    const canvas = document.getElementById('canvas');
                    canvas.addEventListener('wheel', (e) => {
                        e.preventDefault();
                        
                        if (state.activeMode === 'scene') {
                            return;
                        }

                        if (state.activeMode === 'museum') {
                            const factor = e.deltaY > 0 ? 0.9 : 1.1;
                            const newScale = Math.max(0.05, Math.min(2.0, state.museum.cameraScale * factor));
                            
                            const rect = canvas.getBoundingClientRect();
                            const mouseX = e.clientX - rect.left;
                            const mouseY = e.clientY - rect.top;
                            
                            const worldX = (mouseX - state.museum.cameraOffsetX) / state.museum.cameraScale;
                            const worldY = (mouseY - state.museum.cameraOffsetY) / state.museum.cameraScale;
                            
                            state.museum.cameraScale = newScale;
                            
                            state.museum.cameraOffsetX = mouseX - worldX * state.museum.cameraScale;
                            state.museum.cameraOffsetY = mouseY - worldY * state.museum.cameraScale;
                            
                            museumManager.updateAllSkeletonPositions();
                            museumManager.drawWorkspace();
                            uiControls.updateScaleSlider(state.museum.cameraScale);
                        } else {
                            const factor = e.deltaY > 0 ? 0.9 : 1.1;
                            const newScale = Math.round(state.currentScale * factor * 100) / 100;
                            skeletonManager.updateScale(newScale, true);
                        }
                    });
                },

                onWindowResize() {
                    const leftPanel = document.querySelector('.left-panel');
                    this.handlePanelResize(leftPanel.offsetWidth);
                    const sceneTimeline = document.getElementById('sceneTimeline');
                    if (sceneTimeline) {

            async function initPixi() {
                state.app = new PIXI.Application();
                const container = document.querySelector('.canvas-container');
                const L = state.themeL != null ? state.themeL : 30;
                const bgHex = (L << 16) | (L << 8) | L;
                await state.app.init({
                    canvas: document.getElementById('canvas'),
                    width: container ? container.clientWidth : (window.innerWidth - 300),
                    height: container ? container.clientHeight : window.innerHeight,
                    backgroundColor: bgHex,
                    antialias: true,
                    resolution: window.devicePixelRatio || 1,
                    autoDensity: true
                });

                const renderer = state.app.renderer;
                const origRendererRender = renderer.render.bind(renderer);
                let lastRenderErrorTime = 0;
                renderer.render = function(options) {
                    try {
                        return origRendererRender(options);
                    } catch (e) {
                        const now = Date.now();
                        if (now - lastRenderErrorTime > 3000) {
                            lastRenderErrorTime = now;
                            showError('Render error: ' + (e && e.message ? e.message : String(e)));
                        }
                    }
                };

                window.addEventListener('error', (e) => {
                    const msg = e && e.error && e.error.message ? e.error.message : (e && e.message ? e.message : '');
                    if (msg) {
                        showError('Uncaught error: ' + msg);
                    }
                });

                window.addEventListener('resize', () => eventHandlers.onWindowResize());
            }

                document.getElementById('errorBlockClose').addEventListener('click', hideError);

                document.getElementById('errorBlockCopy').addEventListener('click', () => {
                    const text = document.getElementById('errorBlockText').textContent || '';
                    if (!text) return;
                    const fallback = (str) => {
                        const ta = document.createElement('textarea');
                        ta.value = str;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (e) {}
                        document.body.removeChild(ta);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).catch(() => fallback(text));
                    } else {
                        fallback(text);
                    }
                });

                fileHandler.initDragDrop();
                fileHandler.initUploadButton();
                fileHandler.initFolderButton();

                playerManager.init();
                state.app.ticker.add(() => {
                    try {
                        playerManager.onTick();
                    } catch (e) {
                        console.error('Ticker error:', e);
                    }
                });

                graphicsManager.drawAxes();
                uiControls.updateHighlighting();

                await playlistManager.onTextChange(getScenarioPlainText());
            }

            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
