                    state.app.stage.addChild(state.museum.centerDiamondGraphics);

                    const skeletonNames = Array.from(state.loadedSkeletons).sort((a, b) => this.sortSkeletonsForLayering(a, b));
                    const layout = this.computeLayout();
                    const savedState = this.loadState() || {};
                    const isFirstBuild = state.museum.skeletons.length === 0;

                    if (isFirstBuild) {
                        state.museum.skeletons = skeletonNames.map((name) => {
                            const pos = layout[name] || { x: 0, y: 0 };
                            const saved = savedState.skeletonStates ? savedState.skeletonStates[name] : null;
                            if (saved) {
                                const anim = (saved.animation && this.hasAnimation(name, saved.animation))
                                    ? saved.animation
                                    : this.getDefaultAnimation(name);
                                return {
                                    skeletonName: name,
                                    visible: saved.visible !== undefined ? saved.visible : true,
                                    animation: anim,
                                    isPlaying: saved.isPlaying !== undefined ? saved.isPlaying : true,
                                    worldX: saved.x,
                                    worldY: saved.y
                                };
                            }
                            return {
                                skeletonName: name,
                                visible: true,
                                animation: this.getDefaultAnimation(name),
                                isPlaying: true,
                                worldX: pos.x,
                                worldY: pos.y
                            };
                        });
                        
                        if (savedState.skeletonOrder && savedState.skeletonOrder.length > 0) {
                            state.museum.skeletons.sort((a, b) => {
                                const indexA = savedState.skeletonOrder.indexOf(a.skeletonName);
                                const indexB = savedState.skeletonOrder.indexOf(b.skeletonName);
                                return indexA - indexB;
                            });
                        }
                        
                        if (savedState.cameraState) {
                            if (savedState.cameraState.cameraOffsetX !== undefined) {
                                state.museum.cameraOffsetX = savedState.cameraState.cameraOffsetX;
                            }
                            if (savedState.cameraState.cameraOffsetY !== undefined) {
                                state.museum.cameraOffsetY = savedState.cameraState.cameraOffsetY;
                            }
                            if (savedState.cameraState.cameraScale !== undefined) {
                                state.museum.cameraScale = savedState.cameraState.cameraScale;
                            }
                            if (savedState.cameraState.snapToGrid !== undefined) {
                                state.museum.snapToGrid = savedState.cameraState.snapToGrid;
                            }
                        }
                    } else {
                        const existingNames = state.museum.skeletons.map(s => s.skeletonName);
                        const newNames = skeletonNames.filter(n => !existingNames.includes(n));

                        newNames.forEach((name) => {
                            const pos = layout[name] || { x: 0, y: 0 };
                            const saved = savedState.skeletonStates ? savedState.skeletonStates[name] : null;
                            if (saved) {
                                const anim = (saved.animation && this.hasAnimation(name, saved.animation))
                                    ? saved.animation
                                    : this.getDefaultAnimation(name);
                                state.museum.skeletons.push({
                                    skeletonName: name,
                                    visible: saved.visible !== undefined ? saved.visible : true,
                                    animation: anim,
                                    isPlaying: saved.isPlaying !== undefined ? saved.isPlaying : true,
                                    worldX: saved.x,
                                    worldY: saved.y
                                });
                            } else {
                                state.museum.skeletons.push({
                                    skeletonName: name,
                                    visible: true,
                                    animation: this.getDefaultAnimation(name),
                                    isPlaying: true,
                                    worldX: pos.x,
                                    worldY: pos.y
                                });
                            }
                        });

                         state.museum.skeletons = state.museum.skeletons.filter(s => skeletonNames.includes(s.skeletonName));
                         state.museum.skeletons.sort((a, b) => this.sortSkeletonsForLayering(a.skeletonName, b.skeletonName));
                     }

                     const hasCameraState = savedState.cameraState && (
                         savedState.cameraState.cameraOffsetX !== undefined ||
                         savedState.cameraState.cameraOffsetY !== undefined ||
                         savedState.cameraState.cameraScale !== undefined
                     );

                     if (isFirstBuild && !hasCameraState) {
                         this.fitCameraToContent(this.FIT_PADDING);
                     }

                     skeletonNames.forEach(name => {
                        const item = state.museum.skeletons.find(s => s.skeletonName === name);
                        if (!item) return;

                        const resolution = getEffectiveResolution(name, item.animation);
                        
                        if (!state.skeletons[name]) {
                            try {
                                state.skeletons[name] = skeletonManager.createSkeleton(name, resolution);
                                state.skeletonResolution[name] = resolution;
                                placeholderManager.buildFor(name);
                            } catch (e) {
                                console.error('Failed to create skeleton:', name, e);
                                return;
                            }
                        }

                        const skeleton = state.skeletons[name];
                        if (!item.animation) {
                            item.animation = this.getDefaultAnimation(name);
                        }
                        skeleton.scale.set(state.currentScale);
                        skeleton.visible = item.visible;
                        this.setAnimation(name, item.animation);
                        skinManager.restoreSkin(name);
                        this.applyCameraTransform(skeleton, item.worldX, item.worldY);
                        skeleton.state.timeScale = item.isPlaying ? 1 : 0;

                        if (isFirstBuild) {
                            const skins = state.availableSkins[name] || [];
                            const nonDefaultSkins = skins.filter(s => s !== 'default');
                            const currentSkin = state.selectedSkins[name];
                            const alreadyCustom = currentSkin && currentSkin !== 'default' && nonDefaultSkins.includes(currentSkin);
                            if (nonDefaultSkins.length > 0 && !alreadyCustom) {
                                const sortedSkins = [...nonDefaultSkins].sort((a, b) => a.localeCompare(b));
                                skinManager.applySkin(name, sortedSkins[0]);
                            }
                            const saved = savedState.skeletonStates ? savedState.skeletonStates[name] : null;
                            if (saved && saved.trackTime !== undefined) {
                                const track = skeleton.state.getCurrent(0);
                                if (track) {
                                    const dur = track.animation ? track.animation.duration : 0;
                                    let tt = saved.trackTime;
                                    if (dur > 0 && tt > dur) tt = tt % dur;
                                    if (tt < 0) tt = 0;
                                    track.trackTime = tt;
                                }
                            }
                        }
                        
                        if (item.visible) {
                            state.app.stage.addChild(skeleton);
                        }
                    });

                    this.renderSkeletonList();
                    this.applyRenderOrder();
                    this.drawWorkspace();
                    this.updateDiamondPosition();
                    uiControls.updateScaleSlider(state.museum.cameraScale);
                    if (state.museum.skeletonView) this.setSkeletonView(true);
                },

                sortSkeletonsForLayering(a, b) {
                    const priorityA = this.getSkeletonLayerPriority(a);
                    const priorityB = this.getSkeletonLayerPriority(b);
                    if (priorityA !== priorityB) {
                        return priorityB - priorityA;
                    }
                    return a.localeCompare(b);
                },

                getSkeletonLayerPriority(name) {
                    if (name === 'game-scenes') return 0;
                    if (name === 'reels-box') return 1;
                    return 2;
                },

                applyCameraTransform(skeleton, worldX, worldY) {
                    const screenX = worldX * state.museum.cameraScale + state.museum.cameraOffsetX;
                    const screenY = worldY * state.museum.cameraScale + state.museum.cameraOffsetY;
                    skeleton.x = screenX;
                    skeleton.y = screenY;
                    skeleton.scale.set(state.museum.cameraScale);
                    this.saveState();
                },

                setCameraScale(scale) {
                    const oldScale = state.museum.cameraScale;
                    const screenW = state.app.screen.width;
                    const screenH = state.app.screen.height;
                    const screenCenterX = screenW / 2;
                    const screenCenterY = screenH / 2;

                    const worldCenterX = (screenCenterX - state.museum.cameraOffsetX) / oldScale;
                    const worldCenterY = (screenCenterY - state.museum.cameraOffsetY) / oldScale;

                    state.museum.cameraScale = scale;
                    state.museum.cameraOffsetX = screenCenterX - worldCenterX * scale;
                    state.museum.cameraOffsetY = screenCenterY - worldCenterY * scale;

                    this.updateAllSkeletonPositions();
                    this.drawWorkspace();
                },

                computeLayout() {
                    const skeletonNames = Array.from(state.loadedSkeletons);
                    const specialNames = ['reels-box', 'game-scenes'];
                    const symNames = skeletonNames.filter(n => n.startsWith('sym')).sort((a, b) => a.localeCompare(b));
                    const otherNames = skeletonNames.filter(n => !n.startsWith('sym') && !specialNames.includes(n)).sort((a, b) => a.localeCompare(b));

                    const layout = {};
                    let x = 0;
                    for (const name of symNames) {
                        layout[name] = { x: x, y: 0 };
                        x += this.SYM_SPACING;
                    }
                    x = 0;
                    for (const name of otherNames) {
                        layout[name] = { x: x, y: 1000 };
                        x += this.SYM_SPACING;
                    }
                    if (skeletonNames.includes('reels-box')) {
                        layout['reels-box'] = { x: 0, y: 4000 };
                    }
                    if (skeletonNames.includes('game-scenes')) {
                        layout['game-scenes'] = { x: 4000, y: 4000 };
                    }
                    return layout;
                },

                fitCameraToContent(padding) {
                    if (!state.app) return;
                    const items = state.museum.skeletons;
                    if (items.length === 0) {
                        state.museum.cameraScale = 1.0;
                        state.museum.cameraOffsetX = 0;
                        state.museum.cameraOffsetY = state.app.screen.height / 2;
                        return;
                    }

                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    for (const item of items) {
                        if (item.worldX < minX) minX = item.worldX;
                        if (item.worldX > maxX) maxX = item.worldX;
                        if (item.worldY < minY) minY = item.worldY;
                        if (item.worldY > maxY) maxY = item.worldY;
                    }

                    const p = padding;
                    const worldLeft = minX - p;
                    const worldRight = maxX + p;
                    const worldTop = minY - p;
                    const worldBottom = maxY + p;
                    const worldWidth = worldRight - worldLeft;
                    const worldHeight = worldBottom - worldTop;

                    const screenW = state.app.screen.width;
                    const screenH = state.app.screen.height;

                    let scale;
                    if (worldWidth > 0 && worldHeight > 0) {
                        scale = Math.min(screenW / worldWidth, screenH / worldHeight);
                    } else {
                        scale = 1.0;
                    }
                    scale = Math.max(0.05, Math.min(2.0, scale));

                    const worldCenterX = (worldLeft + worldRight) / 2;
                    const worldCenterY = (worldTop + worldBottom) / 2;

                    state.museum.cameraScale = scale;
                    state.museum.cameraOffsetX = screenW / 2 - worldCenterX * scale;
                    state.museum.cameraOffsetY = screenH / 2 - worldCenterY * scale;
                },

                resetCamera() {
                    this.fitCameraToContent(this.FIT_PADDING);
                    this.updateAllSkeletonPositions();
                    this.drawWorkspace();
                    uiControls.updateScaleSlider(state.museum.cameraScale);
                },

                drawWorkspace() {
                    if (!state.museum.workspaceGraphics) return;
                    graphicsManager.drawAxesAndGrid(
                        state.museum.workspaceGraphics,
                        state.museum.cameraScale,
                        state.museum.cameraOffsetX,
                        state.museum.cameraOffsetY
                    );
                    frameManager.draw();
                },

                getDefaultAnimation(skeletonName) {
                    let names = [];
                    const skeleton = state.skeletons[skeletonName];
                    if (skeleton && skeleton.skeleton && skeleton.skeleton.data && skeleton.skeleton.data.animations) {
                        names = skeleton.skeleton.data.animations.map(a => a.name);
                    } else {
                        names = state.availableAnimations
                            .filter(a => a.skeletonName === skeletonName)
                            .map(a => a.animationName);
                    }
                    if (names.length === 0) return '';

                    const idleAnim = names.find(n => n.toLowerCase().includes('idle'));
                    if (idleAnim) return idleAnim;

                    const loopAnim = names.find(n => n.toLowerCase().includes('loop'));
                    if (loopAnim) return loopAnim;

                    return names[0];
                },

                setAnimation(skeletonName, animationName) {
                    const skeleton = state.skeletons[skeletonName];
                    if (!skeleton) return;

                    if (!animationName) {
                        skeleton.skeleton.setToSetupPose();
                        return;
                    }

                    const track = skeleton.state.setAnimation(0, animationName, true);
                    if (track) {
                        track.timeScale = 1;
                    }

                    if (track && track.animation && track.animation.duration <= 0) {
                        skeleton.skeleton.setToSetupPose();
                    }
                    this.saveState();
                },

                onResolutionChange() {
                    if (state.activeMode !== 'museum') return;
                    let changed = false;
                    for (const item of state.museum.skeletons) {
                        const name = item.skeletonName;
                        const newRes = getEffectiveResolution(name, item.animation);
                        const curRes = state.skeletonResolution[name];
                        if (newRes === curRes) continue;
                        changed = true;

                        const oldSkeleton = state.skeletons[name];
                        if (oldSkeleton && oldSkeleton.parent) {
                            oldSkeleton.parent.removeChild(oldSkeleton);
                            oldSkeleton.destroy();
                        }

                        try {
                            state.skeletons[name] = skeletonManager.createSkeleton(name, newRes);
                            state.skeletonResolution[name] = newRes;
                            placeholderManager.buildFor(name);
                        } catch (e) {
                            console.error('Failed to recreate skeleton:', name, e);
                            continue;
                        }

                        const skeleton = state.skeletons[name];
                        skeleton.visible = item.visible;
                        if (item.playAll) {
                            this._playAllStep(name);
                        } else {
                            this.setAnimation(name, item.animation);
                        }
                        skeleton.state.timeScale = item.isPlaying ? 1 : 0;
                        this.applyCameraTransform(skeleton, item.worldX, item.worldY);
                        skinManager.restoreSkin(name);
                        placeholderManager.setVisible(state.showPlaceholders);
                    }
                    if (changed) {
                        this.applyRenderOrder();
                        this.updateDiamondPosition();
                    }
                },

                toggleAnimationPlay(skeletonName) {
                    const skeleton = state.skeletons[skeletonName];
                    if (!skeleton) return;

                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item) return;

                    item.isPlaying = !item.isPlaying;
                    skeleton.state.timeScale = item.isPlaying ? 1 : 0;
                    this.saveState();
                },

                toggleVisibility(skeletonName) {
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item) return;
                    this.setVisibility(skeletonName, !item.visible);
                    this.renderSkeletonList();
                },

                applyRenderOrder() {
                    for (let i = state.museum.skeletons.length - 1; i >= 0; i--) {
                        const item = state.museum.skeletons[i];
                        const skeleton = state.skeletons[item.skeletonName];
                        if (skeleton && item.visible) {
                            state.app.stage.addChild(skeleton);
                        }
                    }

                    if (state.museum.centerDiamondGraphics) {
                        state.app.stage.addChild(state.museum.centerDiamondGraphics);
                    }

                    for (const label of Object.values(state.museum.hoverLabelObjects)) {
                        if (label.visible) state.app.stage.addChild(label);
                    }

                    this.applyRenderGroupIsolation();
                    frameManager.draw();
                },

                applyRenderGroupIsolation() {
                    for (const item of state.museum.skeletons) {
                        const skeleton = state.skeletons[item.skeletonName];
                        if (!skeleton) continue;
                        const wantGroup = !!skeleton.darkTint;
                        if (wantGroup && !skeleton.isRenderGroup) {
                            try { skeleton.enableRenderGroup(); } catch (e) {}
                        } else if (!wantGroup && skeleton.isRenderGroup) {
                            try { skeleton.disableRenderGroup(); } catch (e) {}
                        }
                    }
                },

                renderSkeletonList() {
                    const container = document.getElementById('museumList');
                    container.innerHTML = '';
                    const selectedSet = new Set(state.museum.selectedSkeletons);

                    state.museum.skeletons.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'museum-item' + (selectedSet.has(item.skeletonName) ? ' selected' : '');
                        div.dataset.index = index;
                        div.dataset.skeletonName = item.skeletonName;

                        const dragHandle = document.createElement('div');
                        dragHandle.className = 'museum-drag-handle';
                        dragHandle.textContent = '≡';
                        dragHandle.draggable = true;

                        const visibilityBtn = document.createElement('button');
                        visibilityBtn.className = 'museum-visibility-btn' + (item.visible ? ' visible' : '');
                        visibilityBtn.textContent = item.visible ? '●' : '○';
                        visibilityBtn.dataset.skeletonName = item.skeletonName;

                        const nameSpan = document.createElement('div');
                        nameSpan.className = 'museum-name';
                        nameSpan.textContent = item.skeletonName;
                        nameSpan.dataset.skeletonName = item.skeletonName;

                        div.appendChild(dragHandle);
                        div.appendChild(visibilityBtn);
                        div.appendChild(nameSpan);
                        container.appendChild(div);

                        visibilityBtn.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            this.startVisibilityPaint(item.skeletonName);
                        });
                        visibilityBtn.addEventListener('mouseenter', () => {
                            if (state.museum.visibilityPainting) {
                                this.paintVisibility(item.skeletonName, visibilityBtn);
                            }
                        });

                        nameSpan.addEventListener('click', () => this.selectSkeleton(item.skeletonName));

                        this.setupDragAndDrop(div, index);
                    });
                },

                updateVisibilityButton(btn, visible) {
                    btn.textContent = visible ? '●' : '○';
                    btn.classList.toggle('visible', visible);
                },

                setVisibility(skeletonName, visible, btn) {
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item || item.visible === visible) return false;

                    item.visible = visible;
                    const skeleton = state.skeletons[skeletonName];
                    if (skeleton) {
                        skeleton.visible = visible;
                    }

                    if (!visible) {
                        state.museum.selectedSkeletons = state.museum.selectedSkeletons.filter(n => n !== skeletonName);
                    }

                    if (btn) this.updateVisibilityButton(btn, visible);

                    this.updateDiamondPosition();
                    this.updateSelectedInfo();
                    this.saveState();
                    return true;
                },

                startVisibilityPaint(skeletonName) {
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item) return;
                    const newVisible = !item.visible;
                    state.museum.visibilityPainting = true;
                    state.museum.visibilityPaintTarget = newVisible;

                    const btn = document.querySelector('.museum-visibility-btn[data-skeleton-name="' + CSS.escape(skeletonName) + '"]');
                    this.setVisibility(skeletonName, newVisible, btn);
                },

                paintVisibility(skeletonName, btn) {
                    this.setVisibility(skeletonName, state.museum.visibilityPaintTarget, btn);
                },

                endVisibilityPaint() {
                    state.museum.visibilityPainting = false;
                    state.museum.visibilityPaintTarget = null;
                },

                selectSkeleton(skeletonName) {
                    state.museum.selectedSkeletons = [skeletonName];
                    this.updateDiamondPosition();
                    this.updateSelectedInfo();
                    this.updateListSelection();
                },

                updateListSelection() {
                    const selectedSet = new Set(state.museum.selectedSkeletons);
                    const items = document.querySelectorAll('#museumList .museum-item');
                    items.forEach(el => {
                        const name = el.dataset.skeletonName;
                        el.classList.toggle('selected', !!name && selectedSet.has(name));
                    });
                },

                buildSelectedAnimationDropdown() {
                    const container = document.getElementById('selectedAnimationDropdown');
                    if (!container) return;
                    container.innerHTML = '';
                    container.classList.remove('open');

                    const selected = state.museum.selectedSkeletons;
                    if (selected.length === 0) return;

                    const first = state.skeletons[selected[0]];
                    if (!first || !first.skeleton || !first.skeleton.data) return;
                    const animations = first.skeleton.data.animations || [];
                    if (animations.length === 0) return;

                    const items = selected
                        .map(n => state.museum.skeletons.find(s => s.skeletonName === n))
                        .filter(Boolean);
                    const allSameAnim = items.length > 0 && items.every(i => i.animation === items[0].animation);
                    const currentAnim = allSameAnim ? items[0].animation : '';

                    const trigger = document.createElement('div');
                    trigger.className = 'museum-animation-trigger';
                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = currentAnim || '—';
                    const arrow = document.createElement('span');
                    arrow.className = 'arrow';
                    arrow.textContent = '▼';
                    trigger.appendChild(labelSpan);
                    trigger.appendChild(arrow);

                    const list = document.createElement('div');
                    list.className = 'museum-animation-list';

                    animations.sort((a, b) => a.name.localeCompare(b.name)).forEach(anim => {
                        const animItem = document.createElement('div');
                        animItem.className = 'museum-animation-item' + (allSameAnim && anim.name === currentAnim ? ' active' : '');
                        animItem.textContent = anim.name;

                        animItem.addEventListener('click', (e) => {
                            e.stopPropagation();
                            for (const name of selected) {
                                const item = state.museum.skeletons.find(s => s.skeletonName === name);
                                if (!item) continue;
                                this.stopPlayAll(name);
                                item.animation = anim.name;
                                item.isPlaying = true;
                                this.setAnimation(name, anim.name);
                                const sk = state.skeletons[name];
                                if (sk) sk.state.timeScale = 1;
                            }
                            container.classList.remove('open');
                            this.buildSelectedAnimationDropdown();
                            this.updateSelectedPlaybackButtons();
                            this.renderSkeletonList();
                        });

                        list.appendChild(animItem);
                    });

                    trigger.addEventListener('click', () => {
                        container.classList.toggle('open');
                        this.closeOtherDropdowns(container);
                    });

                    container.appendChild(trigger);
                    container.appendChild(list);
                },

                playSelected() {
                    for (const name of state.museum.selectedSkeletons) {
                        const item = state.museum.skeletons.find(s => s.skeletonName === name);
                        const sk = state.skeletons[name];
                        if (!item || !sk) continue;
                        item.isPlaying = true;
                        sk.state.timeScale = 1;
                    }
                    this.updateSelectedPlaybackButtons();
                    this.saveState();
                },

                pauseSelected() {
                    for (const name of state.museum.selectedSkeletons) {
                        const item = state.museum.skeletons.find(s => s.skeletonName === name);
                        const sk = state.skeletons[name];
                        if (!item || !sk) continue;
                        item.isPlaying = false;
                        sk.state.timeScale = 0;
                    }
                    this.updateSelectedPlaybackButtons();
                    this.saveState();
                },

                stopSelected() {
                    for (const name of state.museum.selectedSkeletons) {
                        const item = state.museum.skeletons.find(s => s.skeletonName === name);
                        const sk = state.skeletons[name];
                        if (!item || !sk) continue;
                        this.stopPlayAll(name);
                        item.isPlaying = false;
                        this.setAnimation(name, item.animation);
                        sk.state.timeScale = 0;
                    }
                    this.updateSelectedPlaybackButtons();
                    this.saveState();
                },

                togglePlayPauseSelected() {
                    const items = state.museum.selectedSkeletons
                        .map(n => state.museum.skeletons.find(s => s.skeletonName === n))
                        .filter(Boolean);
                    if (items.length === 0) return;
                    const allPlaying = items.every(i => i.isPlaying);
                    if (allPlaying) {
                        this.pauseSelected();
                    } else {
                        this.playSelected();
                    }
                },

                getSortedAnimations(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    if (!sk || !sk.skeleton || !sk.skeleton.data) return [];
                    return (sk.skeleton.data.animations || []).slice().sort((a, b) => a.name.localeCompare(b.name));
                },

                togglePlayAllSelected() {
                    const items = state.museum.selectedSkeletons
                        .map(n => state.museum.skeletons.find(s => s.skeletonName === n))
                        .filter(Boolean);
                    if (items.length === 0) return;
                    const anyOn = items.some(i => i.playAll);
                    if (anyOn) {
                        for (const item of items) {
                            this.stopPlayAll(item.skeletonName);
                        }
                    } else {
                        for (const item of items) {
                            this.startPlayAll(item.skeletonName);
                        }
                    }
                    this.updateSelectedPlaybackButtons();
                },

                startPlayAll(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    if (!sk) return;
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item) return;
                    item.playAll = true;
                    item.playAllIndex = 0;
                    item.isPlaying = true;
                    this._playAllStep(skeletonName);
                    this.saveState();
                },

                _playAllStep(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    if (!sk || !sk.state) return;
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item || !item.playAll) return;
                    const animations = this.getSortedAnimations(skeletonName);
                    if (animations.length === 0) return;
                    if (item.playAllIndex >= animations.length) item.playAllIndex = 0;
                    const animName = animations[item.playAllIndex].name;
                    item.animation = animName;
                    const track = sk.state.setAnimation(0, animName, false);
                    if (track) {
                        track.timeScale = item.isPlaying ? 1 : 0;
                        track.listener = {
                            complete: () => {
                                if (!item.playAll) return;
                                item.playAllIndex = (item.playAllIndex + 1) % animations.length;
                                this._playAllStep(skeletonName);
                            }
                        };
                    }
                    if (state.museum.selectedSkeletons.includes(skeletonName)) {
                        this.buildSelectedAnimationDropdown();
                    }
                    this.saveState();
                },

                stopPlayAll(skeletonName) {
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    if (!item) return;
                    if (!item.playAll) return;
                    item.playAll = false;
                    const sk = state.skeletons[skeletonName];
                    if (sk && sk.state) {
                        const track = sk.state.getCurrent(0);
                        if (track) {
                            track.listener = null;
                            track.loop = true;
                        }
                    }
                    this.saveState();
                },

                updateSelectedPlaybackButtons() {
                    this.updateSelectedPositionSlider();
                    const playPauseBtn = document.getElementById('museumPlayPauseBtn');
                    const playAllBtn = document.getElementById('museumPlayAllBtn');
                    const selected = state.museum.selectedSkeletons;
                    const items = selected
                        .map(n => state.museum.skeletons.find(s => s.skeletonName === n))
                        .filter(Boolean);
                    if (items.length === 0) {
                        if (playPauseBtn) {
                            playPauseBtn.title = 'Play';
                            playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 21,12 6,21"/></svg>';
                        }
                        if (playAllBtn) playAllBtn.classList.remove('active');
                        return;
                    }
                    const allPlaying = items.every(i => i.isPlaying);
                    if (playPauseBtn) {
                        if (allPlaying) {
                            playPauseBtn.title = 'Pause';
                            playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';
                        } else {
                            playPauseBtn.title = 'Play';
                            playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 21,12 6,21"/></svg>';
                        }
                    }
                    const allPlayAll = items.every(i => i.playAll);
                    if (playAllBtn) playAllBtn.classList.toggle('active', allPlayAll);
                },

                seekSelected(ratio) {
                    for (const name of state.museum.selectedSkeletons) {
                        const sk = state.skeletons[name];
                        if (!sk || !sk.state) continue;
                        const track = sk.state.getCurrent(0);
                        if (!track || !track.animation) continue;
                        const dur = track.animation.duration;
                        if (dur <= 0) continue;
                        track.trackTime = ratio * dur;
                    }
                    this.saveState();
                },

                updateSelectedPositionSlider() {
                    const slider = document.getElementById('selectedPositionSlider');
                    if (!slider) return;
                    if (this._selectedSeeking) return;
                    const selected = state.museum.selectedSkeletons;
                    if (selected.length === 0) {
                        slider.disabled = true;
                        slider.value = 0;
                        return;
                    }
                    const sk = state.skeletons[selected[0]];
                    const track = sk && sk.state ? sk.state.getCurrent(0) : null;
                    const dur = track && track.animation ? track.animation.duration : 0;
                    if (dur <= 0) {
                        slider.disabled = true;
                        slider.value = 0;
                        return;
                    }
                    slider.disabled = false;
                    let ratio;
                    if (track.loop) {
                        ratio = (track.trackTime % dur) / dur;
                    } else {
                        ratio = Math.min(track.trackTime / dur, 1);
                    }
                    slider.value = Math.round(ratio * 1000);
                },

                closeOtherDropdowns(exceptDropdown) {
                    const dropdowns = document.querySelectorAll('.museum-animation-dropdown');
                    dropdowns.forEach(dd => {
                        if (dd !== exceptDropdown) {
                            dd.classList.remove('open');
                        }
                    });
                },

                setupDragAndDrop(element, index) {
                    const dragHandle = element.querySelector('.museum-drag-handle');

                    dragHandle.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', index);
                        element.classList.add('dragging');
                    });

                    dragHandle.addEventListener('dragend', () => {
                        element.classList.remove('dragging');
                        document.querySelectorAll('.museum-item').forEach(el => {
                            el.classList.remove('drag-over');
                        });
                    });

                    element.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        const draggingIndex = parseInt(e.dataTransfer.getData('text/plain'));
                        if (draggingIndex === index) return;

                        element.classList.add('drag-over');
                    });

                    element.addEventListener('dragleave', () => {
                        element.classList.remove('drag-over');
                    });

                    element.addEventListener('drop', (e) => {
                        e.preventDefault();
                        element.classList.remove('drag-over');

                        const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                        if (fromIndex === index || isNaN(fromIndex)) return;

                        const [movedItem] = state.museum.skeletons.splice(fromIndex, 1);
                        state.museum.skeletons.splice(index, 0, movedItem);

                        this.renderSkeletonList();
                        this.applyRenderOrder();
                        this.saveState();
                    });
                },

                hasAnimation(skeletonName, animationName) {
                    if (!animationName) return false;
                    const skeleton = state.skeletons[skeletonName];
                    if (!skeleton || !skeleton.skeleton || !skeleton.skeleton.data) return false;
                    const animations = skeleton.skeleton.data.animations || [];
                    return animations.some(a => a.name === animationName);
                },

                getCurrentTrackTime(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    const item = state.museum.skeletons.find(s => s.skeletonName === skeletonName);
                    const cached = (item && item._pausedTrackTime != null) ? item._pausedTrackTime : null;
                    if (!sk || !sk.state) return cached != null ? cached : 0;
                    const track = sk.state.getCurrent(0);
                    if (!track || !track.animation) return cached != null ? cached : 0;
                    const dur = track.animation.duration || 0;
                    if (dur > 0) return track.trackTime % dur;
                    return track.trackTime;
                },

                saveState() {
                    if (state.activeMode !== 'museum') return;
                    if (this._stateSaveTimer) clearTimeout(this._stateSaveTimer);
                    this._stateSaveTimer = setTimeout(() => {
                        this._stateSaveTimer = null;
                        this._saveStateNow();
                    }, 300);
                },

                _saveStateNow() {
                    if (state.activeMode !== 'museum') return;
                    if (!state.museum || state.museum.skeletons.length === 0) return;
                    try {
                        localStorage.setItem(this.STORAGE_KEY, this.serializeState());
                    } catch (e) {}
                },

                loadState() {
                    let raw = null;
                    try { raw = localStorage.getItem(this.STORAGE_KEY); } catch (e) {}
                    if (!raw) return null;
                    try {
                        const parsed = this.parseStateText(raw);
                        if (!parsed || !parsed.skeletonStates || Object.keys(parsed.skeletonStates).length === 0) {
                            return null;
                        }
                        return parsed;
                    } catch (e) {
                        return null;
                    }
                },

                serializeState() {
                    const skeletons = state.museum.skeletons.map(item => {
                        const x = Math.round(item.worldX);
                        const y = Math.round(item.worldY);
                        const anim = item.animation || '';
                        const playing = item.isPlaying ? 1 : 0;
                        const t = this.getCurrentTrackTime(item.skeletonName);
                        const visible = item.visible ? 1 : 0;
                        return `${item.skeletonName}:${x},${y}:${anim}:${playing}:${t.toFixed(3)}:${visible}`;
                    }).join('|');
                    
                    const skeletonOrder = state.museum.skeletons.map(item => item.skeletonName).join(',');
                    
                    const stateObj = {
                        skeletons: skeletons,
                        skeletonOrder: skeletonOrder,
                        cameraOffsetX: state.museum.cameraOffsetX,
                        cameraOffsetY: state.museum.cameraOffsetY,
                        cameraScale: state.museum.cameraScale,
                        snapToGrid: state.museum.snapToGrid
                    };
                    
                    return JSON.stringify(stateObj);
                },

                parseStateText(text) {
                    const result = {};
                    let skeletonOrder = [];
                    let cameraState = {};
                    
                    if (text) {
                        try {
                            const trimmed = text.trim();
                            if (trimmed.startsWith('{')) {
                                console.log('Parsing museum state (JSON format):', text);
                                const stateObj = JSON.parse(text);
                                
                                if (stateObj.skeletons) {
                                    stateObj.skeletons.split('|').forEach(part => {
                                        part = part.trim();
                                        if (!part) return;
                                        const fields = part.split(':');
                                        const name = fields[0];
                                        if (!name) return;
                                        const coords = (fields[1] || '').split(',');
                                        const x = parseInt(coords[0], 10);
                                        const y = parseInt(coords[1], 10);
                                        if (isNaN(x) || isNaN(y)) return;
                                        const entry = { x: x, y: y };
                                        if (fields.length > 2 && fields[2] !== '') entry.animation = fields[2];
                                        if (fields.length > 3 && fields[3] !== '') entry.isPlaying = fields[3] === '1';
                                        if (fields.length > 4 && fields[4] !== '') {
                                            const tt = parseFloat(fields[4]);
                                            if (!isNaN(tt)) entry.trackTime = tt;
                                        }
                                        if (fields.length > 5 && fields[5] !== '') entry.visible = fields[5] === '1';
                                        result[name] = entry;
                                    });
                                }
                                
                                if (stateObj.skeletonOrder) {
                                    skeletonOrder = stateObj.skeletonOrder.split(',');
                                }
                                
                                if (stateObj.cameraOffsetX !== undefined) cameraState.cameraOffsetX = stateObj.cameraOffsetX;
                                if (stateObj.cameraOffsetY !== undefined) cameraState.cameraOffsetY = stateObj.cameraOffsetY;
                                if (stateObj.cameraScale !== undefined) cameraState.cameraScale = stateObj.cameraScale;
                                if (stateObj.snapToGrid !== undefined) cameraState.snapToGrid = stateObj.snapToGrid;
                                
                                console.log('Parsed museum state:', { skeletonStates: result, skeletonOrder, cameraState });
                            } else {
                                console.log('Parsing museum state (legacy format):', text);
                                text.split('|').forEach(part => {
                                    part = part.trim();
                                    if (!part) return;
                                    const fields = part.split(':');
                                    const name = fields[0];
                                    if (!name) return;
                                    const coords = (fields[1] || '').split(',');
                                    const x = parseInt(coords[0], 10);
                                    const y = parseInt(coords[1], 10);
                                    if (isNaN(x) || isNaN(y)) return;
                                    const entry = { x: x, y: y };
                                    if (fields.length > 2 && fields[2] !== '') entry.animation = fields[2];
                                    if (fields.length > 3 && fields[3] !== '') entry.isPlaying = fields[3] === '1';
                                    if (fields.length > 4 && fields[4] !== '') {
                                        const tt = parseFloat(fields[4]);
                                        if (!isNaN(tt)) entry.trackTime = tt;
                                    }
                                    result[name] = entry;
                                });
                                console.log('Parsed museum state (legacy):', { skeletonStates: result });
                            }
                        } catch (e) {
                            console.error('Failed to parse museum state:', e);
                        }
                    }
                    
                    return { skeletonStates: result, skeletonOrder, cameraState };
                },

                applyStateMap(stateData) {
                    const stateMap = stateData.skeletonStates || {};
                    
                    for (const name of Object.keys(stateMap)) {
                        const item = state.museum.skeletons.find(s => s.skeletonName === name);
                        if (!item) continue;

                        const saved = stateMap[name];
                        item.worldX = saved.x;
                        item.worldY = saved.y;

                        if (saved.visible !== undefined) {
                            item.visible = saved.visible;
                        }

                        const skeleton = state.skeletons[name];
                        if (!skeleton) continue;

                        if (saved.animation !== undefined && this.hasAnimation(name, saved.animation)) {
                            item.animation = saved.animation;
                            this.setAnimation(name, item.animation);
                        }
                        this.applyCameraTransform(skeleton, item.worldX, item.worldY);
                        skeleton.visible = item.visible;

                        if (saved.isPlaying !== undefined) {
                            item.isPlaying = saved.isPlaying;
                        }
                        skeleton.state.timeScale = item.isPlaying ? 1 : 0;

                        if (saved.trackTime !== undefined) {
                            const track = skeleton.state.getCurrent(0);
                            if (track) {
                                const dur = track.animation ? track.animation.duration : 0;
                                let tt = saved.trackTime;
                                if (dur > 0 && tt > dur) tt = tt % dur;
                                if (tt < 0) tt = 0;
                                track.trackTime = tt;
                            }
                        }
                    }

                    if (stateData.skeletonOrder && stateData.skeletonOrder.length > 0) {
                        state.museum.skeletons.sort((a, b) => {
                            const indexA = stateData.skeletonOrder.indexOf(a.skeletonName);
                            const indexB = stateData.skeletonOrder.indexOf(b.skeletonName);
                            return indexA - indexB;
                        });
                    }

                    if (stateData.cameraState) {
                        if (stateData.cameraState.cameraOffsetX !== undefined) {
                            state.museum.cameraOffsetX = stateData.cameraState.cameraOffsetX;
                        }
                        if (stateData.cameraState.cameraOffsetY !== undefined) {
                            state.museum.cameraOffsetY = stateData.cameraState.cameraOffsetY;
                        }
                        if (stateData.cameraState.cameraScale !== undefined) {
                            state.museum.cameraScale = stateData.cameraState.cameraScale;
                        }
                        if (stateData.cameraState.snapToGrid !== undefined) {
                            state.museum.snapToGrid = stateData.cameraState.snapToGrid;
                        }
                        this.drawWorkspace();
                    }

                    this.updateDiamondPosition();
                    this.updateSelectedInfo();
                    this.saveState();
                },

                resetMuseumState() {
                    state.museum.skeletons = [];
                    state.museum.selectedSkeletons = [];
                    try { localStorage.removeItem(this.STORAGE_KEY); } catch (e) {}
                    this.setupMuseumView();
                },

                initResetButton() {
                    const btn = document.getElementById('museumResetBtn');
                    if (btn) btn.addEventListener('click', () => this.resetMuseumState());
                },

                copyPositions() {
                    const text = this.serializeState();

                    const fallback = (str) => {
                        const ta = document.createElement('textarea');
                        ta.value = str;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand('copy'); } catch (e) {}
                        document.body.removeChild(ta);
                    };

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).catch(() => fallback(text));
                    } else {
                        fallback(text);
                    }
                },

                parsePositions(text) {
                    const stateMap = this.parseStateText(text);
                    this.applyStateMap(stateMap);
                },

                exitMuseum() {
                    if (state.activeMode !== 'museum') return;

                    this._saveStateNow();

                    state.museum.skeletons.forEach(item => {
                        const skeleton = state.skeletons[item.skeletonName];
                        if (skeleton) {
                            skeleton.state.clearTracks();
                            if (skeleton.isRenderGroup) {
                                try { skeleton.disableRenderGroup(); } catch (e) {}
                            }
                            if (skeleton.parent) {
                                skeleton.parent.removeChild(skeleton);
                            }
                        }
                    });

                    if (state.museum.workspaceGraphics && state.museum.workspaceGraphics.parent) {
                        state.museum.workspaceGraphics.parent.removeChild(state.museum.workspaceGraphics);
                    }

                    if (state.museum.centerDiamondGraphics && state.museum.centerDiamondGraphics.parent) {
                        state.museum.centerDiamondGraphics.parent.removeChild(state.museum.centerDiamondGraphics);
                    }

                    if (state.museum.selectionGraphics && state.museum.selectionGraphics.parent) {
                        state.museum.selectionGraphics.parent.removeChild(state.museum.selectionGraphics);
                    }

                    for (const label of Object.values(state.museum.hoverLabelObjects)) {
                        if (label.parent) label.parent.removeChild(label);
                        label.destroy();
                    }
                    state.museum.hoverLabelObjects = {};

                    state.museum.selectedSkeletons = [];
                    state.museum.isSelecting = false;

                    const rightArea = document.querySelector('.right-area');
                    rightArea.classList.remove('museum-mode');
                }
            };

            const sceneManager = {
                STORAGE_KEY: 'spineViewerScenes',
                LABEL_WIDTH_KEY: 'spineViewerSceneLabelWidth',
                GRID_KEY: 'spineViewerSceneGrid',
                PPS: 100,
                FPS: 30,
                MIN_LEN: 0.1,
                FIT_PADDING: 400,

                _idCounter: 0,

                newId(prefix) {
                    this._idCounter++;
                    return prefix + '_' + Date.now().toString(36) + '_' + this._idCounter;
                },

                /* ================= persistence ================= */

                save() {
                    if (this._saveTimer) clearTimeout(this._saveTimer);
                    this._saveTimer = setTimeout(() => {
                        this._saveTimer = null;
                        this._saveNow();
                    }, 250);
                },

                _saveNow() {
                    try {
                        const data = {
                            currentId: state.scenes.currentId,
                            scenes: state.scenes.list
                        };
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
                    } catch (e) {}
                },

                load() {
                    let data = null;
                    try {
                        const raw = localStorage.getItem(this.STORAGE_KEY);
                        if (raw) data = JSON.parse(raw);
                    } catch (e) {
                        data = null;
                    }
                    if (!data || !Array.isArray(data.scenes)) return;
                    state.scenes.list = data.scenes.map(s => this.normalizeScene(s)).filter(Boolean);
                    this.dedupeIds();
                    if (data.currentId && state.scenes.list.some(s => s.id === data.currentId)) {
                        state.scenes.currentId = data.currentId;
                    } else {
                        state.scenes.currentId = null;
                    }
                },

                normalizeScene(s) {
                    if (!s || typeof s !== 'object') return null;
                    const scene = {
                        id: s.id || this.newId('scene'),
                        name: typeof s.name === 'string' && s.name ? s.name : 'Scene',
                        camera: {
                            ox: (s.camera && isFinite(s.camera.ox)) ? Number(s.camera.ox) : 0,
                            oy: (s.camera && isFinite(s.camera.oy)) ? Number(s.camera.oy) : 0,
                            scale: (s.camera && isFinite(s.camera.scale)) ? Number(s.camera.scale) : 1
                        },
                        instances: []
                    };
                    const list = Array.isArray(s.instances) ? s.instances : [];
                    scene.instances = list.map(inst => this.normalizeInstance(inst)).filter(Boolean);

                    const counters = {};
                    scene.instances.forEach(inst => {
                        if (!inst.label) return;
                        const m = /\((\d+)\)\s*$/.exec(inst.label);
                        const n = m ? parseInt(m[1], 10) : 1;
                        counters[inst.skeletonName] = Math.max(counters[inst.skeletonName] || 0, n);
                    });
                    scene.instances.forEach(inst => {
                        if (inst.label) return;
                        const base = inst.skeletonName;
                        counters[base] = (counters[base] || 0) + 1;
                        inst.label = counters[base] === 1 ? base : base + '(' + counters[base] + ')';
                    });

                    scene.slots = this.normalizeSlots(s.slots, scene.instances);

                    return scene;
                },

                normalizeSlots(raw, instances) {
                    const valid = new Set((instances || []).map(i => i.id));
                    const slots = [];
                    for (let i = 0; i < 10; i++) slots.push([]);
                    if (raw && typeof raw === 'object') {
                        for (let i = 0; i < 10; i++) {
                            const entry = raw[i];
                            if (Array.isArray(entry)) slots[i] = entry.filter(id => valid.has(id));
                        }
                    }
                    return slots;
                },

                normalizeInstance(inst) {
                    if (!inst || typeof inst !== 'object' || !inst.skeletonName) return null;
                    const out = {
                        id: inst.id || this.newId('inst'),
                        skeletonName: String(inst.skeletonName),
                        label: (typeof inst.label === 'string' && inst.label) ? inst.label : '',
                        x: isFinite(inst.x) ? Number(inst.x) : 0,
                        y: isFinite(inst.y) ? Number(inst.y) : 0,
                        scale: isFinite(inst.scale) ? Number(inst.scale) : 1,
                        rotation: isFinite(inst.rotation) ? Number(inst.rotation) : 0,
                        visible: inst.visible !== false,
                        timelineVisible: inst.timelineVisible !== false,
                        visibilityKeys: [],
                        strips: []
                    };
                    const strips = Array.isArray(inst.strips) ? inst.strips : [];
                    out.strips = strips.map(st => this.normalizeStrip(st)).filter(Boolean);
                    const keys = Array.isArray(inst.visibilityKeys) ? inst.visibilityKeys : [];
                    out.visibilityKeys = keys
                        .filter(k => k && isFinite(k.time))
                        .map(k => ({
                            id: k.id || this.newId('vkey'),
                            time: this.snapToFrame(k.time),
                            visible: k.visible !== false
                        }))
                        .sort((a, b) => a.time - b.time);
                    return out;
                },

                normalizeStrip(st) {
                    if (!st || typeof st !== 'object') return null;
                    const start = isFinite(st.start) ? Math.max(0, Number(st.start)) : 0;
                    const length = isFinite(st.length) ? Math.max(this.MIN_LEN, Number(st.length)) : 1;
                    return {
                        id: st.id || this.newId('strip'),
                        animation: String(st.animation || ''),
                        start: this.snapToFrame(start),
                        length: Math.max(1 / this.FPS, this.snapToFrame(length)),
                        loop: st.loop !== false
                    };
                },

                dedupeIds() {
                    const seenScene = new Set();
                    state.scenes.list.forEach(scene => {
                        if (!scene.id || seenScene.has(scene.id)) scene.id = this.newId('scene');
                        seenScene.add(scene.id);
                        const seenInst = new Set();
                        (scene.instances || []).forEach(inst => {
                            if (!inst.id || seenInst.has(inst.id)) inst.id = this.newId('inst');
                            seenInst.add(inst.id);
                            const seenStrip = new Set();
                            (inst.strips || []).forEach(st => {
                                if (!st.id || seenStrip.has(st.id)) st.id = this.newId('strip');
                                seenStrip.add(st.id);
                            });
                        });
                    });
                },

                getCurrentScene() {
                    if (!state.scenes.currentId) return null;
                    return state.scenes.list.find(s => s.id === state.scenes.currentId) || null;
                },

                findInstance(id) {
                    const scene = this.getCurrentScene();
                    if (!scene) return null;
                    return scene.instances.find(i => i.id === id) || null;
                },

                getInstanceLabel(inst) {
                    return inst.label || inst.skeletonName;
                },

                computeInstanceLabel(skeletonName) {
                    const scene = this.getCurrentScene();
                    const existing = scene ? scene.instances.filter(i => i.skeletonName === skeletonName) : [];
                    if (existing.length === 0) return skeletonName;
                    let maxN = 0;
                    existing.forEach(i => {
                        const m = /\((\d+)\)\s*$/.exec(i.label || '');
                        const n = m ? parseInt(m[1], 10) : 1;
                        if (n > maxN) maxN = n;
                    });
                    return skeletonName + '(' + (maxN + 1) + ')';
                },

                isSelected(id) {
                    return state.scenes.selectedIds.indexOf(id) >= 0;
                },

                setSelection(ids) {
                    const arr = ids ? ids.slice() : [];
                    state.scenes.selectedIds = arr;
                    state.scenes.selectedInstanceId = arr.length === 1 ? arr[0] : null;
                    if (arr.length !== 1) {
                        state.scenes.selectedStripId = null;
                        state.scenes.selectedVisibilityKeyId = null;
                    }
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.drawSelection();
                },

                saveSelectionSlot(index) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    if (!Array.isArray(scene.slots)) {
                        scene.slots = [[], [], [], [], [], [], [], [], [], []];
                    }
                    scene.slots[index] = (state.scenes.selectedIds || []).slice();
                    this.save();
                },

                recallSelectionSlot(index) {
                    const scene = this.getCurrentScene();
                    if (!scene || !Array.isArray(scene.slots)) return;
                    const stored = scene.slots[index] || [];
                    const ids = stored.filter(id => scene.instances.some(i => i.id === id));
                    if (ids.length === 0) return;
                    state.scenes.instanceAnchorId = ids[0];
                    state.scenes.selectedStripId = null;
                    this.setSelection(ids);
                },

                /* ================= lifecycle ================= */

                init() {
                    const header = document.getElementById('scenesHeader');
                    if (header) {
                        header.addEventListener('click', () => this.activateScenes());
                    }

                    const newBtn = document.getElementById('sceneNewBtn');
                    if (newBtn) newBtn.addEventListener('click', () => this.createScene());

                    const backBtn = document.getElementById('sceneBackBtn');
                    if (backBtn) backBtn.addEventListener('click', () => this.backToList());

                    const addAllBtn = document.getElementById('sceneAddAllBtn');
                    if (addAllBtn) addAllBtn.addEventListener('click', () => this.addAllSkeletons());

                    const delBtn = document.getElementById('sceneDeleteBtn');
                    if (delBtn) delBtn.addEventListener('click', () => {
                        const ids = this.getSelectedSceneIds();
                        if (ids.length === 0) return;
                        const message = ids.length === 1
                            ? 'Delete selected scene?'
                            : 'Delete ' + ids.length + ' selected scenes?';
                        showConfirm({ message: message, confirmLabel: 'Delete' }, () => this.deleteSelectedScene());
                    });

                    const exportBtn = document.getElementById('sceneExportBtn');
                    if (exportBtn) exportBtn.addEventListener('click', () => this.exportScene());

                    const exportFileBtn = document.getElementById('sceneExportFileBtn');
                    if (exportFileBtn) exportFileBtn.addEventListener('click', () => this.exportSceneToFile());

                    const exportAllBtn = document.getElementById('sceneExportAllBtn');
                    if (exportAllBtn) exportAllBtn.addEventListener('click', () => this.exportAllScenes());

                    const exportAllFileBtn = document.getElementById('sceneExportAllFileBtn');
                    if (exportAllFileBtn) exportAllFileBtn.addEventListener('click', () => this.exportAllScenesToFile());

                    const importBtn = document.getElementById('sceneImportBtn');
                    if (importBtn) importBtn.addEventListener('click', () => this.importScene());

                    const importFileBtn = document.getElementById('sceneImportFileBtn');
                    if (importFileBtn) importFileBtn.addEventListener('click', () => this.importSceneFromFile());

                    const nameInput = document.getElementById('sceneNameInput');
                    if (nameInput) {
                        nameInput.addEventListener('input', () => {
                            const scene = this.getCurrentScene();
                            if (!scene) return;
                            scene.name = nameInput.value;
                            this.save();
                            this.renderSceneList();
                        });
                    }

                    const playBtn = document.getElementById('scenePlayBtn');
                    if (playBtn) playBtn.addEventListener('click', () => this.togglePlay());
                    const stopBtn = document.getElementById('sceneStopBtn');
                    if (stopBtn) stopBtn.addEventListener('click', () => this.stop());
                    const loopBtn = document.getElementById('sceneLoopBtn');
                    if (loopBtn) loopBtn.addEventListener('click', () => this.toggleLoop());

                    const sceneTimeline = document.getElementById('sceneTimeline');
                    if (sceneTimeline) {
                        sceneTimeline.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                        });
                    }

                    const scenesContent = document.getElementById('scenesContent');
                    if (scenesContent) {
                        scenesContent.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                        });

                        const clearSceneDrop = () => {
                            scenesContent.classList.remove('scene-drop-active');
                        };
                        const sceneDropAllowed = (e) => {
                            return state.activeMode === 'scene'
                                && !state.scenes.currentId
                                && e.dataTransfer
                                && e.dataTransfer.types
                                && e.dataTransfer.types.includes('Files');
                        };

                        scenesContent.addEventListener('dragover', (e) => {
                            if (!sceneDropAllowed(e)) return;
                            e.preventDefault();
                            e.dataTransfer.dropEffect = 'copy';
                            scenesContent.classList.add('scene-drop-active');
                        });
                        scenesContent.addEventListener('drop', (e) => {
                            clearSceneDrop();
                            this.handleSceneFileDrop(e);
                        });
                        document.addEventListener('dragover', (e) => {
                            if (!sceneDropAllowed(e)) {
                                clearSceneDrop();
                                return;
                            }
                            const r = scenesContent.getBoundingClientRect();
                            const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
                            if (!inside) clearSceneDrop();
                        });
                        document.addEventListener('dragleave', (e) => {
                            if (!e.relatedTarget) clearSceneDrop();
                        });
                        document.addEventListener('drop', clearSceneDrop);
                        document.addEventListener('dragend', clearSceneDrop);
                    }

                    this.initCanvasInteraction();
                    this.initPaletteDrop();
                    this.initLabelSplitter();

                    document.addEventListener('mouseup', () => this.endInstancePaint());

                    document.addEventListener('keydown', (e) => {
                        if (state.activeMode !== 'scene') return;
                        const t = e.target;
                        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
                        if (e.key === 'Delete') {
                            if (state.scenes.selectedVisibilityKeyId) {
                                e.preventDefault();
                                this.deleteSelectedVisibilityKey();
                                return;
                            }
                            if (!state.scenes.selectedStripId) return;
                            const inst = this.findInstance(state.scenes.selectedInstanceId);
                            if (!inst) return;
                            e.preventDefault();
                            this.deleteStrip(inst.id, state.scenes.selectedStripId);
                            return;
                        }
                        if (e.key === ']' || e.code === 'BracketRight') {
                            e.preventDefault();
                            this.reorderSelectedInstances(true);
                        } else if (e.key === '[' || e.code === 'BracketLeft') {
                            e.preventDefault();
                            this.reorderSelectedInstances(false);
                        } else {
                            let digitIndex = -1;
                            const map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '8': 7, '9': 8, '0': 9 };
                            if (e.code && /^Digit[0-9]$/.test(e.code)) {
                                digitIndex = map[e.code.slice(5)];
                            } else if (map[e.key] !== undefined) {
                                digitIndex = map[e.key];
                            }
                            if (digitIndex >= 0) {
                                if (e.ctrlKey || e.metaKey) {
                                    e.preventDefault();
                                    this.saveSelectionSlot(digitIndex);
                                } else if (!e.altKey) {
                                    e.preventDefault();
                                    this.recallSelectionSlot(digitIndex);
                                }
                            }
                        }
                    });

                    document.addEventListener('keydown', (e) => {
                        const isS = e.key === 's' || e.key === 'S' || e.code === 'KeyS';
                        if (!(e.ctrlKey || e.metaKey) || !isS) return;
                        e.preventDefault();
                        if (state.activeMode === 'scene' && this.getCurrentScene()) {
                            this.exportCurrentSceneToFile();
                        }
                    });

                    this.loadLabelWidth();
                    this.loadGrid();
                    this.load();
                    this.renderSceneList();
                    this.initSceneGridControls();
                },

                activateScenes() {
                    if (state.activeMode === 'scene') return;
                    museumManager.exitMuseum();
                    state.scenarioGeneration++;
                    playerManager.resetPhase();
                    state.activeMode = 'scene';

                    if (state.scenes.currentId && this.getCurrentScene()) {
                        this.enterSceneView();
                    } else {
                        state.scenes.currentId = null;
                        this.clearStage();
                        this.showListView();
                        uiControls.updateHighlighting();
                    }
                },

                exitScene() {
                    if (state.activeMode !== 'scene') return;
                    this.pause();
                    this.destroyInstances();
                    this.clearStage();
                    const sceneTimeline = document.getElementById('sceneTimeline');
                    if (sceneTimeline) sceneTimeline.classList.remove('visible');
                    const rightArea = document.querySelector('.right-area');
                    if (rightArea) rightArea.classList.remove('scene-mode');
                },

                showListView() {
                    const listView = document.getElementById('sceneListView');
                    const editView = document.getElementById('sceneEditView');
                    if (listView) listView.style.display = 'flex';
                    if (editView) editView.style.display = 'none';
