                    const sceneTimeline = document.getElementById('sceneTimeline');
                    if (sceneTimeline) sceneTimeline.classList.remove('visible');
                    const rightArea = document.querySelector('.right-area');
                    if (rightArea) rightArea.classList.remove('scene-mode');
                    this.renderSceneList();
                },

                showEditView() {
                    const listView = document.getElementById('sceneListView');
                    const editView = document.getElementById('sceneEditView');
                    if (listView) listView.style.display = 'none';
                    if (editView) editView.style.display = 'flex';
                },

                createScene() {
                    let n = state.scenes.list.length + 1;
                    let name = 'Scene ' + n;
                    const used = new Set(state.scenes.list.map(s => s.name));
                    while (used.has(name)) { n++; name = 'Scene ' + n; }
                    const scene = {
                        id: this.newId('scene'),
                        name: name,
                        camera: { ox: 0, oy: 0, scale: 1 },
                        instances: [],
                        slots: [[], [], [], [], [], [], [], [], [], []]
                    };
                    state.scenes.list.push(scene);
                    state.scenes.currentId = scene.id;
                    state.scenes.selectedSceneId = scene.id;
                    state.scenes.selectedSceneIds = [scene.id];
                    state.scenes.sceneAnchorId = scene.id;
                    this.save();
                    this.enterSceneView();
                },

                getSelectedSceneIds() {
                    let ids = (state.scenes.selectedSceneIds || []).slice();
                    if (ids.length === 0 && state.scenes.selectedSceneId) ids = [state.scenes.selectedSceneId];
                    return ids.filter(id => state.scenes.list.some(s => s.id === id));
                },

                deleteSelectedScene() {
                    const ids = this.getSelectedSceneIds();
                    if (ids.length === 0) return;
                    const idSet = new Set(ids);
                    state.scenes.list = state.scenes.list.filter(s => !idSet.has(s.id));
                    if (idSet.has(state.scenes.currentId)) {
                        state.scenes.currentId = null;
                        this.destroyInstances();
                        this.clearStage();
                    }
                    state.scenes.selectedSceneIds = [];
                    state.scenes.selectedSceneId = null;
                    state.scenes.sceneAnchorId = null;
                    this.save();
                    this.renderSceneList();
                    if (state.activeMode === 'scene') uiControls.updateHighlighting();
                },

                selectScene(id) {
                    state.scenes.currentId = id;
                    state.scenes.selectedSceneId = id;
                    state.scenes.selectedSceneIds = [id];
                    state.scenes.sceneAnchorId = id;
                    this.save();
                    this.enterSceneView();
                },

                backToList() {
                    this.pause();
                    this.destroyInstances();
                    this.clearStage();
                    state.scenes.currentId = null;
                    state.scenes.selectedInstanceId = null;
                    state.scenes.selectedIds = [];
                    state.scenes.instanceAnchorId = null;
                    state.scenes.selectedStripId = null;
                    state.scenes.selectedVisibilityKeyId = null;
                    state.scenes.selection.isSelecting = false;
                    this.clearMarquee();
                    this.save();
                    this.showListView();
                    if (state.activeMode === 'scene') uiControls.updateHighlighting();
                },

                enterSceneView() {
                    const scene = this.getCurrentScene();
                    if (!scene) { this.showListView(); return; }
                    state.activeMode = 'scene';
                    state.scenes.selectedInstanceId = null;
                    state.scenes.selectedIds = [];
                    state.scenes.instanceAnchorId = null;
                    state.scenes.selectedStripId = null;
                    state.scenes.selectedVisibilityKeyId = null;
                    state.scenes.selection.isSelecting = false;
                    state.scenes.ptr.time = 0;
                    state.scenes.ptr.playing = false;

                    this.destroyInstances();
                    this.clearStage();
                    this.showEditView();
                    this.ensureStage();
                    this.rebindInstances();
                    this.applyRenderOrder();

                    const nameInput = document.getElementById('sceneNameInput');
                    if (nameInput) nameInput.value = scene.name;

                    if (!scene.camera.ox && !scene.camera.oy && scene.camera.scale === 1 && scene.instances.length > 0) {
                        this.fitCameraToContent();
                    }
                    this.applyAllTransforms();
                    this.drawWorkspace();
                    this.drawMarkers();

                    this.renderPalette();
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.updatePlayButton();
                    this.updateLoopButton();
                    this.updateTimeLabel();

                    uiControls.updateHighlighting();
                    uiControls.updateScaleSlider(scene.camera.scale);
                    this.applyAtTime(state.scenes.ptr.time);
                },

                ensureStage() {
                    if (!state.app) return;
                    const g = state.scenes.graphics;
                    if (!g.workspace) g.workspace = new PIXI.Graphics();
                    if (!g.missing) g.missing = new PIXI.Graphics();
                    if (!g.selection) g.selection = new PIXI.Graphics();
                    if (!g.marquee) g.marquee = new PIXI.Graphics();
                    if (!g.grid) g.grid = new PIXI.Graphics();
                },

                clearStage() {
                    if (!state.app) return;
                    for (const id of Object.keys(state.scenes.instances)) {
                        const rt = state.scenes.instances[id];
                        if (rt && rt.parent) rt.parent.removeChild(rt);
                    }
                    const g = state.scenes.graphics;
                    ['workspace', 'missing', 'selection', 'marquee', 'grid'].forEach(k => {
                        if (g[k] && g[k].parent) g[k].parent.removeChild(g[k]);
                    });
                    for (const key of Object.keys(state.scenes.labels)) {
                        const label = state.scenes.labels[key];
                        if (label && label.parent) label.parent.removeChild(label);
                        if (label && !label.destroyed) label.destroy();
                    }
                    state.scenes.labels = {};
                    state.scenes.hoveredInstanceId = null;
                    state.app.stage.removeChildren();
                },

                isSkeletonAvailable(name) {
                    return !!state.availableResolutions[name] && state.loadedSkeletons.has(name);
                },

                createRuntimeFor(inst) {
                    const name = inst.skeletonName;
                    if (!this.isSkeletonAvailable(name)) return null;
                    const anim = (inst.strips[0] && inst.strips[0].animation) || '';
                    const res = getEffectiveResolution(name, anim);
                    try {
                        return skeletonManager.createSkeleton(name, res);
                    } catch (e) {
                        console.error('Scene: failed to create skeleton ' + name, e);
                        return null;
                    }
                },

                destroyInstances() {
                    for (const id of Object.keys(state.scenes.instances)) {
                        const rt = state.scenes.instances[id];
                        if (!rt) continue;
                        try {
                            if (rt.state) rt.state.clearTracks();
                            if (rt.isRenderGroup) {
                                try { rt.disableRenderGroup(); } catch (e) {}
                            }
                            if (rt.parent) rt.parent.removeChild(rt);
                            rt.destroy();
                        } catch (e) {}
                    }
                    state.scenes.instances = {};
                },

                rebindInstances() {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    scene.instances.forEach(inst => {
                        if (!state.scenes.instances[inst.id]) {
                            const rt = this.createRuntimeFor(inst);
                            if (rt) {
                                rt.state.timeScale = 0;
                                state.scenes.instances[inst.id] = rt;
                            }
                        }
                    });
                },

                onSkeletonsChanged() {
                    if (state.activeMode !== 'scene') { this.renderSceneList(); return; }
                    if (!state.scenes.currentId) { this.renderSceneList(); return; }
                    this.destroyInstances();
                    this.rebindInstances();
                    this.renderPalette();
                    this.renderInstanceList();
                    this.renderTimeline();
                    this.applyAllTransforms();
                    this.applyRenderOrder();
                    this.drawMarkers();
                    this.applyAtTime(state.scenes.ptr.time);
                },

                /* ================= rendering ================= */

                applyCameraTransform(rt, inst) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const cam = scene.camera;
                    const sx = inst.x * cam.scale + cam.ox;
                    const sy = inst.y * cam.scale + cam.oy;
                    rt.x = sx;
                    rt.y = sy;
                    rt.scale.set(cam.scale * (inst.scale || 1));
                    rt.rotation = (inst.rotation || 0) * Math.PI / 180;
                },

                applyAllTransforms() {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const t = state.scenes.ptr ? state.scenes.ptr.time : 0;
                    scene.instances.forEach(inst => {
                        const rt = state.scenes.instances[inst.id];
                        if (rt) {
                            rt.visible = inst.visible !== false;
                            rt.alpha = this.isKeyVisibleAt(inst, t) ? 1 : 0;
                            this.applyCameraTransform(rt, inst);
                        }
                    });
                },

                applyRenderOrder() {
                    if (!state.app) return;
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const g = state.scenes.graphics;
                    state.app.stage.removeChildren();
                    if (g.workspace) state.app.stage.addChild(g.workspace);
                    for (let i = scene.instances.length - 1; i >= 0; i--) {
                        const inst = scene.instances[i];
                        const rt = state.scenes.instances[inst.id];
                        if (rt) state.app.stage.addChild(rt);
                    }
                    if (g.missing) state.app.stage.addChild(g.missing);
                    if (g.selection) state.app.stage.addChild(g.selection);
                    if (g.marquee) state.app.stage.addChild(g.marquee);
                    for (const key of Object.keys(state.scenes.labels)) {
                        const label = state.scenes.labels[key];
                        if (label && !label.destroyed && label.parent !== state.app.stage) {
                            state.app.stage.addChild(label);
                        }
                    }
                    if (g.grid) state.app.stage.addChild(g.grid);
                    this.applyRenderGroupIsolation();
                },

                applyRenderGroupIsolation() {
                    for (const id of Object.keys(state.scenes.instances)) {
                        const rt = state.scenes.instances[id];
                        if (!rt) continue;
                        const wantGroup = !!rt.darkTint;
                        if (wantGroup && !rt.isRenderGroup) {
                            try { rt.enableRenderGroup(); } catch (e) {}
                        } else if (!wantGroup && rt.isRenderGroup) {
                            try { rt.disableRenderGroup(); } catch (e) {}
                        }
                    }
                },

                drawWorkspace() {
                    const g = state.scenes.graphics.workspace;
                    if (!g || !state.app) return;
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    graphicsManager.drawAxesAndGrid(g, scene.camera.scale, scene.camera.ox, scene.camera.oy, true);
                    this.drawSceneGridPoints(scene);
                    frameManager.draw();
                    const gridG = state.scenes.graphics.grid;
                    if (gridG) state.app.stage.addChild(gridG);
                },

                drawMarkers() {
                    const g = state.scenes.graphics.missing;
                    if (!g) return;
                    g.clear();
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const cam = scene.camera;
                    scene.instances.forEach(inst => {
                        if (!inst.visible) return;
                        const rt = state.scenes.instances[inst.id];
                        if (rt) return;
                        const sx = inst.x * cam.scale + cam.ox;
                        const sy = inst.y * cam.scale + cam.oy;
                        const s = 30 * cam.scale;
                        g.rect(sx - s, sy - s, s * 2, s * 2);
                        g.stroke({ width: 1, color: 0xd25050, alpha: 0.45 });
                        g.moveTo(sx - s, sy - s); g.lineTo(sx + s, sy + s);
                        g.moveTo(sx + s, sy - s); g.lineTo(sx - s, sy + s);
                        g.stroke({ width: 1, color: 0xd25050, alpha: 0.35 });
                    });
                },

                renderPalette() {
                    const container = document.getElementById('scenePalette');
                    if (!container) return;
                    container.innerHTML = '';
                    const names = Array.from(state.loadedSkeletons).sort((a, b) => a.localeCompare(b));
                    if (names.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'scene-palette-empty';
                        empty.textContent = 'No skeletons loaded';
                        container.appendChild(empty);
                        return;
                    }
                    names.forEach(name => {
                        const item = document.createElement('div');
                        item.className = 'scene-palette-item';
                        item.textContent = name;
                        item.draggable = true;
                        item.dataset.skeletonName = name;
                        item.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('application/x-spine-name', name);
                            e.dataTransfer.setData('text/plain', name);
                            e.dataTransfer.effectAllowed = 'copy';
                        });
                        item.addEventListener('dblclick', () => {
                            const c = document.querySelector('.canvas-container');
                            const rect = c.getBoundingClientRect();
                            this.addInstanceAt(name, rect.left + rect.width / 2, rect.top + rect.height / 2);
                        });
                        container.appendChild(item);
                    });
                },

                renderSceneList() {
                    const container = document.getElementById('scenesList');
                    if (!container) return;
                    container.innerHTML = '';
                    state.scenes.list.forEach(scene => {
                        const div = document.createElement('div');
                        const isSel = (state.scenes.selectedSceneIds || []).indexOf(scene.id) >= 0;
                        div.className = 'museum-item' + (isSel ? ' selected' : '');
                        div.dataset.sceneId = scene.id;

                        const nameSpan = document.createElement('div');
                        nameSpan.className = 'museum-name';
                        nameSpan.style.flex = '0 1 auto';
                        nameSpan.textContent = scene.name;

                        const enterBtn = document.createElement('button');
                        enterBtn.className = 'museum-position-btn scene-enter-btn';
                        enterBtn.textContent = 'Enter';
                        enterBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.selectScene(scene.id);
                        });

                        div.appendChild(nameSpan);
                        div.appendChild(enterBtn);
                        container.appendChild(div);

                        div.addEventListener('click', (e) => this.selectSceneInList(scene.id, e));
                        div.addEventListener('dblclick', () => this.selectScene(scene.id));
                    });

                    this.updateSceneListButtons();
                },

                selectSceneInList(id, e) {
                    e = e || {};
                    let ids = (state.scenes.selectedSceneIds || []).slice();
                    const list = state.scenes.list;
                    const idx = list.findIndex(s => s.id === id);
                    if (idx < 0) return;

                    if (e.shiftKey) {
                        let anchorId = state.scenes.sceneAnchorId;
                        let a = list.findIndex(s => s.id === anchorId);
                        if (a < 0) a = idx;
                        const start = Math.min(a, idx);
                        const end = Math.max(a, idx);
                        const range = list.slice(start, end + 1).map(s => s.id);
                        if (e.ctrlKey || e.metaKey) {
                            const set = new Set(ids.concat(range));
                            ids = Array.from(set);
                        } else {
                            ids = range;
                        }
                    } else if (e.ctrlKey || e.metaKey) {
                        if (ids.indexOf(id) >= 0) {
                            ids = ids.filter(x => x !== id);
                        } else {
                            ids = ids.concat(id);
                        }
                        state.scenes.sceneAnchorId = id;
                    } else {
                        ids = [id];
                        state.scenes.sceneAnchorId = id;
                    }

                    state.scenes.selectedSceneIds = ids;
                    state.scenes.selectedSceneId = ids.indexOf(id) >= 0 ? id : (ids[0] || null);
                    this.renderSceneList();
                },

                updateSceneListButtons() {
                    const hasSelection = this.getSelectedSceneIds().length > 0;
                    const exportBtn = document.getElementById('sceneExportBtn');
                    const exportFileBtn = document.getElementById('sceneExportFileBtn');
                    const delBtn = document.getElementById('sceneDeleteBtn');
                    [exportBtn, exportFileBtn, delBtn].forEach(btn => {
                        if (btn) btn.disabled = !hasSelection;
                    });
                },

                renderInstanceList() {
                    const container = document.getElementById('sceneInstanceList');
                    if (!container) return;
                    container.innerHTML = '';
                    const scene = this.getCurrentScene();
                    if (!scene) return;

                    scene.instances.forEach((inst, index) => {
                        const div = document.createElement('div');
                        div.className = 'museum-item' + (this.isSelected(inst.id) ? ' selected' : '');
                        div.dataset.instanceId = inst.id;

                        const dragHandle = document.createElement('div');
                        dragHandle.className = 'museum-drag-handle';
                        dragHandle.textContent = '\u2261';
                        dragHandle.draggable = true;

                        const visibilityBtn = document.createElement('button');
                        visibilityBtn.className = 'museum-visibility-btn scene-inst-vis' + (inst.visible ? ' visible' : '');
                        visibilityBtn.dataset.instanceId = inst.id;
                        visibilityBtn.textContent = inst.visible ? '\u25CF' : '\u25CB';
                        visibilityBtn.title = 'Toggle visibility (drag to paint)';
                        visibilityBtn.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.startInstancePaint('visible', !inst.visible, e);
                            this.paintInstance(inst, 'visible');
                        });
                        visibilityBtn.addEventListener('mouseenter', () => this.paintInstance(inst, 'visible'));
                        visibilityBtn.addEventListener('click', (e) => e.stopPropagation());

                        const addBtn = document.createElement('button');
                        addBtn.className = 'museum-visibility-btn scene-tl-add';
                        addBtn.textContent = '+';
                        addBtn.title = 'Add animation strip';
                        addBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.addStrip(inst.id);
                        });

                        const timelineBtn = document.createElement('button');
                        const tlActive = inst.timelineVisible !== false;
                        timelineBtn.className = 'museum-visibility-btn scene-tl-toggle' + (tlActive ? ' visible' : '');
                        timelineBtn.dataset.instanceId = inst.id;
                        timelineBtn.textContent = 'T';
                        timelineBtn.title = tlActive ? 'Hide strip on timeline (drag to paint)' : 'Show strip on timeline (drag to paint)';
                        timelineBtn.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.startInstancePaint('timeline', !(inst.timelineVisible !== false), e);
                            this.paintInstance(inst, 'timeline');
                        });
                        timelineBtn.addEventListener('mouseenter', () => this.paintInstance(inst, 'timeline'));
                        timelineBtn.addEventListener('click', (e) => e.stopPropagation());

                        const nameSpan = document.createElement('div');
                        nameSpan.className = 'museum-name';
                        if (!this.isSkeletonAvailable(inst.skeletonName)) nameSpan.classList.add('missing');
                        nameSpan.textContent = this.getInstanceLabel(inst);
                        nameSpan.draggable = true;
                        nameSpan.style.cursor = 'grab';

                        div.appendChild(dragHandle);
                        div.appendChild(visibilityBtn);
                        div.appendChild(timelineBtn);
                        div.appendChild(addBtn);
                        div.appendChild(nameSpan);
                        container.appendChild(div);

                        div.addEventListener('click', (e) => this.selectInstance(inst.id, e));

                        this.setupInstanceDragAndDrop(div, index, [dragHandle, nameSpan]);
                    });
                },

                setupInstanceDragAndDrop(element, index, dragSources) {
                    const sources = (dragSources && dragSources.length)
                        ? dragSources
                        : [element.querySelector('.museum-drag-handle')].filter(Boolean);
                    if (sources.length === 0) return;

                    const container = element.parentElement;

                    const clearDragMarks = () => {
                        if (!container) return;
                        Array.from(container.children).forEach(el => {
                            el.classList.remove('dragging');
                            el.classList.remove('drag-over');
                        });
                    };

                    sources.forEach(src => {
                        src.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', String(index));
                            e.dataTransfer.effectAllowed = 'move';
                            const scene = this.getCurrentScene();
                            const inst = scene ? scene.instances[index] : null;
                            const groupIds = inst && state.scenes.selectedIds.indexOf(inst.id) >= 0
                                ? state.scenes.selectedIds.slice()
                                : (inst ? [inst.id] : []);
                            if (container) {
                                Array.from(container.children).forEach(el => {
                                    el.classList.remove('dragging');
                                    if (el.dataset && groupIds.indexOf(el.dataset.instanceId) >= 0) {
                                        el.classList.add('dragging');
                                    }
                                });
                            }
                        });
                        src.addEventListener('dragend', clearDragMarks);
                    });

                    element.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        const draggingIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
                        if (draggingIndex === index || isNaN(draggingIndex)) return;
                        element.classList.add('drag-over');
                    });

                    element.addEventListener('dragleave', () => {
                        element.classList.remove('drag-over');
                    });

                    element.addEventListener('drop', (e) => {
                        e.preventDefault();
                        element.classList.remove('drag-over');
                        const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
                        this.moveInstancesDrop(fromIndex, index);
                    });
                },

                moveInstancesDrop(fromIndex, index) {
                    if (isNaN(fromIndex) || fromIndex === index) return;
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const list = scene.instances;
                    const dragged = list[fromIndex];
                    const target = list[index];
                    if (!dragged || !target) return;

                    let movingIds = state.scenes.selectedIds.slice();
                    if (movingIds.indexOf(dragged.id) < 0) movingIds = [dragged.id];
                    if (movingIds.indexOf(target.id) >= 0) return;

                    const moving = list.filter(i => movingIds.indexOf(i.id) >= 0);
                    const rest = list.filter(i => movingIds.indexOf(i.id) < 0);
                    const targetPos = rest.indexOf(target);
                    if (targetPos < 0) return;
                    const insertAt = fromIndex < index ? targetPos + 1 : targetPos;
                    const newList = rest.slice();
                    newList.splice(insertAt, 0, ...moving);
                    scene.instances = newList;

                    state.scenes.instanceAnchorId = dragged.id;
                    this.save();
                    this.renderInstanceList();
                    this.renderTimeline();
                    this.applyRenderOrder();
                },

                selectInstance(id, e) {
                    e = e || {};
                    const inst = this.findInstance(id);
                    if (!inst) return;
                    const scene = this.getCurrentScene();
                    const list = scene ? scene.instances : [];
                    const idx = list.findIndex(i => i.id === id);

                    let ids = (state.scenes.selectedIds || []).slice();
                    if (e.shiftKey && idx >= 0) {
                        let a = list.findIndex(i => i.id === state.scenes.instanceAnchorId);
                        if (a < 0) a = idx;
                        const start = Math.min(a, idx);
                        const end = Math.max(a, idx);
                        const range = list.slice(start, end + 1).map(i => i.id);
                        if (e.ctrlKey || e.metaKey) {
                            ids = Array.from(new Set(ids.concat(range)));
                        } else {
                            ids = range;
                        }
                    } else if (e.ctrlKey || e.metaKey) {
                        if (ids.indexOf(id) >= 0) {
                            ids = ids.filter(x => x !== id);
                        } else {
                            ids = ids.concat(id);
                        }
                        state.scenes.instanceAnchorId = id;
                    } else {
                        ids = [id];
                        state.scenes.instanceAnchorId = id;
                    }

                    state.scenes.newAnimationName = this.getDefaultAnimation(inst.skeletonName);
                    state.scenes.selectedStripId = null;
                    state.scenes.selectedVisibilityKeyId = null;
                    this.setSelection(ids);
                },

                updateSelectedControlsVisibility() {
                    this.renderInstanceList();
                },

                startInstancePaint(field, value, e) {
                    if (e) { e.preventDefault(); e.stopPropagation(); }
                    state.scenes.painting = { active: true, field: field, value: !!value };
                },

                paintInstance(inst, field) {
                    const p = state.scenes.painting;
                    if (!p || !p.active || p.field !== field) return;
                    if (field === 'timeline') {
                        inst.timelineVisible = p.value;
                    } else {
                        inst.visible = p.value;
                        const rt = state.scenes.instances[inst.id];
                        if (rt) rt.visible = inst.visible;
                    }
                    this.refreshInstancePaintUI();
                },

                refreshInstancePaintUI() {
                    document.querySelectorAll('.scene-inst-vis').forEach(btn => {
                        const inst = this.findInstance(btn.dataset.instanceId);
                        if (!inst) return;
                        btn.textContent = inst.visible ? '\u25CF' : '\u25CB';
                        btn.classList.toggle('visible', inst.visible);
                    });
                    document.querySelectorAll('.scene-tl-toggle').forEach(btn => {
                        const inst = this.findInstance(btn.dataset.instanceId);
                        if (!inst) return;
                        const on = inst.timelineVisible !== false;
                        btn.classList.toggle('visible', on);
                        btn.title = on ? 'Hide strip on timeline (drag to paint)' : 'Show strip on timeline (drag to paint)';
                    });
                },

                endInstancePaint() {
                    const p = state.scenes.painting;
                    state.scenes.painting = null;
                    if (!p || !p.active) return;
                    this.save();
                    this.renderInstanceList();
                    this.renderTimeline();
                    this.applyRenderOrder();
                },

                renderInstanceControls() {
                    const container = document.getElementById('sceneInstanceControls');
                    if (!container) return;
                    container.innerHTML = '';

                    const ids = state.scenes.selectedIds;
                    if (ids.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'scene-strip-info';
                        empty.textContent = 'No instance selected';
                        container.appendChild(empty);
                        return;
                    }
                    const targets = ids.map(id => this.findInstance(id)).filter(Boolean);
                    if (targets.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'scene-strip-info';
                        empty.textContent = 'No instance selected';
                        container.appendChild(empty);
                        return;
                    }

                    const multi = targets.length > 1;
                    const inst = targets[0];
                    const available = this.isSkeletonAvailable(inst.skeletonName);

                    const title = document.createElement('div');
                    title.className = 'scene-field-row';
                    if (multi) {
                        title.innerHTML = '<label>Objects</label><span style="flex:1;">' + targets.length + ' selected</span>';
                    } else {
                        title.innerHTML = '<label>Object</label><span style="flex:1;">' + escapeHtml(this.getInstanceLabel(inst)) + (available ? '' : ' <span style="color:rgba(230,120,120,0.8)">(not loaded)</span>') + '</span>';
                    }
                    const delBtn = document.createElement('button');
                    delBtn.className = 'scene-btn';
                    delBtn.textContent = multi ? ('Delete ' + targets.length + ' objects') : 'Delete object';
                    delBtn.addEventListener('click', () => {
                        const message = multi
                            ? 'Delete ' + targets.length + ' selected objects?'
                            : 'Delete object "' + this.getInstanceLabel(inst) + '"?';
                        showConfirm({ message: message, confirmLabel: 'Delete' }, () => this.removeInstances(targets.map(t => t.id)));
                    });
                    title.appendChild(delBtn);
                    container.appendChild(title);

                    const fmtVal = (v, dec) => dec ? Number(v).toFixed(dec) : String(Math.round(v));
                    const commonValue = (fn) => {
                        let v = null, ok = true;
                        targets.forEach(t => {
                            const x = fn(t);
                            if (v === null) v = x;
                            else if (Math.abs(x - v) > 1e-6) ok = false;
                        });
                        return ok ? v : null;
                    };
                    const applyToTargets = (fn) => {
                        targets.forEach(t => { fn(t); this.applyInstanceTransform(t); });
                    };

                    const fields = document.createElement('div');
                    fields.className = 'scene-fields';
                    container.appendChild(fields);

                    const mkField = (labelText, getCommon, applyAll, step, dec, extra) => {
                        const field = document.createElement('div');
                        field.className = 'scene-field';
                        const label = document.createElement('label');
                        label.className = 'scene-scrub-label';
                        label.textContent = labelText;
                        label.title = 'Drag to change';
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'coord-input';
                        const refresh = () => {
                            const c = getCommon();
                            input.value = c === null ? '' : fmtVal(c, dec);
                        };
                        refresh();
                        const commit = (v) => {
                            applyAll(v);
                            this.save();
                            refresh();
                        };
                        label.addEventListener('mousedown', (e) => {
                            const c = getCommon();
                            this.startValueScrub(e, c === null ? 0 : c, (v) => commit(v), step);
                        });
                        input.addEventListener('change', () => {
                            const v = parseFloat(input.value);
                            if (!isNaN(v)) commit(v);
                            else refresh();
                        });
                        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
                        field.appendChild(label);
                        field.appendChild(input);
                        if (extra) extra(field, refresh);
                        fields.appendChild(field);
                        return input;
                    };

                    inst._uiX = mkField('X', () => commonValue(t => t.x), (v) => applyToTargets(t => { t.x = v; }), 1, 0);
                    inst._uiY = mkField('Y', () => commonValue(t => t.y), (v) => applyToTargets(t => { t.y = v; }), 1, 0);
                    inst._uiRot = mkField('R', () => commonValue(t => t.rotation), (v) => applyToTargets(t => { t.rotation = v; }), 1, 0);
                    const scaleInput = mkField('Scale', () => commonValue(t => t.scale), (v) => applyToTargets(t => { t.scale = Math.max(0.05, Math.min(4, v)); }), 0.02, 2, (field, refresh) => {
                        const resetBtn = document.createElement('button');
                        resetBtn.className = 'scene-btn';
                        resetBtn.textContent = 'Reset';
                        resetBtn.addEventListener('click', () => {
                            applyToTargets(t => { t.scale = 1; });
                            this.save();
                            refresh();
                        });
                        field.appendChild(resetBtn);
                    });

                    const animRow = document.createElement('div');
                    animRow.className = 'scene-field-row';
                    const animLabel = document.createElement('label');
                    animLabel.textContent = 'Anim';
                    const animSelect = document.createElement('select');
                    animSelect.className = 'skin-select';
                    const anims = this.getAnimations(inst.skeletonName);
                    if (anims.length === 0) {
                        const opt = document.createElement('option');
                        opt.value = '';
                        opt.textContent = '(none)';
                        animSelect.appendChild(opt);
                    } else {
                        anims.forEach(a => {
                            const opt = document.createElement('option');
                            opt.value = a;
                            opt.textContent = a;
                            animSelect.appendChild(opt);
                        });
                        animSelect.value = state.scenes.newAnimationName || this.getDefaultAnimation(inst.skeletonName);
                    }
                    animSelect.addEventListener('change', () => {
                        const anim = animSelect.value;
                        state.scenes.newAnimationName = anim;
                        if (!anim) return;
                        if (targets.length > 1) {
                            this.addStripToAll(anim);
                        } else {
                            this.addStrip(inst.id, anim);
                        }
                    });
                    const addAnimBtn = document.createElement('button');
                    addAnimBtn.className = 'scene-btn';
                    addAnimBtn.textContent = '+ Add';
                    addAnimBtn.addEventListener('click', () => {
                        const anim = state.scenes.newAnimationName || animSelect.value;
                        if (targets.length > 1) {
                            this.addStripToAll(anim);
                        } else {
                            this.addStrip(inst.id, anim);
                        }
                    });
                    animRow.appendChild(animLabel);
                    animRow.appendChild(animSelect);
                    animRow.appendChild(addAnimBtn);
                    container.appendChild(animRow);

                    const vkeyRow = document.createElement('div');
                    vkeyRow.className = 'scene-field-row';
                    const vkeyLabel = document.createElement('label');
                    vkeyLabel.textContent = 'Visibility keys';
                    const showKeyBtn = document.createElement('button');
                    showKeyBtn.className = 'scene-btn';
                    showKeyBtn.textContent = '\u25CF';
                    showKeyBtn.title = 'Add visible key at playhead';
                    showKeyBtn.addEventListener('click', () => this.addVisibilityKeys(targets, true));
                    const hideKeyBtn = document.createElement('button');
                    hideKeyBtn.className = 'scene-btn';
                    hideKeyBtn.textContent = '\u25CB';
                    hideKeyBtn.title = 'Add hidden key at playhead';
                    hideKeyBtn.addEventListener('click', () => this.addVisibilityKeys(targets, false));
                    const clearOneBtn = document.createElement('button');
                    clearOneBtn.className = 'scene-btn';
                    clearOneBtn.textContent = 'Clear';
                    clearOneBtn.title = 'Delete selected visibility key';
                    const hasSelectedKey = !!state.scenes.selectedVisibilityKeyId
                        && targets.some(t => (t.visibilityKeys || []).some(k => k.id === state.scenes.selectedVisibilityKeyId));
                    clearOneBtn.disabled = !hasSelectedKey;
                    clearOneBtn.addEventListener('click', () => this.deleteSelectedVisibilityKey());
                    const clearKeysBtn = document.createElement('button');
                    clearKeysBtn.className = 'scene-btn';
                    clearKeysBtn.textContent = 'Clear all';
                    clearKeysBtn.title = 'Remove all visibility keys';
                    clearKeysBtn.addEventListener('click', () => this.clearVisibilityKeys(targets));
                    vkeyRow.appendChild(vkeyLabel);
                    vkeyRow.appendChild(showKeyBtn);
                    vkeyRow.appendChild(hideKeyBtn);
                    vkeyRow.appendChild(clearOneBtn);
                    vkeyRow.appendChild(clearKeysBtn);
                    container.appendChild(vkeyRow);

                    if (!multi) {
                    const strip = inst.strips.find(st => st.id === state.scenes.selectedStripId);
                    const stripRow = document.createElement('div');
                    stripRow.className = 'scene-field-row';
                    if (strip) {
                        const stripLabel = document.createElement('label');
                        stripLabel.textContent = 'Strip';
                        const stripSelect = document.createElement('select');
                        stripSelect.className = 'skin-select';
                        const allAnims = this.getAnimations(inst.skeletonName);
                        const names = allAnims.includes(strip.animation) || !strip.animation ? allAnims : [strip.animation].concat(allAnims);
                        names.forEach(a => {
                            const opt = document.createElement('option');
                            opt.value = a;
                            opt.textContent = a;
                            stripSelect.appendChild(opt);
                        });
                        stripSelect.value = strip.animation;
                        stripSelect.addEventListener('change', () => {
                            strip.animation = stripSelect.value;
                            this.save();
                            this.renderTimeline();
                            this.applyAtTime(state.scenes.ptr.time);
                        });
                        const loopWrap = document.createElement('label');
                        loopWrap.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:13px;color:var(--n-text);cursor:pointer;flex-shrink:0;';
                        const loopCb = document.createElement('input');
                        loopCb.type = 'checkbox';
                        loopCb.checked = !!strip.loop;
                        loopCb.style.margin = '0';
                        const loopText = document.createElement('span');
                        loopText.textContent = 'Loop';
                        loopWrap.appendChild(loopCb);
                        loopWrap.appendChild(loopText);
                        loopCb.addEventListener('change', () => {
                            strip.loop = loopCb.checked;
                            this.save();
                            this.renderTimeline();
                            this.applyAtTime(state.scenes.ptr.time);
                        });
                        const delStripBtn = document.createElement('button');
                        delStripBtn.className = 'scene-btn';
                        delStripBtn.textContent = 'Del';
                        delStripBtn.addEventListener('click', () => this.deleteStrip(inst.id, strip.id));
                        stripRow.appendChild(stripLabel);
                        stripRow.appendChild(stripSelect);
                        stripRow.appendChild(loopWrap);
                        stripRow.appendChild(delStripBtn);
                    } else {
                        stripRow.innerHTML = '<label>Strip</label><span style="color:var(--n-text-dim)">click a strip on the timeline</span>';
                    }
                    container.appendChild(stripRow);
                    }
                },

                applyInstanceTransform(inst) {
                    const rt = state.scenes.instances[inst.id];
                    if (rt) {
                        this.applyCameraTransform(rt, inst);
                        this.drawSelection();
                    }
                    this.drawMarkers();
                },

                startValueScrub(e, baseValue, onUpdate, step) {
                    e.preventDefault();
                    const base = isFinite(baseValue) ? baseValue : 0;
                    const increment = step || 1;
                    let lastClientX = e.clientX;
                    let cumulative = 0;
                    let locked = false;
                    const target = e.currentTarget;
                    document.body.style.userSelect = 'none';

                    const onMove = (ev) => {
                        if (locked) {
                            cumulative += ev.movementX || 0;
                        } else {
                            cumulative += ev.clientX - lastClientX;
                            lastClientX = ev.clientX;
                        }
                        onUpdate(base + cumulative * increment);
                    };

                    const onLockChange = () => {
                        locked = !!document.pointerLockElement;
                    };

                    const cleanup = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', cleanup);
                        document.removeEventListener('pointerlockchange', onLockChange);
                        document.body.style.userSelect = '';
                        if (document.pointerLockElement) {
                            document.exitPointerLock();
                        }
                    };

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', cleanup);
                    document.addEventListener('pointerlockchange', onLockChange);

                    if (target && target.requestPointerLock) {
                        try { target.requestPointerLock(); } catch (err) {}
                    }
                },

                drawSelection() {
                    const g = state.scenes.graphics.selection;
                    if (!g) return;
                    g.clear();
                    const scene = this.getCurrentScene();
                    if (!scene) {
                        this.clearSelectionLabels();
                        return;
                    }
                    const ids = (state.scenes.selectedIds || []).slice();
                    const hoverId = state.scenes.hoveredInstanceId;
                    if (hoverId && ids.indexOf(hoverId) < 0) ids.push(hoverId);
                    const used = {};
                    for (let i = 0; i < ids.length; i++) {
                        const inst = this.findInstance(ids[i]);
                        if (!inst) continue;
                        if (!inst.visible) continue;
                        const sx = inst.x * scene.camera.scale + scene.camera.ox;
                        const sy = inst.y * scene.camera.scale + scene.camera.oy;
                        const size = 10;
                        g.beginPath();
                        g.moveTo(sx, sy - size);
                        g.lineTo(sx + size, sy);
                        g.lineTo(sx, sy + size);
                        g.lineTo(sx - size, sy);
                        g.closePath();
                        g.fill({ color: 0xffffff, alpha: 0.5 });
                        g.stroke({ width: 2, color: 0x000000, alpha: 1.0 });

                        let label = state.scenes.labels[inst.id];
                        if (!label || label.destroyed) {
                            label = new PIXI.Text({
                                text: this.getInstanceLabel(inst),
                                style: {
                                    fontFamily: 'Arial',
                                    fontSize: 14,
                                    fill: 0xffffff,
                                    stroke: { color: 0x000000, width: 3, join: 'round' },
                                    align: 'center'
                                }
                            });
                            label.anchor.set(0.5, 0.5);
                            state.scenes.labels[inst.id] = label;
                        } else {
                            label.text = this.getInstanceLabel(inst);
                        }
                        label.x = sx;
                        label.y = sy - 24;
                        if (state.app && label.parent !== state.app.stage) {
                            state.app.stage.addChild(label);
                        }
                        used[inst.id] = true;
                    }
                    for (const key of Object.keys(state.scenes.labels)) {
                        if (used[key]) continue;
                        const label = state.scenes.labels[key];
                        if (label && label.parent) label.parent.removeChild(label);
                        if (label && !label.destroyed) label.destroy();
                        delete state.scenes.labels[key];
                    }
                },

                clearSelectionLabels() {
                    for (const key of Object.keys(state.scenes.labels)) {
                        const label = state.scenes.labels[key];
                        if (label && label.parent) label.parent.removeChild(label);
                        if (label && !label.destroyed) label.destroy();
                    }
                    state.scenes.labels = {};
                },

                drawMarqueeRect(x1, y1, x2, y2) {
                    const g = state.scenes.graphics.marquee;
                    if (!g) return;
                    g.clear();
                    const minX = Math.min(x1, x2);
                    const minY = Math.min(y1, y2);
                    const w = Math.abs(x2 - x1);
                    const h = Math.abs(y2 - y1);
                    g.rect(minX, minY, w, h);
                    g.fill({ color: 0x3399FF, alpha: 0.12 });
                    g.stroke({ width: 1, color: 0x3399FF, alpha: 0.8 });
                },

                clearMarquee() {
                    const g = state.scenes.graphics.marquee;
                    if (g) g.clear();
                },

                updateSelectionFromRect(x1, y1, x2, y2) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const minX = Math.min(x1, x2);
                    const maxX = Math.max(x1, x2);
                    const minY = Math.min(y1, y2);
                    const maxY = Math.max(y1, y2);
                    const ids = [];
                    scene.instances.forEach(inst => {
                        if (!inst.visible) return;
                        const sx = inst.x * scene.camera.scale + scene.camera.ox;
                        const sy = inst.y * scene.camera.scale + scene.camera.oy;
                        if (sx >= minX && sx <= maxX && sy >= minY && sy <= maxY) ids.push(inst.id);
                    });
                    state.scenes.selectedIds = ids;
                    state.scenes.selectedInstanceId = ids.length === 1 ? ids[0] : null;
                    if (ids.length !== 1) {
                        state.scenes.selectedStripId = null;
                        state.scenes.selectedVisibilityKeyId = null;
                    }
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.drawSelection();
                },

                /* ================= animation helpers ================= */

                getAnimations(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    if (sk && sk.skeleton && sk.skeleton.data && sk.skeleton.data.animations) {
                        return sk.skeleton.data.animations.map(a => a.name).sort((a, b) => a.localeCompare(b));
                    }
                    const cached = state.animationDurations[skeletonName];
                    if (cached) return Object.keys(cached).sort((a, b) => a.localeCompare(b));
                    return [];
                },

                getDefaultAnimation(skeletonName) {
                    const names = this.getAnimations(skeletonName);
                    if (names.length === 0) return '';
                    const idle = names.find(n => n.toLowerCase().includes('idle'));
                    if (idle) return idle;
                    return names[0];
                },

                hasAnimation(skeletonName, animationName) {
                    if (!animationName) return false;
                    const cached = state.animationDurations[skeletonName];
                    if (cached && cached[animationName] !== undefined) return true;
                    const sk = state.skeletons[skeletonName];
                    if (sk && sk.skeleton && sk.skeleton.data) {
                        return (sk.skeleton.data.animations || []).some(a => a.name === animationName);
                    }
                    return false;
                },

                getDuration(skeletonName, animationName) {
                    const d = playerManager.getAnimationDuration(skeletonName, animationName);
                    return (d && d > 0) ? d : 0;
                },

                /* ================= instance ops ================= */

                buildInstance(skeletonName, worldX, worldY) {
                    const inst = {
                        id: this.newId('inst'),
                        skeletonName: skeletonName,
                        label: this.computeInstanceLabel(skeletonName),
                        x: Math.round(worldX),
                        y: Math.round(worldY),
                        scale: 1,
                        rotation: 0,
                        visible: true,
                        timelineVisible: true,
                        visibilityKeys: [],
                        strips: []
                    };
                    const def = this.getDefaultAnimation(skeletonName);
                    if (def) {
                        const dur = this.getDuration(skeletonName, def);
                        inst.strips.push({
                            id: this.newId('strip'),
                            animation: def,
                            start: 0,
                            length: Math.max(1 / this.FPS, this.snapToFrame(dur > 0 ? dur : 1)),
                            loop: true
                        });
                    }
                    return inst;
                },

                addInstanceAt(skeletonName, clientX, clientY) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const canvas = document.getElementById('canvas');
                    const rect = canvas.getBoundingClientRect();
                    const cam = scene.camera;
                    const worldX = (clientX - rect.left - cam.ox) / cam.scale;
                    const worldY = (clientY - rect.top - cam.oy) / cam.scale;
                    const inst = this.buildInstance(skeletonName, worldX, worldY);
                    scene.instances.unshift(inst);
                    const rt = this.createRuntimeFor(inst);
                    if (rt) {
                        rt.state.timeScale = 0;
                        state.scenes.instances[inst.id] = rt;
                        this.applyCameraTransform(rt, inst);
                    }
                    this.save();
                    this.applyRenderOrder();
                    this.applyAllTransforms();
                    this.drawMarkers();
                    this.renderInstanceList();
                    this.selectInstance(inst.id);
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                },

                addAllSkeletons() {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const names = Array.from(state.loadedSkeletons).sort((a, b) => a.localeCompare(b));
                    if (names.length === 0) return;
                    const layout = museumManager.computeLayout();
                    const created = names.map(name => {
                        const pos = layout[name] || { x: 0, y: 0 };
                        return this.buildInstance(name, pos.x, pos.y);
                    });
                    scene.instances = created.concat(scene.instances);
                    created.forEach(inst => {
                        const rt = this.createRuntimeFor(inst);
                        if (rt) {
                            rt.state.timeScale = 0;
                            state.scenes.instances[inst.id] = rt;
                            this.applyCameraTransform(rt, inst);
                        }
                    });
                    this.save();
                    this.fitCameraToContent();
                    this.applyRenderOrder();
                    this.applyAllTransforms();
                    this.drawWorkspace();
                    this.drawMarkers();
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                },

                reorderSelectedInstances(toTop) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const ids = new Set(state.scenes.selectedIds || []);
                    if (ids.size === 0) return;
                    const moving = scene.instances.filter(i => ids.has(i.id));
                    const rest = scene.instances.filter(i => !ids.has(i.id));
                    scene.instances = toTop ? moving.concat(rest) : rest.concat(moving);
                    this.save();
                    this.applyRenderOrder();
                    this.renderInstanceList();
                    this.renderTimeline();
                },

                removeInstance(id) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const idx = scene.instances.findIndex(i => i.id === id);
                    if (idx < 0) return;
                    scene.instances.splice(idx, 1);
                    const rt = state.scenes.instances[id];
                    if (rt) {
                        try {
                            if (rt.state) rt.state.clearTracks();
                            if (rt.parent) rt.parent.removeChild(rt);
                            rt.destroy();
                        } catch (e) {}
                        delete state.scenes.instances[id];
                    }
                    if (state.scenes.selectedInstanceId === id) {
                        state.scenes.selectedInstanceId = null;
                        state.scenes.selectedStripId = null;
                    }
                    state.scenes.selectedIds = state.scenes.selectedIds.filter(x => x !== id);
                    this.save();
                    this.applyRenderOrder();
                    this.drawMarkers();
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.drawSelection();
                },

                removeInstances(ids) {
                    const scene = this.getCurrentScene();
                    if (!scene || !ids || ids.length === 0) return;
                    ids.forEach(id => {
                        const idx = scene.instances.findIndex(i => i.id === id);
                        if (idx < 0) return;
                        scene.instances.splice(idx, 1);
                        const rt = state.scenes.instances[id];
                        if (rt) {
                            try {
                                if (rt.state) rt.state.clearTracks();
                                if (rt.parent) rt.parent.removeChild(rt);
                                rt.destroy();
                            } catch (e) {}
                            delete state.scenes.instances[id];
                        }
                    });
                    state.scenes.selectedIds = state.scenes.selectedIds.filter(x => ids.indexOf(x) < 0);
                    state.scenes.selectedInstanceId = null;
                    state.scenes.selectedStripId = null;
                    this.save();
                    this.applyRenderOrder();
                    this.drawMarkers();
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.drawSelection();
                },

                addStripToAll(animationName) {
                    const targets = state.scenes.selectedIds.map(id => this.findInstance(id)).filter(Boolean);
                    if (targets.length === 0) return;
                    targets.forEach(inst => {
                        const anim = animationName || state.scenes.newAnimationName || this.getDefaultAnimation(inst.skeletonName);
                        if (!anim) return;
                        let start = 0;
                        inst.strips.forEach(st => { start = Math.max(start, st.start + st.length); });
                        start = this.snapToFrame(start);
                        const dur = this.getDuration(inst.skeletonName, anim);
                        inst.strips.push({
                            id: this.newId('strip'),
                            animation: anim,
                            start: start,
                            length: Math.max(1 / this.FPS, this.snapToFrame(dur > 0 ? dur : 1)),
                            loop: true
                        });
                    });
                    this.save();
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                },

                addStrip(instanceId, animationName) {
                    const inst = this.findInstance(instanceId);
                    if (!inst) return;
                    const anim = animationName || state.scenes.newAnimationName || this.getDefaultAnimation(inst.skeletonName);
                    if (!anim) return;
                    let start = 0;
                    inst.strips.forEach(st => { start = Math.max(start, st.start + st.length); });
                    start = this.snapToFrame(start);
                    const dur = this.getDuration(inst.skeletonName, anim);
                    const strip = {
                        id: this.newId('strip'),
                        animation: anim,
                        start: start,
                        length: Math.max(1 / this.FPS, this.snapToFrame(dur > 0 ? dur : 1)),
                        loop: true
                    };
                    inst.strips.push(strip);
                    state.scenes.selectedIds = [instanceId];
                    state.scenes.selectedInstanceId = instanceId;
                    state.scenes.selectedStripId = strip.id;
                    state.scenes.selectedVisibilityKeyId = null;
                    this.save();
                    this.renderInstanceList();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                },

                deleteStrip(instanceId, stripId) {
                    const inst = this.findInstance(instanceId);
                    if (!inst) return;
                    const idx = inst.strips.findIndex(st => st.id === stripId);
                    if (idx < 0) return;
                    inst.strips.splice(idx, 1);
                    if (state.scenes.selectedStripId === stripId) state.scenes.selectedStripId = null;
                    this.save();
                    this.renderInstanceControls();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                },

                /* ================= timeline ================= */

                getSceneDuration(scene) {
                    let max = 0;
                    scene.instances.forEach(inst => {
                        inst.strips.forEach(st => {
                            const end = st.start + st.length;
                            if (end > max) max = end;
                        });
                    });
                    return max;
                },

                getPps() {
                    const v = state.scenes.view;
                    return (v && v.pps) ? v.pps : this.PPS;
                },

                getLabelWidth() {
                    const v = state.scenes.view && state.scenes.view.labelWidth;
                    return (isFinite(v) && v > 0) ? v : 132;
                },

                loadLabelWidth() {
                    let raw = null;
                    try { raw = localStorage.getItem(this.LABEL_WIDTH_KEY); } catch (e) {}
                    const v = parseInt(raw, 10);
                    if (!isNaN(v)) state.scenes.view.labelWidth = Math.max(60, Math.min(400, v));
                },

                saveLabelWidth() {
                    try { localStorage.setItem(this.LABEL_WIDTH_KEY, String(Math.round(this.getLabelWidth()))); } catch (e) {}
                },

                loadGrid() {
                    let raw = null;
                    try { raw = localStorage.getItem(this.GRID_KEY); } catch (e) {}
                    if (!raw) return;
                    try {
                        const g = JSON.parse(raw);
                        const grid = state.scenes.grid;
                        if (isFinite(g.stepX)) grid.stepX = Math.max(1, Number(g.stepX));
                        if (isFinite(g.stepY)) grid.stepY = Math.max(1, Number(g.stepY));
                        if (isFinite(g.cols)) grid.cols = Math.max(1, Math.round(Number(g.cols)));
                        if (isFinite(g.rows)) grid.rows = Math.max(1, Math.round(Number(g.rows)));
                        if (g.snap !== undefined) grid.snap = !!g.snap;
                        grid.snapHalfs = !!g.snapHalfs;
                        grid.fromReelsBox = !!g.fromReelsBox;
                        if (g.show !== undefined) grid.show = !!g.show;
                    } catch (e) {}
                },

                saveGrid() {
                    try { localStorage.setItem(this.GRID_KEY, JSON.stringify(state.scenes.grid)); } catch (e) {}
                },

                updateSceneGridInputs() {
                    const grid = state.scenes.grid;
                    const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = String(val); };
                    setVal('gridStepX', grid.stepX);
                    setVal('gridStepY', grid.stepY);
                    setVal('gridCols', grid.cols);
                    setVal('gridRows', grid.rows);
                    const setCb = (id, val) => { const el = document.getElementById(id); if (el) el.checked = !!val; };
                    setCb('gridSnap', grid.snap);
                    setCb('gridSnapHalfs', grid.snapHalfs);
                    setCb('gridFromReelsBox', grid.fromReelsBox);
                    setCb('gridShow', grid.show);
                },

                initSceneGridControls() {
                    const grid = state.scenes.grid;
                    const bindNum = (id, key, round) => {
                        const el = document.getElementById(id);
                        if (!el) return;
                        el.addEventListener('change', () => {
                            let v = parseFloat(el.value);
                            if (isNaN(v)) v = grid[key];
                            v = Math.max(1, round ? Math.round(v) : v);
                            grid[key] = v;
                            el.value = String(v);
                            this.saveGrid();
                            this.drawWorkspace();
                        });
                        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
                    };
                    bindNum('gridStepX', 'stepX', false);
                    bindNum('gridStepY', 'stepY', false);
                    bindNum('gridCols', 'cols', true);
                    bindNum('gridRows', 'rows', true);

                    const addScrub = (inputId, key, step, round) => {
                        const el = document.getElementById(inputId);
                        if (!el || !el.parentElement) return;
                        const label = el.parentElement.querySelector('label');
                        if (!label) return;
                        label.classList.add('scene-scrub-label');
                        label.title = 'Drag to change';
                        label.addEventListener('mousedown', (e) => {
                            this.startValueScrub(e, state.scenes.grid[key], (v) => {
                                const nv = Math.max(1, round ? Math.round(v) : v);
                                state.scenes.grid[key] = nv;
                                el.value = String(nv);
                                this.saveGrid();
                                this.drawWorkspace();
                            }, step);
                        });
                    };
                    addScrub('gridStepX', 'stepX', 1, false);
                    addScrub('gridStepY', 'stepY', 1, false);
                    addScrub('gridCols', 'cols', 1, true);
                    addScrub('gridRows', 'rows', 1, true);

                    const bindCb = (id, key) => {
                        const el = document.getElementById(id);
                        if (!el) return;
                        el.addEventListener('change', () => {
                            grid[key] = el.checked;
                            this.saveGrid();
                            this.drawWorkspace();
                        });
                    };
                    bindCb('gridSnap', 'snap');
                    bindCb('gridSnapHalfs', 'snapHalfs');
                    bindCb('gridFromReelsBox', 'fromReelsBox');
                    bindCb('gridShow', 'show');

                    const resetBtn = document.getElementById('sceneGridResetBtn');
                    if (resetBtn) resetBtn.addEventListener('click', () => this.resetSceneGrid());

                    this.updateSceneGridInputs();
                },

                resetSceneGrid() {
                    const grid = state.scenes.grid;
                    grid.stepX = 100;
                    grid.stepY = 100;
                    grid.cols = 10;
                    grid.rows = 10;
                    grid.snap = true;
                    grid.snapHalfs = false;
                    grid.fromReelsBox = false;
                    grid.show = true;
                    this.updateSceneGridInputs();
                    this.saveGrid();
                    this.drawWorkspace();
                },

                getReelsBoxInstance(scene) {
                    if (!scene) return null;
                    return scene.instances.find(i => i.skeletonName === 'reels-box') || null;
                },

                getGridCenter(scene) {
                    const grid = state.scenes.grid;
                    if (grid && grid.fromReelsBox && scene) {
                        const c = this.getReelsBoxCenter(scene);
                        if (c) return c;
                    }
                    return { x: 0, y: 0 };
                },

                getReelsBoxCenter(scene) {
                    const box = this.getReelsBoxInstance(scene);
                    if (!box) return null;
                    const rt = state.scenes.instances[box.id];
                    if (rt && rt.skeleton) {
                        try {
                            if (typeof rt.skeleton.updateWorldTransform === 'function') {
                                rt.skeleton.updateWorldTransform();
                            }
                            const slot = typeof rt.skeleton.findSlot === 'function'
                                ? rt.skeleton.findSlot('placeholder-reels')
                                : null;
                            const bone = slot && slot.bone;
                            if (bone) {
                                const s = box.scale || 1;
                                return { x: box.x + bone.worldX * s, y: box.y + bone.worldY * s };
                            }
                        } catch (e) {}
                    }
                    return { x: box.x, y: box.y };
                },

                getGridLayout(scene) {
                    const grid = state.scenes.grid;
                    const stepX = Math.max(1, grid.stepX);
                    const stepY = Math.max(1, grid.stepY);
                    const cols = Math.max(1, Math.round(grid.cols));
                    const rows = Math.max(1, Math.round(grid.rows));
                    const center = this.getGridCenter(scene);
                    return {
                        stepX: stepX,
                        stepY: stepY,
                        cols: cols,
                        rows: rows,
                        center: center,
                        startX: center.x - (cols - 1) / 2 * stepX,
                        startY: center.y - (rows - 1) / 2 * stepY
                    };
                },

                snapToSceneGrid(x, y, scene, skipSnap) {
                    const grid = state.scenes.grid;
                    if (!grid || !grid.snap || skipSnap) return { x: x, y: y };
                    const layout = this.getGridLayout(scene);
                    const sx = layout.stepX * (grid.snapHalfs ? 0.5 : 1);
                    const sy = layout.stepY * (grid.snapHalfs ? 0.5 : 1);
                    return {
                        x: layout.startX + Math.round((x - layout.startX) / sx) * sx,
                        y: layout.startY + Math.round((y - layout.startY) / sy) * sy
                    };
                },

                drawSceneGridPoints(scene) {
                    const g = state.scenes.graphics.grid;
                    if (!g) return;
                    g.clear();
                    const grid = state.scenes.grid;
                    if (!grid || !grid.show || !state.app || !scene) return;
                    const cam = scene.camera;
                    const layout = this.getGridLayout(scene);
                    const color = graphicsManager.getLineColor();
                    const screenW = state.app.screen.width;
                    const screenH = state.app.screen.height;
                    const r = Math.max(1, Math.min(3, 1.5 * cam.scale));
                    for (let i = 0; i < layout.cols; i++) {
                        for (let j = 0; j < layout.rows; j++) {
                            const sx = (layout.startX + i * layout.stepX) * cam.scale + cam.ox;
                            const sy = (layout.startY + j * layout.stepY) * cam.scale + cam.oy;
                            if (sx < -10 || sx > screenW + 10 || sy < -10 || sy > screenH + 10) continue;
                            g.circle(sx, sy, r);
