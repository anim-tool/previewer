                        }
                    }
                    g.fill({ color: color, alpha: 0.35 });
                },

                applyTimelineLabelWidth() {
                    const rows = document.getElementById('sceneTimelineRows');
                    if (rows) {
                        rows.style.setProperty('--scene-label-w', this.getLabelWidth() + 'px');
                        if (this._lastTrackWidth) {
                            rows.style.width = (this.getLabelWidth() + this._lastTrackWidth) + 'px';
                        }
                    }
                    this.updateSplitterPosition();
                },

                updateSplitterPosition() {
                    const scroll = document.getElementById('sceneTimelineScroll');
                    const splitter = document.getElementById('sceneLabelSplitter');
                    if (!scroll || !splitter) return;
                    splitter.style.left = Math.max(0, this.getLabelWidth() - 5) + 'px';
                    splitter.style.top = scroll.offsetTop + 'px';
                    splitter.style.height = scroll.clientHeight + 'px';
                },

                initLabelSplitter() {
                    const splitter = document.getElementById('sceneLabelSplitter');
                    if (splitter) {
                        splitter.addEventListener('mousedown', (e) => this.beginLabelSplitterDrag(e));
                    }
                    const scroll = document.getElementById('sceneTimelineScroll');
                    if (scroll && window.ResizeObserver) {
                        const ro = new ResizeObserver(() => this.updateSplitterPosition());
                        ro.observe(scroll);
                    }
                    window.addEventListener('resize', () => this.updateSplitterPosition());
                },

                beginLabelSplitterDrag(e) {
                    e.preventDefault();
                    const splitter = document.getElementById('sceneLabelSplitter');
                    if (splitter) splitter.classList.add('dragging');
                    const startX = e.clientX;
                    const startW = this.getLabelWidth();

                    const onMove = (ev) => {
                        let w = startW + (ev.clientX - startX);
                        w = Math.max(60, Math.min(400, w));
                        state.scenes.view.labelWidth = w;
                        this.applyTimelineLabelWidth();
                    };
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        if (splitter) splitter.classList.remove('dragging');
                        this.saveLabelWidth();
                        this.applyTimelineLabelWidth();
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                renderTimeline() {
                    const rows = document.getElementById('sceneTimelineRows');
                    if (!rows) return;
                    rows.innerHTML = '';
                    const scene = this.getCurrentScene();
                    if (!scene) return;

                    const pps = this.getPps();
                    const totalSec = Math.max(this.getSceneDuration(scene), 4);
                    const trackWidth = Math.ceil(totalSec * pps) + 300;
                    this._lastTrackWidth = trackWidth;
                    rows.style.setProperty('--scene-label-w', this.getLabelWidth() + 'px');
                    rows.style.width = (this.getLabelWidth() + trackWidth) + 'px';

                    rows.appendChild(this.buildRulerRow(trackWidth, pps));

                    scene.instances.forEach((inst, index) => {
                        if (inst.timelineVisible === false) return;

                        const row = document.createElement('div');
                        row.className = 'scene-tl-row';
                        row.dataset.instanceId = inst.id;

                        const label = document.createElement('div');
                        label.className = 'scene-tl-label' + (this.isSelected(inst.id) ? ' selected' : '');

                        const visBtn = document.createElement('button');
                        visBtn.className = 'museum-visibility-btn scene-inst-vis' + (inst.visible ? ' visible' : '');
                        visBtn.dataset.instanceId = inst.id;
                        visBtn.textContent = inst.visible ? '\u25CF' : '\u25CB';
                        visBtn.title = 'Toggle visibility (drag to paint)';
                        visBtn.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.startInstancePaint('visible', !inst.visible, e);
                            this.paintInstance(inst, 'visible');
                        });
                        visBtn.addEventListener('mouseenter', () => this.paintInstance(inst, 'visible'));
                        visBtn.addEventListener('click', (e) => e.stopPropagation());

                        const name = document.createElement('div');
                        name.className = 'scene-tl-name' + (this.isSelected(inst.id) ? ' selected' : '');
                        if (!this.isSkeletonAvailable(inst.skeletonName)) name.classList.add('missing');
                        else if (inst.strips.some(st => !this.hasAnimation(inst.skeletonName, st.animation))) name.classList.add('anim-missing');
                        name.textContent = this.getInstanceLabel(inst);
                        name.draggable = true;

                        label.appendChild(visBtn);
                        label.appendChild(name);
                        label.addEventListener('click', (e) => this.selectInstance(inst.id, e));

                        const track = document.createElement('div');
                        track.className = 'scene-tl-track';
                        track.style.width = trackWidth + 'px';

                        track.addEventListener('mousedown', (e) => {
                            if (e.target !== track) return;
                            const rect = track.getBoundingClientRect();
                            const t = Math.max(0, (e.clientX - rect.left) / pps);
                            this.setTime(t);
                        });

                        inst.strips.forEach(strip => {
                            track.appendChild(this.buildStripElement(inst, strip, pps));
                        });

                        (inst.visibilityKeys || []).forEach(k => {
                            const marker = document.createElement('div');
                            marker.className = 'scene-tl-vkey' + (k.visible ? ' visible' : '')
                                + (state.scenes.selectedVisibilityKeyId === k.id && this.isSelected(inst.id) ? ' selected' : '');
                            marker.style.left = Math.round(k.time * pps) + 'px';
                            marker.title = (k.visible ? 'Visible' : 'Hidden') + ' @ ' + this.formatTime(k.time);
                            marker.dataset.keyId = k.id;
                            marker.addEventListener('mousedown', (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                state.scenes.selectedIds = [inst.id];
                                state.scenes.selectedInstanceId = inst.id;
                                state.scenes.instanceAnchorId = inst.id;
                                state.scenes.selectedStripId = null;
                                state.scenes.selectedVisibilityKeyId = k.id;
                                this.renderInstanceList();
                                this.renderInstanceControls();
                                this.renderTimeline();
                                this.drawSelection();
                                const fresh = document.querySelector('#sceneTimelineRows .scene-tl-vkey[data-key-id="' + k.id + '"]');
                                this.beginVisibilityKeyDrag(e, inst, k, fresh || marker, pps);
                            });
                            track.appendChild(marker);
                        });

                        row.appendChild(label);
                        row.appendChild(track);
                        rows.appendChild(row);

                        this.setupInstanceDragAndDrop(row, index, [name]);
                    });

                    this.updateSplitterPosition();
                },

                buildRulerRow(trackWidth, pps) {
                    const row = document.createElement('div');
                    row.className = 'scene-tl-ruler-row';

                    const label = document.createElement('div');
                    label.className = 'scene-tl-ruler-label';
                    label.textContent = 's \u00B7 zoom';
                    label.title = 'Scroll to zoom the timeline';

                    const ruler = document.createElement('div');
                    ruler.className = 'scene-tl-ruler';
                    ruler.style.width = trackWidth + 'px';
                    ruler.dataset.ruler = '1';

                    const step = this.pickTickStep(pps);
                    const maxTime = trackWidth / pps;

                    const frameStep = 1 / this.FPS;
                    const frameSpacing = frameStep * pps;
                    if (frameSpacing >= 1) {
                        const totalFrames = Math.floor(maxTime / frameStep + 1e-6);
                        const mult = Math.max(1, Math.ceil((totalFrames + 1) / 2000));
                        for (let f = 0; f <= totalFrames; f += mult) {
                            const t = f * frameStep;
                            const tick = document.createElement('div');
                            tick.className = 'scene-tl-frame-tick' + (f % this.FPS === 0 ? ' second' : '');
                            tick.style.left = Math.round(t * pps) + 'px';
                            ruler.appendChild(tick);
                        }
                    }

                    for (let t = 0; t <= maxTime + 1e-6; t += step) {
                        const tick = document.createElement('div');
                        tick.className = 'scene-tl-tick';
                        tick.style.left = Math.round(t * pps) + 'px';
                        const tickLabel = document.createElement('div');
                        tickLabel.className = 'scene-tl-tick-label';
                        tickLabel.style.left = Math.round(t * pps) + 'px';
                        tickLabel.textContent = this.formatTime(t);
                        ruler.appendChild(tick);
                        ruler.appendChild(tickLabel);
                    }

                    ruler.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        this.beginRulerScrub(e, ruler, pps);
                    });

                    ruler.addEventListener('wheel', (e) => {
                        e.preventDefault();
                        this.zoomTimeline(e.deltaY, e.clientX);
                    }, { passive: false });

                    row.appendChild(label);
                    row.appendChild(ruler);
                    return row;
                },

                pickTickStep(pps) {
                    const candidates = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
                    for (let i = 0; i < candidates.length; i++) {
                        if (candidates[i] * pps >= 60) return candidates[i];
                    }
                    return candidates[candidates.length - 1];
                },

                formatTime(t) {
                    if (t >= 60) {
                        const m = Math.floor(t / 60);
                        const s = t - m * 60;
                        return m + ':' + (s < 10 ? '0' : '') + (Math.round(s * 100) / 100);
                    }
                    return (Math.round(t * 100) / 100) + 's';
                },

                beginRulerScrub(e, ruler, pps) {
                    const rect = ruler.getBoundingClientRect();
                    const seekAt = (clientX) => {
                        const t = Math.max(0, (clientX - rect.left) / pps);
                        this.setTime(t);
                    };
                    seekAt(e.clientX);

                    document.body.style.userSelect = 'none';
                    const onMove = (ev) => seekAt(ev.clientX);
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.body.style.userSelect = '';
                        this.setTime(this.snapToFrame(state.scenes.ptr.time));
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                zoomTimeline(deltaY, clientX) {
                    const scroll = document.getElementById('sceneTimelineScroll');
                    if (!scroll) return;
                    const oldPps = this.getPps();
                    const factor = deltaY > 0 ? 0.85 : 1.18;
                    const newPps = Math.max(5, Math.min(4000, oldPps * factor));
                    if (newPps === oldPps) return;

                    const scrollRect = scroll.getBoundingClientRect();
                    const viewX = clientX - scrollRect.left;
                    const contentX = viewX + scroll.scrollLeft;
                    const timeAtCursor = (contentX - this.getLabelWidth()) / oldPps;

                    state.scenes.view.pps = newPps;
                    this.renderTimeline();

                    const newScrollLeft = this.getLabelWidth() + timeAtCursor * newPps - viewX;
                    scroll.scrollLeft = Math.max(0, newScrollLeft);
                    this.updatePlayheads();
                },

                buildStripElement(inst, strip, pps) {
                    const el = document.createElement('div');
                    el.className = 'scene-tl-strip';
                    if (this.isSelected(inst.id)) el.classList.add('inst-selected');
                    if (strip.loop) el.classList.add('loop');
                    if (this.isSelected(inst.id) && strip.id === state.scenes.selectedStripId) el.classList.add('selected');

                    const missing = !this.hasAnimation(inst.skeletonName, strip.animation);
                    if (missing) el.classList.add('missing');

                    el.style.left = Math.round(strip.start * pps) + 'px';
                    el.style.width = Math.max(2, Math.round(strip.length * pps)) + 'px';

                    const dur = this.getDuration(inst.skeletonName, strip.animation);
                    let labelText = strip.animation || '(none)';
                    if (dur > 0) {
                        const reps = strip.length / dur;
                        labelText += '  \u00D7' + (Math.round(reps * 100) / 100);
                    }
                    const labelEl = document.createElement('div');
                    labelEl.className = 'scene-tl-strip-label';
                    labelEl.textContent = labelText;
                    el.appendChild(labelEl);

                    if (dur > 0 && strip.loop) {
                        for (let t = dur; t < strip.length - 1e-4; t += dur) {
                            const sep = document.createElement('div');
                            sep.className = 'scene-tl-repeat-sep';
                            sep.style.left = Math.round(t * pps) + 'px';
                            el.appendChild(sep);
                        }
                    }

                    const resize = document.createElement('div');
                    resize.className = 'scene-tl-strip-resize';
                    el.appendChild(resize);

                    el.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        state.scenes.selectedIds = [inst.id];
                        state.scenes.selectedInstanceId = inst.id;
                        state.scenes.selectedStripId = strip.id;
                        state.scenes.selectedVisibilityKeyId = null;
                        if (e.target === resize) {
                            this.beginStripDrag(e, inst.id, strip.id, 'resize');
                        } else {
                            this.beginStripDrag(e, inst.id, strip.id, 'move');
                        }
                        this.renderInstanceList();
                        this.renderInstanceControls();
                        this.drawSelection();
                    });

                    return el;
                },

                beginStripDrag(e, instanceId, stripId, mode) {
                    e.preventDefault();
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const inst = this.findInstance(instanceId);
                    const strip = inst && inst.strips.find(st => st.id === stripId);
                    if (!strip) return;

                    const pps = this.getPps();
                    const startClientX = e.clientX;
                    const origStart = strip.start;
                    const origLength = strip.length;
                    document.body.style.userSelect = 'none';

                    const snapPx = 8;
                    const snapTol = snapPx / pps;
                    const targets = [0];
                    inst.strips.forEach(other => {
                        if (other.id === stripId) return;
                        targets.push(other.start);
                        targets.push(other.start + other.length);
                    });

                    if (mode === 'resize') {
                        const dur = this.getDuration(inst.skeletonName, strip.animation);
                        if (dur > 0) {
                            for (let k = 1; k <= 64; k++) {
                                targets.push(origStart + k * dur);
                            }
                        }
                    }

                    const onMove = (ev) => {
                        const delta = (ev.clientX - startClientX) / pps;
                        if (mode === 'move') {
                            const raw = Math.max(0, origStart + delta);
                            strip.start = this.snapToFrame(this.snapTime(raw, targets, snapTol));
                        } else {
                            const rawEnd = origStart + Math.max(this.MIN_LEN, origLength + delta);
                            const snappedEnd = this.snapToFrame(this.snapTime(rawEnd, targets, snapTol));
                            strip.length = Math.max(1 / this.FPS, snappedEnd - origStart);
                        }
                        this.renderTimeline();
                    };

                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.body.style.userSelect = '';
                        this.save();
                        this.renderInstanceControls();
                        this.applyAtTime(state.scenes.ptr.time);
                    };

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                    this.renderTimeline();
                },

                snapToFrame(t) {
                    const f = this.FPS || 30;
                    const num = Number(t);
                    if (!isFinite(num)) return 0;
                    return Math.max(0, Math.round(num * f) / f);
                },

                snapTime(value, targets, tolerance) {
                    let best = value;
                    let bestDist = tolerance;
                    for (let i = 0; i < targets.length; i++) {
                        const d = Math.abs(value - targets[i]);
                        if (d <= bestDist) {
                            bestDist = d;
                            best = targets[i];
                        }
                    }
                    return best;
                },

                stripLocalTime(inst, strip, t) {
                    const d = this.getDuration(inst.skeletonName, strip.animation);
                    const local = t - strip.start;
                    if (d <= 0) return 0;
                    if (strip.loop) return ((local % d) + d) % d;
                    return Math.min(Math.max(local, 0), d);
                },

                updatePlayheads() {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const pps = this.getPps();
                    const left = Math.round(state.scenes.ptr.time * pps) + 'px';
                    const els = document.querySelectorAll('#sceneTimelineRows .scene-tl-track, #sceneTimelineRows .scene-tl-ruler');
                    els.forEach(track => {
                        let ph = track.querySelector('.scene-tl-playhead');
                        if (!ph) {
                            ph = document.createElement('div');
                            ph.className = 'scene-tl-playhead';
                            track.appendChild(ph);
                        }
                        ph.style.left = left;
                    });
                },

                updateTimeLabel() {
                    const el = document.getElementById('sceneTimeLabel');
                    if (el) el.textContent = state.scenes.ptr.time.toFixed(2) + 's';
                },

                updatePlayButton() {
                    const btn = document.getElementById('scenePlayBtn');
                    if (!btn) return;
                    if (state.scenes.ptr.playing) {
                        btn.title = 'Pause';
                        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>';
                    } else {
                        btn.title = 'Play';
                        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 21,12 6,21"/></svg>';
                    }
                },

                updateLoopButton() {
                    const btn = document.getElementById('sceneLoopBtn');
                    if (!btn) return;
                    btn.classList.toggle('active', state.scenes.ptr.loop);
                },

                /* ================= playback ================= */

                play() {
                    state.scenes.ptr.playing = true;
                    this.updatePlayButton();
                },

                pause() {
                    state.scenes.ptr.playing = false;
                    this.updatePlayButton();
                },

                togglePlay() {
                    if (state.scenes.ptr.playing) this.pause();
                    else this.play();
                },

                toggleLoop() {
                    state.scenes.ptr.loop = !state.scenes.ptr.loop;
                    this.updateLoopButton();
                },

                stop() {
                    state.scenes.ptr.playing = false;
                    state.scenes.ptr.time = 0;
                    this.updatePlayButton();
                    this.applyAtTime(0);
                    this.updatePlayheads();
                    this.updateTimeLabel();
                },

                setTime(t) {
                    state.scenes.ptr.time = Math.max(0, t);
                    this.applyAtTime(state.scenes.ptr.time);
                    this.updatePlayheads();
                    this.updateTimeLabel();
                },

                tick(delta) {
                    if (state.activeMode !== 'scene' || !state.scenes.currentId) return;
                    const ptr = state.scenes.ptr;
                    if (!ptr.playing) { this.updatePlayheads(); return; }
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const dur = Math.max(this.getSceneDuration(scene), 0.001);
                    ptr.time += delta;
                    if (ptr.time >= dur) {
                        if (ptr.loop) {
                            ptr.time = ptr.time % dur;
                            this.invalidateSceneKeys();
                        } else {
                            ptr.time = dur;
                            ptr.playing = false;
                            this.updatePlayButton();
                        }
                    }
                    this.applyAtTime(ptr.time);
                    this.updatePlayheads();
                    this.updateTimeLabel();
                },

                invalidateSceneKeys() {
                    for (const id of Object.keys(state.scenes.instances)) {
                        const rt = state.scenes.instances[id];
                        if (rt) rt._sceneKey = null;
                    }
                },

                safeSetAnimation(rt, anim) {
                    try {
                        try { rt.skeleton.setToSetupPose(); } catch (e0) {}
                        const tr = rt.state.setAnimation(0, anim, false);
                        if (tr) { tr.timeScale = 0; tr.loop = false; }
                        return tr;
                    } catch (e) {
                        try { rt.state.clearTracks(); } catch (e2) {}
                        try { rt.skeleton.setToSetupPose(); } catch (e3) {}
                        rt._sceneKey = 'setup';
                        rt._sceneAnim = null;
                        return null;
                    }
                },

                poseNow(rt) {
                    try {
                        if (typeof rt._updateAndApplyState === 'function') {
                            rt._updateAndApplyState(0);
                        }
                    } catch (e) {}
                },

                isInstanceVisibleAt(inst, t) {
                    if (!inst || inst.visible === false) return false;
                    return this.isKeyVisibleAt(inst, t);
                },

                isKeyVisibleAt(inst, t) {
                    const keys = inst && inst.visibilityKeys;
                    if (!keys || keys.length === 0) return true;
                    let best = null;
                    for (const k of keys) {
                        if (k.time <= t + 1e-9 && (!best || k.time > best.time)) best = k;
                    }
                    return best ? best.visible !== false : true;
                },

                beginVisibilityKeyDrag(e, inst, key, markerEl, pps) {
                    const startClientX = e.clientX;
                    const origTime = key.time;
                    document.body.style.userSelect = 'none';

                    const onMove = (ev) => {
                        const t = Math.max(0, origTime + (ev.clientX - startClientX) / pps);
                        key.time = t;
                        markerEl.style.left = Math.round(t * pps) + 'px';
                    };

                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.body.style.userSelect = '';
                        key.time = this.snapToFrame(key.time);
                        if (Array.isArray(inst.visibilityKeys)) {
                            const frame = Math.round(key.time * this.FPS);
                            inst.visibilityKeys = inst.visibilityKeys.filter(k =>
                                k.id === key.id || Math.round(k.time * this.FPS) !== frame
                            );
                            inst.visibilityKeys.sort((a, b) => a.time - b.time);
                        }
                        this.save();
                        this.renderTimeline();
                        this.applyAtTime(state.scenes.ptr.time);
                        this.renderInstanceControls();
                    };

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                addVisibilityKeys(targets, visible) {
                    const frame = Math.round(state.scenes.ptr.time * this.FPS);
                    const t = frame / this.FPS;
                    targets.forEach(inst => {
                        if (!Array.isArray(inst.visibilityKeys)) inst.visibilityKeys = [];
                        inst.visibilityKeys = inst.visibilityKeys.filter(k => Math.round(k.time * this.FPS) !== frame);
                        inst.visibilityKeys.push({ id: this.newId('vkey'), time: t, visible: !!visible });
                        inst.visibilityKeys.sort((a, b) => a.time - b.time);
                    });
                    this.save();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                    this.renderInstanceControls();
                },

                clearVisibilityKeys(targets) {
                    targets.forEach(inst => { inst.visibilityKeys = []; });
                    state.scenes.selectedVisibilityKeyId = null;
                    this.save();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                    this.renderInstanceControls();
                },

                deleteSelectedVisibilityKey() {
                    const keyId = state.scenes.selectedVisibilityKeyId;
                    if (!keyId) return;
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    scene.instances.forEach(inst => {
                        if (Array.isArray(inst.visibilityKeys)) {
                            inst.visibilityKeys = inst.visibilityKeys.filter(k => k.id !== keyId);
                        }
                    });
                    state.scenes.selectedVisibilityKeyId = null;
                    this.save();
                    this.renderTimeline();
                    this.applyAtTime(state.scenes.ptr.time);
                    this.renderInstanceControls();
                },

                applyAtTime(t) {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    scene.instances.forEach(inst => {
                        const rt = state.scenes.instances[inst.id];
                        if (!rt) return;
                        rt.visible = inst.visible !== false;
                        rt.alpha = this.isKeyVisibleAt(inst, t) ? 1 : 0;
                        if (!rt.visible) return;

                        if (rt._sceneKey && rt._sceneKey !== 'setup' && !rt.state.getCurrent(0)) {
                            rt._sceneKey = null;
                        }

                        const actives = [];
                        for (let i = 0; i < inst.strips.length; i++) {
                            const st = inst.strips[i];
                            if (t >= st.start && t < st.start + st.length) actives.push(st);
                        }
                        actives.sort((a, b) => a.start - b.start);

                        if (actives.length === 0) {
                            this.applyHoldOrSetup(inst, rt, t);
                            return;
                        }

                        const primary = actives[actives.length - 1];
                        const primaryHas = this.hasAnimation(inst.skeletonName, primary.animation);

                        let under = actives.length >= 2 ? actives[actives.length - 2] : null;
                        if (under && !this.hasAnimation(inst.skeletonName, under.animation)) under = null;

                        if (!under || !primaryHas) {
                            if (!primaryHas) {
                                this.applySetup(rt);
                                return;
                            }
                            const key = 'single:' + primary.id + ':' + primary.animation;
                            let rebuilt = false;
                            if (rt._sceneKey !== key) {
                                if (rt._sceneAnim === primary.animation && rt.state.getCurrent(0)) {
                                    rt._sceneKey = key;
                                } else {
                                    rt.state.clearTracks();
                                    const tr = this.safeSetAnimation(rt, primary.animation);
                                    rt._sceneAnim = tr ? primary.animation : null;
                                    rt._sceneKey = tr ? key : rt._sceneKey;
                                    rebuilt = true;
                                }
                            }
                            const tr = rt.state.getCurrent(0);
                            if (tr) tr.trackTime = this.stripLocalTime(inst, primary, t);
                            if (rebuilt) this.poseNow(rt);
                            return;
                        }

                        const underEnd = under.start + under.length;
                        const primaryEnd = primary.start + primary.length;
                        const overlapLen = Math.min(underEnd, primaryEnd) - primary.start;
                        const underLocal = this.stripLocalTime(inst, under, t);
                        const primaryLocal = this.stripLocalTime(inst, primary, t);
                        let progress = overlapLen > 0 ? (t - primary.start) / overlapLen : 1;
                        if (progress < 0) progress = 0;
                        if (progress > 1) progress = 1;

                        const mixKey = 'mix:' + under.id + ':' + primary.id + ':' + under.animation + ':' + primary.animation;
                        let mixRebuilt = false;
                        if (rt._sceneKey !== mixKey) {
                            let ok = true;
                            rt.state.clearTracks();
                            try {
                                try { rt.skeleton.setToSetupPose(); } catch (e0) {}
                                const eA = rt.state.setAnimation(0, under.animation, false);
                                if (eA) {
                                    eA.timeScale = 0;
                                    eA.loop = false;
                                    eA.nextTrackLast = 0;
                                }
                                const eB = rt.state.setAnimation(0, primary.animation, false);
                                if (eB) {
                                    eB.timeScale = 0;
                                    eB.loop = false;
                                }
                            } catch (e) {
                                ok = false;
                                rt._sceneKey = null;
                            }
                            if (ok) {
                                rt._sceneKey = mixKey;
                                rt._sceneAnim = null;
                                mixRebuilt = true;
                            }
                        }

                        if (rt._sceneKey !== mixKey) {
                            let fallbackRebuilt = false;
                            const fallbackKey = 'single:' + primary.id + ':' + primary.animation;
                            if (rt._sceneKey !== fallbackKey) {
                                rt.state.clearTracks();
                                const tr = this.safeSetAnimation(rt, primary.animation);
                                rt._sceneAnim = tr ? primary.animation : null;
                                rt._sceneKey = fallbackKey;
                                fallbackRebuilt = !!tr;
                            }
                            const tr = rt.state.getCurrent(0);
                            if (tr) tr.trackTime = primaryLocal;
                            if (fallbackRebuilt) this.poseNow(rt);
                            return;
                        }

                        const eB = rt.state.getCurrent(0);
                        if (!eB) { rt._sceneKey = null; return; }
                        eB.trackTime = primaryLocal;
                        if (overlapLen > 0) {
                            eB.mixDuration = overlapLen;
                            eB.mixTime = progress * overlapLen;
                        }
                        const eA = eB.mixingFrom;
                        if (eA) {
                            eA.trackTime = underLocal;
                            eA.timeScale = 0;
                            eA.loop = false;
                        }
                        if (mixRebuilt) this.poseNow(rt);
                    });
                },

                applySetup(rt) {
                    if (rt._sceneKey === 'setup') return;
                    rt.state.clearTracks();
                    rt.skeleton.setToSetupPose();
                    rt._sceneKey = 'setup';
                    rt._sceneAnim = null;
                },

                applyHoldOrSetup(inst, rt, t) {
                    let last = null;
                    for (let i = 0; i < inst.strips.length; i++) {
                        const st = inst.strips[i];
                        if (st.start + st.length <= t) {
                            if (!last || (st.start + st.length) > (last.start + last.length)) last = st;
                        }
                    }
                    if (last && this.hasAnimation(inst.skeletonName, last.animation)) {
                        const key = 'hold:' + last.id + ':' + last.animation;
                        let rebuilt = false;
                        if (rt._sceneKey !== key) {
                            if (rt._sceneAnim === last.animation && rt.state.getCurrent(0)) {
                                rt._sceneKey = key;
                            } else {
                                rt.state.clearTracks();
                                const tr = this.safeSetAnimation(rt, last.animation);
                                rt._sceneAnim = tr ? last.animation : null;
                                rt._sceneKey = tr ? key : rt._sceneKey;
                                rebuilt = true;
                            }
                        }
                        const tr = rt.state.getCurrent(0);
                        if (tr) {
                            const d = this.getDuration(inst.skeletonName, last.animation);
                            const holdTime = d > 0 ? Math.min(last.length, d) : 0;
                            tr.trackTime = holdTime;
                        }
                        if (rebuilt) this.poseNow(rt);
                        return;
                    }
                    this.applySetup(rt);
                },

                /* ================= camera ================= */

                setCameraScale(scale) {
                    const scene = this.getCurrentScene();
                    if (!scene || !state.app) return;
                    scale = Math.max(0.05, Math.min(4, scale));
                    const cam = scene.camera;
                    const screenW = state.app.screen.width;
                    const screenH = state.app.screen.height;
                    const cx = screenW / 2;
                    const cy = screenH / 2;
                    const worldX = (cx - cam.ox) / cam.scale;
                    const worldY = (cy - cam.oy) / cam.scale;
                    cam.scale = scale;
                    cam.ox = cx - worldX * scale;
                    cam.oy = cy - worldY * scale;
                    this.applyAllTransforms();
                    this.drawWorkspace();
                    this.drawMarkers();
                    this.drawSelection();
                    this.save();
                },

                fitCameraToContent() {
                    const scene = this.getCurrentScene();
                    if (!scene || !state.app) return;
                    const cam = scene.camera;
                    if (scene.instances.length === 0) {
                        cam.scale = 1;
                        cam.ox = state.app.screen.width / 2;
                        cam.oy = state.app.screen.height / 2;
                        return;
                    }
                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    scene.instances.forEach(inst => {
                        minX = Math.min(minX, inst.x);
                        maxX = Math.max(maxX, inst.x);
                        minY = Math.min(minY, inst.y);
                        maxY = Math.max(maxY, inst.y);
                    });
                    const p = this.FIT_PADDING;
                    minX -= p; maxX += p; minY -= p; maxY += p;
                    const worldWidth = Math.max(1, maxX - minX);
                    const worldHeight = Math.max(1, maxY - minY);
                    const screenW = state.app.screen.width;
                    const screenH = state.app.screen.height;
                    let scale = Math.min(screenW / worldWidth, screenH / worldHeight);
                    scale = Math.max(0.05, Math.min(2.0, scale));
                    const worldCenterX = (minX + maxX) / 2;
                    const worldCenterY = (minY + maxY) / 2;
                    cam.scale = scale;
                    cam.ox = screenW / 2 - worldCenterX * scale;
                    cam.oy = screenH / 2 - worldCenterY * scale;
                },

                resetCamera() {
                    this.fitCameraToContent();
                    this.applyAllTransforms();
                    this.drawWorkspace();
                    this.drawMarkers();
                    this.drawSelection();
                    this.save();
                    const scene = this.getCurrentScene();
                    if (scene) uiControls.updateScaleSlider(scene.camera.scale);
                },

                updateAllInstancePositions() {
                    this.applyAllTransforms();
                    this.drawMarkers();
                    this.drawSelection();
                },

                /* ================= interaction ================= */

                hitTest(screenX, screenY) {
                    const scene = this.getCurrentScene();
                    if (!scene) return null;
                    const cam = scene.camera;
                    let best = null;
                    let bestDist = Infinity;
                    for (let i = 0; i < scene.instances.length; i++) {
                        const inst = scene.instances[i];
                        if (!inst.visible) continue;
                        const sx = inst.x * cam.scale + cam.ox;
                        const sy = inst.y * cam.scale + cam.oy;
                        const dist = Math.sqrt((screenX - sx) ** 2 + (screenY - sy) ** 2);
                        if (dist < 40 && dist < bestDist) {
                            bestDist = dist;
                            best = inst;
                        }
                    }
                    return best;
                },

                initCanvasInteraction() {
                    const canvas = document.getElementById('canvas');
                    if (!canvas) return;

                    canvas.addEventListener('mousedown', (e) => {
                        if (state.activeMode !== 'scene' || !state.scenes.currentId) return;
                        e.preventDefault();
                        const rect = canvas.getBoundingClientRect();
                        const mx = e.clientX - rect.left;
                        const my = e.clientY - rect.top;

                        if (e.button === 2) {
                            const scene = this.getCurrentScene();
                            if (!scene) return;
                            state.scenes.panning = {
                                startX: e.clientX,
                                startY: e.clientY,
                                ox: scene.camera.ox,
                                oy: scene.camera.oy
                            };
                            return;
                        }

                        const hit = this.hitTest(mx, my);
                        if (hit) {
                            if (!this.isSelected(hit.id)) {
                                state.scenes.selectedIds = [hit.id];
                                state.scenes.selectedInstanceId = hit.id;
                                state.scenes.selectedStripId = null;
                                this.renderInstanceList();
                                this.renderInstanceControls();
                                this.renderTimeline();
                                this.drawSelection();
                            }
                            const items = state.scenes.selectedIds.map(id => {
                                const it = this.findInstance(id);
                                return it ? { id: id, origX: it.x, origY: it.y } : null;
                            }).filter(Boolean);
                            state.scenes.dragging = {
                                startX: e.clientX,
                                startY: e.clientY,
                                items: items
                            };
                        } else {
                            state.scenes.selection.isSelecting = true;
                            state.scenes.selection.startX = mx;
                            state.scenes.selection.startY = my;
                            state.scenes.selectedIds = [];
                            state.scenes.selectedInstanceId = null;
                            state.scenes.selectedStripId = null;
                            this.drawMarqueeRect(mx, my, mx, my);
                            this.renderInstanceList();
                            this.renderInstanceControls();
                            this.renderTimeline();
                            this.drawSelection();
                        }
                    });

                    document.addEventListener('mousemove', (e) => {
                        if (state.activeMode !== 'scene') return;
                        const scene = this.getCurrentScene();
                        if (!scene) return;

                        const canvasEl = document.getElementById('canvas');
                        const rect = canvasEl.getBoundingClientRect();
                        const mx = e.clientX - rect.left;
                        const my = e.clientY - rect.top;

                        if (state.scenes.dragging) {
                            const dx = (e.clientX - state.scenes.dragging.startX) / scene.camera.scale;
                            const dy = (e.clientY - state.scenes.dragging.startY) / scene.camera.scale;
                            state.scenes.dragging.items.forEach(item => {
                                const inst = this.findInstance(item.id);
                                if (!inst) return;
                                const grid = state.scenes.grid;
                                const skip = !!(grid && grid.fromReelsBox && inst.skeletonName === 'reels-box');
                                const snapped = this.snapToSceneGrid(item.origX + dx, item.origY + dy, scene, skip);
                                inst.x = snapped.x;
                                inst.y = snapped.y;
                                this.applyInstanceTransform(inst);
                            });
                            if (state.scenes.selectedInstanceId) {
                                const inst = this.findInstance(state.scenes.selectedInstanceId);
                                if (inst) {
                                    if (inst._uiX) inst._uiX.value = String(Math.round(inst.x));
                                    if (inst._uiY) inst._uiY.value = String(Math.round(inst.y));
                                }
                            }
                        } else if (state.scenes.selection.isSelecting) {
                            this.drawMarqueeRect(state.scenes.selection.startX, state.scenes.selection.startY, mx, my);
                            this.updateSelectionFromRect(state.scenes.selection.startX, state.scenes.selection.startY, mx, my);
                        } else if (state.scenes.panning) {
                            scene.camera.ox = state.scenes.panning.ox + (e.clientX - state.scenes.panning.startX);
                            scene.camera.oy = state.scenes.panning.oy + (e.clientY - state.scenes.panning.startY);
                            this.applyAllTransforms();
                            this.drawWorkspace();
                            this.drawMarkers();
                            this.drawSelection();
                        } else {
                            const hit = this.hitTest(mx, my);
                            const hoveredId = hit ? hit.id : null;
                            if (hoveredId !== state.scenes.hoveredInstanceId) {
                                state.scenes.hoveredInstanceId = hoveredId;
                                this.drawSelection();
                            }
                        }
                    });

                    document.addEventListener('mouseup', () => {
                        if (state.scenes.selection.isSelecting) {
                            state.scenes.selection.isSelecting = false;
                            this.clearMarquee();
                        }
                        if (state.scenes.dragging) {
                            state.scenes.dragging = null;
                            this.save();
                            this.drawWorkspace();
                        }
                        if (state.scenes.panning) {
                            state.scenes.panning = null;
                            this.save();
                        }
                    });

                    canvas.addEventListener('wheel', (e) => {
                        if (state.activeMode !== 'scene' || !state.scenes.currentId) return;
                        e.preventDefault();
                        const scene = this.getCurrentScene();
                        if (!scene) return;
                        const factor = e.deltaY > 0 ? 0.9 : 1.1;
                        const newScale = Math.max(0.05, Math.min(4, scene.camera.scale * factor));
                        const rect = canvas.getBoundingClientRect();
                        const mx = e.clientX - rect.left;
                        const my = e.clientY - rect.top;
                        const worldX = (mx - scene.camera.ox) / scene.camera.scale;
                        const worldY = (my - scene.camera.oy) / scene.camera.scale;
                        scene.camera.scale = newScale;
                        scene.camera.ox = mx - worldX * newScale;
                        scene.camera.oy = my - worldY * newScale;
                        this.applyAllTransforms();
                        this.drawWorkspace();
                        this.drawMarkers();
                        this.drawSelection();
                        uiControls.updateScaleSlider(newScale);
                    }, { passive: false });
                },

                initPaletteDrop() {
                    const container = document.querySelector('.canvas-container');
                    if (!container) return;
                    container.addEventListener('dragover', (e) => {
                        if (state.activeMode !== 'scene' || !state.scenes.currentId) return;
                        if (e.dataTransfer.types && e.dataTransfer.types.includes('application/x-spine-name')) {
                            e.preventDefault();
                            e.dataTransfer.dropEffect = 'copy';
                        }
                    });
                    container.addEventListener('drop', (e) => {
                        if (state.activeMode !== 'scene' || !state.scenes.currentId) return;
                        const name = e.dataTransfer.getData('application/x-spine-name') || e.dataTransfer.getData('text/plain');
                        if (!name || !state.loadedSkeletons.has(name)) return;
                        e.preventDefault();
                        e.stopPropagation();
                        this.addInstanceAt(name, e.clientX, e.clientY);
                    });
                },

                handleSceneFileDrop(e) {
                    if (state.activeMode !== 'scene' || state.scenes.currentId) return false;
                    const files = Array.from(e.dataTransfer.files || []);
                    if (files.length === 0) return false;
                    const jsonFile = files.find(f => /\.json$/i.test(f.name)) || (files.length === 1 ? files[0] : null);
                    if (!jsonFile) return false;
                    e.preventDefault();
                    e.stopPropagation();
                    const dropZone = document.getElementById('dropZone');
                    if (dropZone) dropZone.classList.remove('active');
                    const reader = new FileReader();
                    reader.onload = () => this.importSceneText(String(reader.result || ''));
                    reader.onerror = () => showError('Scene import: failed to read file');
                    reader.readAsText(jsonFile);
                    return true;
                },

                /* ================= import / export ================= */

                exportScene() {
                    const ids = this.getSelectedSceneIds();
                    if (ids.length === 0) return;
                    let payload;
                    if (ids.length === 1) {
                        const scene = state.scenes.list.find(s => s.id === ids[0]);
                        if (!scene) return;
                        payload = { type: 'spineScene', version: 1, scene: scene };
                    } else {
                        const scenes = state.scenes.list.filter(s => ids.indexOf(s.id) >= 0);
                        payload = { type: 'spineSceneCollection', version: 1, scenes: scenes };
                    }
                    const text = JSON.stringify(payload, null, 0);
                    this.copyToClipboard(text).then(ok => {
                        if (ok) this.flashCopySuccess(document.getElementById('sceneExportBtn'));
                    });
                },

                exportCurrentSceneToFile() {
                    const scene = this.getCurrentScene();
                    if (!scene) return;
                    const text = JSON.stringify({ type: 'spineScene', version: 1, scene: scene }, null, 2);
                    this.downloadJson(this.safeFileName(scene.name) + '.scene.json', text);
                },

                exportSceneToFile() {
                    const ids = this.getSelectedSceneIds();
                    if (ids.length === 0) return;
                    let payload;
                    let filename;
                    if (ids.length === 1) {
                        const scene = state.scenes.list.find(s => s.id === ids[0]);
                        if (!scene) return;
                        payload = { type: 'spineScene', version: 1, scene: scene };
                        filename = this.safeFileName(scene.name) + '.scene.json';
                    } else {
                        const scenes = state.scenes.list.filter(s => ids.indexOf(s.id) >= 0);
                        payload = { type: 'spineSceneCollection', version: 1, scenes: scenes };
                        filename = 'scenes.json';
                    }
                    const text = JSON.stringify(payload, null, 2);
                    this.downloadJson(filename, text);
                },

                exportAllScenes() {
                    const text = JSON.stringify({ type: 'spineSceneCollection', version: 1, scenes: state.scenes.list }, null, 0);
                    this.copyToClipboard(text).then(ok => {
                        if (ok) this.flashCopySuccess(document.getElementById('sceneExportAllBtn'));
                    });
                },

                exportAllScenesToFile() {
                    const text = JSON.stringify({ type: 'spineSceneCollection', version: 1, scenes: state.scenes.list }, null, 2);
                    this.downloadJson('scenes.json', text);
                },

                safeFileName(name) {
                    return (name || 'scene').replace(/[^\w\-. ]+/g, '_').trim() || 'scene';
                },

                downloadJson(filename, text) {
                    try {
                        const blob = new Blob([text], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    } catch (e) {
                        showError('Scene export: failed to save file');
                    }
                },

                copyToClipboard(text) {
                    const fallback = (str) => {
                        const ta = document.createElement('textarea');
                        ta.value = str;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        let ok = false;
                        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                        document.body.removeChild(ta);
                        return ok;
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        return navigator.clipboard.writeText(text).then(() => true).catch(() => fallback(text));
                    }
                    return Promise.resolve(fallback(text));
                },

                flashCopySuccess(btn) {
                    if (!btn) return;
                    btn.classList.remove('copy-flash');
                    void btn.offsetWidth;
                    btn.classList.add('copy-flash');
                    setTimeout(() => btn.classList.remove('copy-flash'), 800);
                },

                async importScene() {
                    let text = '';
                    try {
                        if (navigator.clipboard && navigator.clipboard.readText) {
                            text = await navigator.clipboard.readText();
                        }
                    } catch (e) {
                        text = '';
                    }
                    if (!text || !text.trim()) {
                        try { text = window.prompt('Paste scene JSON:') || ''; } catch (e) { text = ''; }
                    }
                    this.importSceneText(text);
                },

                importSceneFromFile() {
                    try {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = '.json,application/json';
                        input.addEventListener('change', () => {
                            const file = input.files && input.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = () => this.importSceneText(String(reader.result || ''));
                            reader.onerror = () => showError('Scene import: failed to read file');
                            reader.readAsText(file);
                        });
                        input.click();
                    } catch (e) {
                        showError('Scene import: failed to open file');
                    }
                },

                importSceneText(text) {
                    if (!text) return;
                    text = String(text).trim();
                    if (!text) return;

                    let parsed = null;
                    try {
                        parsed = JSON.parse(text);
                    } catch (e) {
                        showError('Scene import: invalid JSON');
                        return;
                    }

                    let scenesData = [];
                    if (Array.isArray(parsed)) scenesData = parsed;
                    else if (parsed && Array.isArray(parsed.scenes)) scenesData = parsed.scenes;
                    else if (parsed && parsed.scene) scenesData = [parsed.scene];
                    else if (parsed && typeof parsed === 'object') scenesData = [parsed];

                    let imported = 0;
                    const used = new Set(state.scenes.list.map(s => s.name));
                    scenesData.forEach(sd => {
                        const scene = this.normalizeScene(sd);
                        if (!scene) return;
                        scene.id = this.newId('scene');
                        if (used.has(scene.name)) {
                            let base = scene.name, n = 2;
                            while (used.has(base + ' ' + n)) n++;
                            scene.name = base + ' ' + n;
                        }
                        used.add(scene.name);
                        state.scenes.list.push(scene);
                        imported++;
                    });
                    if (imported > 0) this.dedupeIds();

                    if (imported === 0) {
                        showError('Scene import: unrecognized scene format');
                        return;
                    }
                    this.save();
                    this.renderSceneList();
                }
            };

            const skinManager = {
                readSkins(skeletonName) {
                    const sk = state.skeletons[skeletonName];
                    if (!sk || !sk.skeleton || !sk.skeleton.data) return [];
                    const skins = sk.skeleton.data.skins;
                    if (!skins) return [];
                    return skins.map(s => s.name);
                },

                updateDropdown(skeletonName) {
                    const section = document.getElementById('skinSection');
                    const select = document.getElementById('skinSelect');
                    if (!section || !select) return;

                    const skins = state.availableSkins[skeletonName] || [];
                    const nonDefaultSkins = skins.filter(s => s !== 'default');

                    if (nonDefaultSkins.length === 0) {
                        section.classList.remove('visible');
                        return;
                    }

                    select.innerHTML = '';
                    skins.forEach(skinName => {
                        const opt = document.createElement('option');
                        opt.value = skinName;
                        opt.textContent = skinName;
                        select.appendChild(opt);
                    });

                    const saved = state.selectedSkins[skeletonName] || 'default';
                    select.value = saved;
                    section.classList.add('visible');
                },

                applySkin(skeletonName, skinName) {
                    const sk = state.skeletons[skeletonName];
                    if (!sk || !sk.skeleton) return;
                    sk.skeleton.setSkinByName(skinName);
                    sk.skeleton.setSlotsToSetupPose();
                    state.selectedSkins[skeletonName] = skinName;
                },

                restoreSkin(skeletonName) {
                    const skinName = state.selectedSkins[skeletonName];
                    if (!skinName || skinName === 'default') return;
                    const skins = state.availableSkins[skeletonName] || [];
                    if (skins.includes(skinName)) {
                        this.applySkin(skeletonName, skinName);
                    }
                },

                init() {
                    const select = document.getElementById('skinSelect');
                    if (!select) return;
                    select.addEventListener('change', (e) => {
                        if (state.currentSkeletonName) {
                            this.applySkin(state.currentSkeletonName, e.target.value);
                        }
                    });
                }
            };

            const graphicsManager = {
                GRID_FINE: 100,
                GRID_COARSE: 500,
                GRID_FINE_ALPHA: 0.02,
                GRID_COARSE_ALPHA: 0.05,
                AXES_WIDTH: 2,
                AXES_ALPHA: 0.1,

                getLineColor() {
                    return state.themeFg === 0 ? 0x000001 : 0xfffffe;
                },

                drawGridLayer(graphics, lineColor, alpha, gridSize, scale, offsetX, offsetY, screenW, screenH) {
                    graphics.setStrokeStyle({ width: 1, color: lineColor, alpha: alpha });

                    const startX = -offsetX / scale;
                    const endX = (screenW - offsetX) / scale;
                    const startY = -offsetY / scale;
                    const endY = (screenH - offsetY) / scale;

                    const firstGridX = Math.floor(startX / gridSize) * gridSize;
                    const firstGridY = Math.floor(startY / gridSize) * gridSize;

                    for (let x = firstGridX; x <= endX; x += gridSize) {
                        const screenX = x * scale + offsetX;
                        graphics.moveTo(screenX, 0);
                        graphics.lineTo(screenX, screenH);
                    }

                    for (let y = firstGridY; y <= endY; y += gridSize) {
                        const screenY = y * scale + offsetY;
                        graphics.moveTo(0, screenY);
                        graphics.lineTo(screenW, screenY);
                    }

                    graphics.stroke();
                },

                drawAxesAndGrid(graphics, scale, offsetX, offsetY, skipGrid) {
                    if (!graphics || !state.app) return;
                    graphics.clear();

                    const lineColor = this.getLineColor();
                    const screenW = state.app.screen.width;
                    const screenH = state.app.screen.height;

                    if (!skipGrid) {
                        this.drawGridLayer(graphics, lineColor, this.GRID_FINE_ALPHA, this.GRID_FINE, scale, offsetX, offsetY, screenW, screenH);
                        this.drawGridLayer(graphics, lineColor, this.GRID_COARSE_ALPHA, this.GRID_COARSE, scale, offsetX, offsetY, screenW, screenH);
                    }

                    graphics.setStrokeStyle({ width: this.AXES_WIDTH, color: lineColor, alpha: this.AXES_ALPHA });

                    if (offsetX >= 0 && offsetX <= screenW) {
                        graphics.moveTo(offsetX, 0);
                        graphics.lineTo(offsetX, screenH);
                    }
                    if (offsetY >= 0 && offsetY <= screenH) {
                        graphics.moveTo(0, offsetY);
                        graphics.lineTo(screenW, offsetY);
                    }

                    graphics.stroke();
                },

                drawAxes() {
                    if (!state.axesGraphics) {
                        state.axesGraphics = new PIXI.Graphics();
                    }
                    if (state.axesGraphics.parent !== state.app.stage) {
                        state.app.stage.addChildAt(state.axesGraphics, 0);
                    }
                    this.drawAxesAndGrid(state.axesGraphics, state.currentScale, state.cameraX, state.cameraY);
                    frameManager.draw();
                }
            };

            const frameManager = {
                init() {
                    const checkbox = document.getElementById('frameCheckbox');
                    const fields = document.getElementById('frameFields');
                    if (!checkbox || !fields) return;

                    checkbox.checked = state.frame.enabled;
                    fields.classList.toggle('visible', state.frame.enabled);

                    checkbox.addEventListener('change', () => {
                        state.frame.enabled = checkbox.checked;
                        fields.classList.toggle('visible', checkbox.checked);
                        this.syncInputs();
                        this.draw();
                    });

                    ['frameW', 'frameH', 'frameX', 'frameY'].forEach(id => {
                        const input = document.getElementById(id);
                        if (!input) return;
                        input.addEventListener('change', () => this.apply());
                        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
                    });

                    document.querySelectorAll('.frame-label').forEach(label => {
                        label.addEventListener('mousedown', (e) => this.startScrub(e, label));
                    });

                    document.querySelectorAll('.frame-preset-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const wInput = document.getElementById('frameW');
                            const hInput = document.getElementById('frameH');
                            if (!wInput || !hInput) return;
                            wInput.value = btn.dataset.w;
                            hInput.value = btn.dataset.h;
                            this.apply();
                        });
                    });
                },

                startScrub(e, label) {
                    e.preventDefault();
                    const axis = label.dataset.axis;
                    const input = document.getElementById('frame' + axis.toUpperCase());
                    if (!input) return;
                    const startVal = parseFloat(input.value);
                    const base = isNaN(startVal) ? 0 : startVal;
                    document.body.style.userSelect = 'none';

                    let locked = false;
                    let lastClientX = e.clientX;
                    let cumulative = 0;

                    const onMove = (ev) => {
                        if (locked) {
                            cumulative += ev.movementX || 0;
                        } else {
                            cumulative += ev.clientX - lastClientX;
                            lastClientX = ev.clientX;
                        }
                        input.value = String(Math.round(base + cumulative));
                        this.apply();
                    };

                    const onLockChange = () => {
                        locked = !!document.pointerLockElement;
                    };

                    const cleanup = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', cleanup);
                        document.removeEventListener('pointerlockchange', onLockChange);
                        document.body.style.userSelect = '';
                        if (document.pointerLockElement) {
                            document.exitPointerLock();
                        }
                    };

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', cleanup);
                    document.addEventListener('pointerlockchange', onLockChange);

                    if (label.requestPointerLock) {
                        try { label.requestPointerLock(); } catch (err) {}
                    }
                },

                syncInputs() {
                    const w = document.getElementById('frameW');
                    const h = document.getElementById('frameH');
                    const x = document.getElementById('frameX');
                    const y = document.getElementById('frameY');
                    if (w) w.value = String(state.frame.w);
                    if (h) h.value = String(state.frame.h);
                    if (x) x.value = String(state.frame.x);
                    if (y) y.value = String(state.frame.y);
                },

                apply() {
                    const num = (id) => {
                        const v = parseFloat(document.getElementById(id).value);
                        return isNaN(v) ? 0 : v;
                    };
                    state.frame.w = num('frameW');
                    state.frame.h = num('frameH');
                    state.frame.x = num('frameX');
                    state.frame.y = num('frameY');
                    this.draw();
                },

                getTransform() {
                    if (state.activeMode === 'museum') {
                        return {
                            scale: state.museum.cameraScale,
                            ox: state.museum.cameraOffsetX,
                            oy: state.museum.cameraOffsetY
                        };
                    }
                    if (state.activeMode === 'scene') {
                        const scene = sceneManager.getCurrentScene();
                        const cam = scene ? scene.camera : { scale: 1, ox: 0, oy: 0 };
                        return {
                            scale: cam.scale,
                            ox: cam.ox,
                            oy: cam.oy
                        };
                    }
                    return {
                        scale: state.currentScale,
                        ox: state.cameraX,
                        oy: state.cameraY
                    };
                },

                draw() {
                    if (!state.app) return;
                    if (!state.frame.graphics) {
                        state.frame.graphics = new PIXI.Graphics();
                    }
                    const g = state.frame.graphics;
                    g.clear();
                    if (!state.frame.enabled) return;

                    const { scale, ox, oy } = this.getTransform();
                    const f = state.frame;
                    const cx = f.x * scale + ox;
                    const cy = f.y * scale + oy;
                    const sw = Math.abs(f.w) * scale;
                    const sh = Math.abs(f.h) * scale;
                    g.rect(cx - sw / 2, cy - sh / 2, sw, sh);
                    g.stroke({ width: 1, color: 0xffffff, alpha: 1 });

                    if (g.parent !== state.app.stage) {
                        state.app.stage.addChild(g);
                    } else {
                        state.app.stage.addChild(g);
                    }
                }
            };

            const themeManager = {
                STORAGE_KEY: 'spineViewerThemeLuminance',
                DEFAULT_L: 30,

                getStoredL() {
                    let raw = null;
                    try { raw = localStorage.getItem(this.STORAGE_KEY); } catch (e) {}
                    if (raw === null || raw === undefined) return this.DEFAULT_L;
                    const v = parseInt(raw, 10);
                    if (isNaN(v)) return this.DEFAULT_L;
                    return Math.max(0, Math.min(255, v));
                },

                apply(L) {
                    L = Math.max(0, Math.min(255, Math.round(L)));
                    const fg = L < 128 ? 255 : 0;
                    const rs = document.documentElement.style;
                    rs.setProperty('--bg-rgb', L + ',' + L + ',' + L);
                    rs.setProperty('--fg-rgb', fg + ',' + fg + ',' + fg);
                    applyErrorColors(rs, L);
                    state.themeL = L;
                    state.themeFg = fg;
                    if (state.app && state.app.renderer && state.app.renderer.background && state.app.renderer.background.color) {
                        const hex = (L << 16) | (L << 8) | L;
                        try { state.app.renderer.background.color.setValue(hex); } catch (e) {}
                    }
                    if (state.activeMode === 'museum') {
                        museumManager.drawWorkspace();
                    } else if (state.activeMode === 'scene') {
                        sceneManager.drawWorkspace();
                    } else if (state.axesGraphics) {
                        graphicsManager.drawAxes();
                    }
                },

                init() {
                    const slider = document.getElementById('themeSlider');
                    const L = this.getStoredL();
                    if (slider) {
                        slider.value = L;
                        slider.addEventListener('input', (e) => {
                            const v = parseInt(e.target.value, 10);
                            this.apply(v);
                            try { localStorage.setItem(this.STORAGE_KEY, String(v)); } catch (err) {}
                        });
                    }
                    this.apply(L);
                }
            };

            function slotCollectRenderables(instructionSet, renderer) {
                if (!state.showPlaceholders) return;
                if (!this || this.destroyed) return;
                if (!this.renderPipeId || !renderer || !renderer.renderPipes) return;
                const { renderPipes, renderableGC } = renderer;
                const pipe = renderPipes[this.renderPipeId];
                if (!pipe) return;
                try {
                    renderPipes.blendMode.setBlendMode(this, this.groupBlendMode, instructionSet);
                    this.didViewUpdate = false;
                    pipe.addRenderable(this, instructionSet);
                    renderableGC.addRenderable(this, instructionSet);
                } catch (e) {}
            }

            const placeholderManager = {
                PREFIX: 'placeholder',
                FONT_SIZE: 60,
                SCALE: 1,
                entries: {},

                getFontSize() {
                    return this.FONT_SIZE * this.SCALE;
                },

                setScale(scale) {
                    this.SCALE = scale;
                    const fontSize = this.getFontSize();
                    Object.keys(this.entries).forEach(skeletonName => {
                        const entry = this.entries[skeletonName];
                        for (let i = 0; i < entry.items.length; i++) {
                            const it = entry.items[i];
                            if (it.text && !it.text.destroyed && it.text.style) {
                                it.text.style.fontSize = fontSize;
                            }
                        }
                    });
                },
