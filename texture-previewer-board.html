                    var selected = state.selected.has(items[i].getAttribute('data-uid'));
                    items[i].classList.toggle('selected', selected);
                    items[i].setAttribute('aria-selected', selected ? 'true' : 'false');
                }
            }

            function scrollPrimaryIntoView() {
                if (!state.primary) return;
                var items = ui.textureList.querySelectorAll('.texture-item');
                for (var i = 0; i < items.length; i++) {
                    if (items[i].getAttribute('data-uid') === state.primary) {
                        items[i].scrollIntoView({ block: 'nearest' });
                        return;
                    }
                }
            }

            function selectSingleTexture(uid, scroll) {
                var texture = findTexture(uid);
                if (!texture) return;
                state.selected = new Set([uid]);
                state.primary = uid;
                updateSelectionVisuals({ card: true });
                if (scroll) scrollPrimaryIntoView();
            }

            function updateSelectionVisuals(options) {
                options = options || {};
                ensureSelectionValid();
                updateListSelection();
                updateSelectedInfo();
                updateInfoOverlay();
                updateEmptyState();
                if (state.mode === 'list' && options.card !== false) {
                    renderListCard();
                }
                drawScene();
            }

            function updateSelectedInfo() {
                var texture = findTexture(state.primary);
                var selectionCount = state.selected.size;
                var panelVisible = !!(state.activeGroup && texture && selectionCount > 0);
                ui.selectionPanel.classList.toggle('hidden', !panelVisible);

                if (!panelVisible) {
                    ui.selectedName.value = '';
                    ui.selectedDims.textContent = '\u2014';
                    ui.selectedGroup.textContent = state.activeGroup ? state.activeGroup.label : '\u2014';
                    ui.selectedPath.textContent = '';
                    ui.selectedPath.title = '';
                    ui.selectedX.value = '';
                    ui.selectedY.value = '';
                    return;
                }

                var name = texture.name + (selectionCount > 1 ? ' +' + (selectionCount - 1) : '');
                ui.selectedName.value = name;
                ui.selectedName.title = name;
                ui.selectedDims.textContent = texture.width + ' \u00d7 ' + texture.height + ' px';
                ui.selectedGroup.textContent = state.activeGroup.label;
                ui.selectedPath.textContent = texture.path;
                ui.selectedPath.title = texture.path;

                if (state.mode === 'map') {
                    var sameX = true;
                    var sameY = true;
                    var x = null;
                    var y = null;

                    state.selected.forEach(function (uid) {
                        var item = findTexture(uid);
                        var position = state.map.positions.get(uid);
                        if (!item || !position) return;
                        if (x === null) {
                            x = Math.round(position.x);
                            y = Math.round(position.y);
                        } else {
                            if (Math.round(position.x) !== x) sameX = false;
                            if (Math.round(position.y) !== y) sameY = false;
                        }
                    });

                    ui.selectedX.value = sameX && x !== null ? String(x) : '';
                    ui.selectedY.value = sameY && y !== null ? String(y) : '';
                } else {
                    ui.selectedX.value = '';
                    ui.selectedY.value = '';
                }
            }

            function updateInfoOverlay() {
                if (!state.activeGroup) {
                    ui.infoOverlay.classList.remove('visible');
                    return;
                }

                ui.infoOverlay.classList.add('visible');
                var texture = findTexture(state.primary);

                if (texture) {
                    ui.infoTitle.textContent = texture.name;
                    var extra = state.selected.size > 1 ? ' \u00b7 ' + state.selected.size + ' selected' : '';
                    ui.infoSub.textContent = texture.width + ' \u00d7 ' + texture.height + ' px \u00b7 ' + state.activeGroup.label + extra;
                } else {
                    ui.infoTitle.textContent = state.mode === 'map' ? 'Map' : 'List';
                    ui.infoSub.textContent = state.activeGroup.label + ' \u00b7 ' + state.listed.length + ' texture' + (state.listed.length === 1 ? '' : 's');
                }
            }

            function applyCoordinateInput(axis, rawValue) {
                var value = Number(String(rawValue).trim());
                if (!isFinite(value)) {
                    updateSelectedInfo();
                    return;
                }

                state.selected.forEach(function (uid) {
                    var position = state.map.positions.get(uid);
                    if (!position) return;
                    if (axis === 'x') position.x = value;
                    else position.y = value;

                    var card = ui.mapLayer.querySelector('[data-uid="' + cssEscape(uid) + '"]');
                    if (card) {
                        card.style.transform = 'translate(' + position.x + 'px, ' + position.y + 'px)';
                    }
                });

                state.map.autoFit = false;
                updateSelectedInfo();
                drawScene();
            }

            function cssEscape(value) {
                if (window.CSS && CSS.escape) return CSS.escape(value);
                return String(value).replace(/["\\]/g, '\\$&');
            }

            function setHovered(uid) {
                if (state.map.hovered === uid) {
                    if (!uid) hideHoverTip();
                    return;
                }
                state.map.hovered = uid;

                if (!uid) {
                    hideHoverTip();
                } else {
                    var texture = findTexture(uid);
                    if (texture) {
                        ui.hoverTip.textContent = texture.name + '\n' + texture.width + ' \u00d7 ' + texture.height + ' px \u00b7 ' + state.activeGroup.label;
                    }
                }
                drawOverlay();
            }

            function positionHoverTip(clientX, clientY) {
                if (!state.map.hovered) return;
                var rect = ui.viewport.getBoundingClientRect();
                var localX = clientX - rect.left;
                var localY = clientY - rect.top;
                ui.hoverTip.style.display = 'block';
                var tipWidth = ui.hoverTip.offsetWidth;
                var tipHeight = ui.hoverTip.offsetHeight;
                var left = localX + 14;
                var top = localY + 16;

                if (left + tipWidth > rect.width - 8) left = localX - tipWidth - 14;
                if (top + tipHeight > rect.height - 8) top = localY - tipHeight - 12;

                ui.hoverTip.style.left = Math.max(8, left) + 'px';
                ui.hoverTip.style.top = Math.max(8, top) + 'px';
            }

            function hideHoverTip() {
                ui.hoverTip.style.display = 'none';
            }

            function onViewportPointerDown(event) {
                if (state.loading || !state.activeGroup) return;
                if (state.interaction) return;
                if (event.target.closest('button, input, select, textarea, a')) return;
                if (event.button !== 0 && event.button !== 1 && event.button !== 2) return;

                if (event.button === 0) {
                    if (state.mode === 'list') {
                        event.preventDefault();
                        startPan(event);
                        return;
                    }

                    var card = event.target.closest('.tex-card');
                    if (card && ui.mapLayer.contains(card)) {
                        event.preventDefault();
                        startTextureDrag(event, card.getAttribute('data-uid'));
                    } else {
                        event.preventDefault();
                        startMarquee(event);
                    }
                    return;
                }

                event.preventDefault();
                startPan(event);
            }

            function capturePointer(pointerId) {
                try {
                    ui.viewport.setPointerCapture(pointerId);
                } catch (e) {}
            }

            function releasePointer(pointerId) {
                try {
                    if (ui.viewport.hasPointerCapture(pointerId)) {
                        ui.viewport.releasePointerCapture(pointerId);
                    }
                } catch (e) {}
            }

            function startPan(event) {
                var cam = getActiveCamera();
                state.interaction = {
                    type: 'pan',
                    pointerId: event.pointerId,
                    startClientX: event.clientX,
                    startClientY: event.clientY,
                    startCamX: cam.x,
                    startCamY: cam.y
                };
                ui.viewport.classList.add('panning');
                hideHoverTip();
                setHovered(null);
                capturePointer(event.pointerId);
            }

            function startTextureDrag(event, uid) {
                var additive = event.shiftKey || event.ctrlKey || event.metaKey;

                if (additive) {
                    if (state.selected.has(uid)) {
                        state.selected.delete(uid);
                        if (state.primary === uid) {
                            state.primary = state.selected.size ? state.selected.values().next().value : null;
                        }
                        updateSelectionVisuals({ card: false });
                        return;
                    }
                    state.selected.add(uid);
                    state.primary = uid;
                } else {
                    if (!state.selected.has(uid)) {
                        state.selected = new Set([uid]);
                    }
                    state.primary = uid;
                }

                ensureSelectionValid();
                updateSelectionVisuals({ card: false });

                var positions = new Map();
                state.selected.forEach(function (selectedUid) {
                    var position = state.map.positions.get(selectedUid);
                    if (position) positions.set(selectedUid, { x: position.x, y: position.y });
                });

                state.interaction = {
                    type: 'drag',
                    pointerId: event.pointerId,
                    startClientX: event.clientX,
                    startClientY: event.clientY,
                    positions: positions,
                    moved: false
                };

                ui.viewport.classList.add('panning');
                hideHoverTip();
                setHovered(null);
                capturePointer(event.pointerId);
            }

            function startMarquee(event) {
                var additive = event.shiftKey || event.ctrlKey || event.metaKey;
                var rect = ui.viewport.getBoundingClientRect();
                var startX = event.clientX - rect.left;
                var startY = event.clientY - rect.top;

                if (!additive) {
                    state.selected.clear();
                    state.primary = null;
                }

                state.interaction = {
                    type: 'marquee',
                    pointerId: event.pointerId,
                    startX: startX,
                    startY: startY,
                    currentX: startX,
                    currentY: startY,
                    baseSelection: additive ? new Set(state.selected) : new Set(),
                    moved: false
                };

                ui.viewport.classList.add('selecting');
                hideHoverTip();
                setHovered(null);
                updateSelectionVisuals({ card: false });
                capturePointer(event.pointerId);
            }

            function onWindowPointerMove(event) {
                var interaction = state.interaction;
                if (!interaction || event.pointerId !== interaction.pointerId) return;

                if (interaction.type === 'pan') {
                    var cam = getActiveCamera();
                    cam.x = interaction.startCamX + (event.clientX - interaction.startClientX);
                    cam.y = interaction.startCamY + (event.clientY - interaction.startClientY);
                    if (state.mode === 'map') state.map.autoFit = false;
                    cameraChanged();
                    return;
                }

                if (interaction.type === 'drag') {
                    var activeCam = getActiveCamera();
                    var dx = (event.clientX - interaction.startClientX) / activeCam.scale;
                    var dy = (event.clientY - interaction.startClientY) / activeCam.scale;

                    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
                        state.map.autoFit = false;
                    }
                    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) interaction.moved = true;

                    if (state.snap) {
                        dx = Math.round(dx / SNAP_STEP) * SNAP_STEP;
                        dy = Math.round(dy / SNAP_STEP) * SNAP_STEP;
                    }

                    interaction.positions.forEach(function (startPosition, uid) {
                        var position = state.map.positions.get(uid);
                        if (!position) return;
                        position.x = startPosition.x + dx;
                        position.y = startPosition.y + dy;

                        var card = ui.mapLayer.querySelector('[data-uid="' + cssEscape(uid) + '"]');
                        if (card) {
                            card.style.transform = 'translate(' + position.x + 'px, ' + position.y + 'px)';
                        }
                    });

                    drawScene();
                    return;
                }

                if (interaction.type === 'marquee') {
                    var rect = ui.viewport.getBoundingClientRect();
                    interaction.currentX = event.clientX - rect.left;
                    interaction.currentY = event.clientY - rect.top;
                    var dragDistance = Math.abs(interaction.currentX - interaction.startX) + Math.abs(interaction.currentY - interaction.startY);
                    if (dragDistance > 3) interaction.moved = true;
                    updateMarqueeSelection();
                    drawScene();
                }
            }

            function updateMarqueeSelection() {
                var interaction = state.interaction;
                if (!interaction || interaction.type !== 'marquee') return;

                var minX = Math.min(interaction.startX, interaction.currentX);
                var maxX = Math.max(interaction.startX, interaction.currentX);
                var minY = Math.min(interaction.startY, interaction.currentY);
                var maxY = Math.max(interaction.startY, interaction.currentY);
                var cam = state.map.camera;
                var selected = new Set(interaction.baseSelection);

                state.listed.forEach(function (texture) {
                    var position = state.map.positions.get(texture.uid);
                    if (!position) return;
                    var sx = position.x * cam.scale + cam.x;
                    var sy = position.y * cam.scale + cam.y;
                    var sw = texture.width * cam.scale;
                    var sh = texture.height * cam.scale;
                    var intersects = sx < maxX && sx + sw > minX && sy < maxY && sy + sh > minY;
                    if (intersects) selected.add(texture.uid);
                });

                state.selected = selected;
                if (!state.primary || !selected.has(state.primary)) {
                    state.primary = selected.size ? selected.values().next().value : null;
                }

                updateSelectionVisuals({ card: false });
            }

            function onWindowPointerUp(event) {
                var interaction = state.interaction;
                if (!interaction) return;
                if (event.pointerId !== interaction.pointerId) return;

                var wasMarquee = interaction.type === 'marquee';
                var wasDrag = interaction.type === 'drag';
                var primaryWasSet = !!state.primary;

                state.interaction = null;
                releasePointer(event.pointerId);
                ui.viewport.classList.remove('panning');
                ui.viewport.classList.remove('selecting');

                if (wasMarquee && !interaction.moved) {
                    // A click on empty space clears selection. updateMarqueeSelection
                    // keeps the base selection for shift-marquee, so restore it here.
                    state.selected = new Set(interaction.baseSelection);
                    state.primary = state.selected.size ? state.selected.values().next().value : null;
                }

                ensureSelectionValid();
                updateSelectionVisuals({ card: true });
                if ((wasDrag || wasMarquee) && primaryWasSet) {
                    scrollPrimaryIntoView();
                }
            }

            function cancelInteraction() {
                if (!state.interaction) return;
                releasePointer(state.interaction.pointerId);
                state.interaction = null;
                ui.viewport.classList.remove('panning');
                ui.viewport.classList.remove('selecting');
                updateSelectionVisuals({ card: false });
            }

            function onViewportWheel(event) {
                if (!state.activeGroup) return;
                event.preventDefault();
                var factor = event.deltaY > 0 ? 0.9 : 1.1;
                var cam = getActiveCamera();
                var rect = ui.viewport.getBoundingClientRect();
                var x = event.clientX - rect.left;
                var y = event.clientY - rect.top;
                setActiveScaleAt(cam.scale * factor, x, y);
            }

            function drawScene() {
                drawGrid();
                drawOverlay();
            }

            function drawGrid() {
                var canvas = ui.gridCanvas;
                var ctx = canvas.getContext('2d');
                var dpr = state.viewport.dpr;
                var width = state.viewport.w;
                var height = state.viewport.h;

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, width, height);

                var cam = getActiveCamera();
                var lineRgb = state.themeFg === 0 ? '0, 0, 0' : '255, 255, 255';

                if (state.showGrid) {
                    drawGridLayer(ctx, lineRgb, 0.022, 100, cam, width, height);
                    drawGridLayer(ctx, lineRgb, 0.055, 500, cam, width, height);
                }

                if (state.showAxes) {
                    ctx.strokeStyle = 'rgba(' + lineRgb + ', 0.13)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    if (cam.x >= 0 && cam.x <= width) {
                        ctx.moveTo(cam.x, 0);
                        ctx.lineTo(cam.x, height);
                    }
                    if (cam.y >= 0 && cam.y <= height) {
                        ctx.moveTo(0, cam.y);
                        ctx.lineTo(width, cam.y);
                    }
                    ctx.stroke();
                }
            }

            function drawGridLayer(ctx, lineRgb, alpha, gridSize, cam, width, height) {
                var spacing = gridSize * cam.scale;
                if (spacing < 8) return;

                var startWorldX = -cam.x / cam.scale;
                var endWorldX = (width - cam.x) / cam.scale;
                var startWorldY = -cam.y / cam.scale;
                var endWorldY = (height - cam.y) / cam.scale;

                var firstX = Math.floor(startWorldX / gridSize) * gridSize;
                var firstY = Math.floor(startWorldY / gridSize) * gridSize;

                ctx.strokeStyle = 'rgba(' + lineRgb + ', ' + alpha + ')';
                ctx.lineWidth = 1;
                ctx.beginPath();

                for (var x = firstX; x <= endWorldX; x += gridSize) {
                    if (x < startWorldX) continue;
                    var sx = x * cam.scale + cam.x;
                    ctx.moveTo(sx, 0);
                    ctx.lineTo(sx, height);
                }

                for (var y = firstY; y <= endWorldY; y += gridSize) {
                    if (y < startWorldY) continue;
                    var sy = y * cam.scale + cam.y;
                    ctx.moveTo(0, sy);
                    ctx.lineTo(width, sy);
                }

                ctx.stroke();
            }

            function drawOverlay() {
                var canvas = ui.overlayCanvas;
                var ctx = canvas.getContext('2d');
                var dpr = state.viewport.dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, state.viewport.w, state.viewport.h);

                if (!state.activeGroup || !state.listed.length) return;

                var cam = state.mode === 'list' ? state.list.camera : state.map.camera;
                var lineRgb = state.themeFg === 0 ? '0, 0, 0' : '255, 255, 255';

                if (state.showOver2048) {
                    var largeTextures;
                    if (state.mode === 'list') {
                        var primaryTexture = findTexture(state.primary);
                        largeTextures = primaryTexture ? [primaryTexture] : [];
                    } else {
                        largeTextures = state.listed;
                    }

                    ctx.beginPath();
                    var hasLarge = false;
                    largeTextures.forEach(function (texture) {
                        if (texture.width <= 2048 && texture.height <= 2048) return;
                        var rect = textureScreenRect(texture, cam);
                        if (rect.w < 1 || rect.h < 1) return;
                        ctx.rect(rect.x, rect.y, rect.w, rect.h);
                        hasLarge = true;
                    });

                    if (hasLarge) {
                        ctx.strokeStyle = 'rgba(255, 82, 82, 0.7)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }

                if (state.mode === 'map' && state.map.hovered && !state.selected.has(state.map.hovered)) {
                    var hoveredTexture = findTexture(state.map.hovered);
                    if (hoveredTexture) {
                        var hoverRect = textureScreenRect(hoveredTexture, cam);
                        ctx.strokeStyle = 'rgba(' + lineRgb + ', 0.58)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(hoverRect.x, hoverRect.y, hoverRect.w, hoverRect.h);
                    }
                }

                state.selected.forEach(function (uid) {
                    var texture = findTexture(uid);
                    if (!texture) return;
                    var selectedRect = textureScreenRect(texture, cam);
                    strokeSelected(ctx, selectedRect);
                });

                if (state.mode === 'map' && state.interaction && state.interaction.type === 'marquee') {
                    var a = state.interaction;
                    var minX = Math.min(a.startX, a.currentX);
                    var maxX = Math.max(a.startX, a.currentX);
                    var minY = Math.min(a.startY, a.currentY);
                    var maxY = Math.max(a.startY, a.currentY);
                    ctx.fillStyle = 'rgba(51, 153, 255, 0.12)';
                    ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
                    ctx.strokeStyle = 'rgba(51, 153, 255, 0.85)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
                }
            }

            function textureScreenRect(texture, cam) {
                var position;
                if (state.mode === 'list') {
                    position = { x: -texture.width / 2, y: -texture.height / 2 };
                } else {
                    position = state.map.positions.get(texture.uid) || { x: 0, y: 0 };
                }
                return {
                    x: position.x * cam.scale + cam.x,
                    y: position.y * cam.scale + cam.y,
                    w: texture.width * cam.scale,
                    h: texture.height * cam.scale
                };
            }

            function strokeSelected(ctx, rect) {
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
            }

            function measureViewport() {
                var rect = ui.viewport.getBoundingClientRect();
                var width = Math.max(1, rect.width);
                var height = Math.max(1, rect.height);
                var dpr = Math.min(window.devicePixelRatio || 1, 2);

                var changed = width !== state.viewport.w || height !== state.viewport.h || dpr !== state.viewport.dpr;
                state.viewport.w = width;
                state.viewport.h = height;
                state.viewport.dpr = dpr;

                if (changed) {
                    [ui.gridCanvas, ui.overlayCanvas].forEach(function (canvas) {
                        var pixelWidth = Math.max(1, Math.round(width * dpr));
                        var pixelHeight = Math.max(1, Math.round(height * dpr));
                        if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
                        if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
                    });
                }

                return changed;
            }

            function observeViewport() {
                if (typeof ResizeObserver === 'undefined') {
                    window.addEventListener('resize', handleViewportResize);
                    return;
                }
                var observer = new ResizeObserver(function () {
                    handleViewportResize();
                });
                observer.observe(ui.viewport);
            }

            function handleViewportResize() {
                var oldW = state.viewport.w;
                var oldH = state.viewport.h;
                var changed = measureViewport();
                if (!changed) return;

                var dw = state.viewport.w - oldW;
                var dh = state.viewport.h - oldH;

                if (!state.activeGroup) {
                    state.map.camera.x = state.viewport.w / 2;
                    state.map.camera.y = state.viewport.h / 2;
                    state.list.camera.x = state.viewport.w / 2;
                    state.list.camera.y = state.viewport.h / 2;
                    drawScene();
                    return;
                }

                if (state.list.initialized) {
                    state.list.camera.x += dw / 2;
                    state.list.camera.y += dh / 2;
                }

                if (state.map.autoFit || state.mode === 'map') {
                    if (state.map.autoFit) {
                        fitMapCamera();
                        return;
                    }
                }

                state.map.camera.x += dw / 2;
                state.map.camera.y += dh / 2;
                cameraChanged();
            }

            function onPanelResizeStart(event) {
                if (event.button !== 0) return;
                event.preventDefault();

                var startX = event.clientX;
                var startWidth = ui.leftPanel.getBoundingClientRect().width;
                var pointerId = event.pointerId;
                var maxWidth = function () {
                    return Math.max(250, Math.min(560, window.innerWidth - 320));
                };

                document.body.style.userSelect = 'none';
                ui.resizeHandle.setPointerCapture(pointerId);

                function onMove(moveEvent) {
                    var width = clamp(startWidth + (moveEvent.clientX - startX), 250, maxWidth());
                    ui.leftPanel.style.width = Math.round(width) + 'px';
                }

                function onUp() {
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.body.style.userSelect = '';
                    try { ui.resizeHandle.releasePointerCapture(pointerId); } catch (e) {}
                    setStoredNumber(PANEL_KEY, Math.round(ui.leftPanel.getBoundingClientRect().width));
                }

                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
            }

            function setLoading(active, text) {
                if (text) ui.loadingText.textContent = text;
                ui.loadingOverlay.classList.toggle('active', !!active);
            }

            function setLoadingText(text) {
                ui.loadingText.textContent = text;
            }

            function showToast(message, isError) {
                if (state.toastTimer) {
                    clearTimeout(state.toastTimer);
                    state.toastTimer = null;
                }
                ui.toast.textContent = message;
                ui.toast.classList.toggle('error', !!isError);
                ui.toast.classList.add('visible');
                state.toastTimer = setTimeout(function () {
                    ui.toast.classList.remove('visible');
                    state.toastTimer = null;
                }, 4000);
            }

            function hasFiles(event) {
                if (!event.dataTransfer) return false;
                var types = event.dataTransfer.types;
                if (!types) return false;
                for (var i = 0; i < types.length; i++) {
                    if (types[i] === 'Files') return true;
                }
                return false;
            }

            function onWindowDragEnter(event) {
                if (!hasFiles(event)) return;
                event.preventDefault();
                state.dragDepth++;
                ui.dragOverlay.classList.add('active');
            }

            function onWindowDragOver(event) {
                if (!hasFiles(event)) return;
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
            }

            function onWindowDragLeave(event) {
                if (!hasFiles(event)) return;
                state.dragDepth = Math.max(0, state.dragDepth - 1);
                if (!event.relatedTarget) state.dragDepth = 0;
                if (state.dragDepth === 0) {
                    ui.dragOverlay.classList.remove('active');
                }
            }

            function onWindowDrop(event) {
                if (!hasFiles(event)) return;
                event.preventDefault();
                state.dragDepth = 0;
                ui.dragOverlay.classList.remove('active');
                setLoading(true, 'Reading dropped folder\u2026');
                collectDroppedEntries(event.dataTransfer).then(function (entries) {
                    if (entries.length) {
                        loadFiles(entries);
                    } else {
                        setLoading(false);
                        showToast('No .webp or .png files found.', true);
                    }
                }).catch(function (error) {
                    console.error('Drop failed:', error);
                    setLoading(false);
                    showToast('Could not read the dropped files.', true);
                });
            }

            async function collectDroppedEntries(dataTransfer) {
                var entries = [];
                var roots = [];

                if (dataTransfer.items) {
                    for (var i = 0; i < dataTransfer.items.length; i++) {
                        var item = dataTransfer.items[i];
                        if (item.kind !== 'file') continue;
                        var entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                        if (entry) roots.push(entry);
                    }
                }

                if (roots.length) {
                    for (var r = 0; r < roots.length; r++) {
                        await walkEntry(roots[r], '', entries);
                    }
                }

                if (!entries.length && dataTransfer.files) {
                    for (var f = 0; f < dataTransfer.files.length; f++) {
                        var file = dataTransfer.files[f];
                        entries.push({
                            file: file,
                            path: file.webkitRelativePath || file.name
                        });
                    }
                }

                return entries;
            }

            async function walkEntry(entry, parentPath, output) {
                var path = parentPath ? parentPath + '/' + entry.name : entry.name;

                if (entry.isFile) {
                    await new Promise(function (resolve, reject) {
                        entry.file(function (file) {
                            output.push({ file: file, path: path });
                            resolve();
                        }, reject);
                    });
                    return;
                }

                if (!entry.isDirectory) return;
                var reader = entry.createReader();

                while (true) {
                    var batch = await new Promise(function (resolve, reject) {
                        reader.readEntries(resolve, reject);
                    });
                    if (!batch.length) break;
                    for (var i = 0; i < batch.length; i++) {
                        await walkEntry(batch[i], path, output);
                    }
                }
            }

            async function readImageSize(file) {
                var header = await file.slice(0, Math.min(file.size, 65536)).arrayBuffer();
                var bytes = new Uint8Array(header);
                var view = new DataView(header);

                if (bytes.length >= 24 &&
                    bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47 &&
                    bytes[12] === 0x49 && bytes[13] === 0x48 && bytes[14] === 0x44 && bytes[15] === 0x52) {
                    return {
                        width: view.getUint32(16, false),
                        height: view.getUint32(20, false)
                    };
                }

                if (bytes.length >= 30 &&
                    bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
                    bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) {
                    var offset = 12;
                    while (offset + 8 <= bytes.length) {
                        var id = String.fromCharCode(bytes[offset], bytes[offset + 1], bytes[offset + 2], bytes[offset + 3]);
                        var chunkSize = view.getUint32(offset + 4, true);
                        var dataOffset = offset + 8;

                        if (id === 'VP8X' && dataOffset + 10 <= bytes.length) {
                            return {
                                width: 1 + readUInt24LE(bytes, dataOffset + 4),
                                height: 1 + readUInt24LE(bytes, dataOffset + 7)
                            };
                        }
                        if (id === 'VP8L' && dataOffset + 5 <= bytes.length) {
                            var bits = view.getUint32(dataOffset + 1, true);
                            return {
                                width: 1 + (bits & 0x3fff),
                                height: 1 + ((bits >>> 14) & 0x3fff)
                            };
                        }
                        if (id === 'VP8 ' && dataOffset + 10 <= bytes.length) {
                            var startCode = bytes[dataOffset + 3] === 0x9d && bytes[dataOffset + 4] === 0x01 && bytes[dataOffset + 5] === 0x2a;
                            if (startCode) {
                                return {
                                    width: view.getUint16(dataOffset + 6, true) & 0x3fff,
                                    height: view.getUint16(dataOffset + 8, true) & 0x3fff
                                };
                            }
                        }

                        offset = dataOffset + chunkSize + (chunkSize & 1);
                    }
                }

                return null;
            }

            function readUInt24LE(bytes, offset) {
                return bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16);
            }

            init();
        })();
    </script>
</body>
</html>
